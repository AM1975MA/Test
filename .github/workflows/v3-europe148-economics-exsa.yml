name: V3 EU148 EXSA beta-factor-only EUR OOS economics
on:
  push:
    branches: [research/v3-europe148-historical-20261024]
    paths:
      - 'etf-trader-v3 corrected/experiments/europe148_2012/EXSA_EVAL_START.txt'
permissions:
  contents: read
  actions: read
jobs:
  economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install economic backtest dependencies
        run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'scipy==1.17.0'
      - name: Retrieve all annual head predictions and verified original EUR OHLCV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/eu148_economic_raw
          gh run download 40218758892 -R AM1975MA/Test -n v3-europe148-2010-vintage-verified-ohlcv -D runs/eu148_economic_raw
          for year in 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            mkdir -p "runs/eu148_heads/$year"
            gh run download 40220925576 -R AM1975MA/Test -n "v3-europe148-exsa-heads-$year" -D "runs/eu148_heads/$year"
            test -s "runs/eu148_heads/$year/YEARLY_EU148_ALL_HEADS.csv"
          done
      - name: Reconstruct single EUR portfolio next-open 10bps per-side costs and 101 signal-mature months
        run: |
          python -u 'etf-trader-v3 corrected/experiments/europe148_2012/evaluate_corrected_economics.py' \
            --heads runs/eu148_heads --raw runs/eu148_economic_raw \
            --out runs/eu148_economic_exsa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-europe148-101-month-exsa-factor-economics
          path: runs/eu148_economic_exsa/
          retention-days: 90
