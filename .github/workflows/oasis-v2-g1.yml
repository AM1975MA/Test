name: OASIS_V2_G1_PAIRED_OPPORTUNITY_SCIENCE
on:
  push:
    branches:
      - research/oasis-v2-paired-forecast-g1-20261018
    paths:
      - 'oasis_v2/g1/**'
      - '.github/workflows/oasis-v2-g1.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  PYTHONPATH: ${{ github.workspace }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  causal-paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Minimal scientific dependencies, no XGBoost or LightGBM
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0'
          python -m py_compile oasis_v2/g1/pairwise.py oasis_v2/g1/test_pairwise.py
      - name: Prove as-of pairwise forecast invariants
        run: |
          python -m unittest -v oasis_v2.g1.test_pairwise
      - name: Run strictly matured chronological paired forecast comparisons
        run: |
          python -m oasis_v2.g1.pairwise --out _g1
      - name: Verify immutable G1 evidence and no purported live alpha
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("_g1/RESULT.json").read_text())
          assert d["status"]=="PAIRED_PREQUENTIAL_G1_COMPLETED"
          assert d["candidate_etfs"]==150
          assert d["anchors_evaluated"]>=40
          assert d["asof_matured_label_invariant"]
          assert d["ever_read_old_LM_predictions"] is False
          assert d["independent_test_data"] is False
          print("OASIS_V2_G1_GATE",d["gate_G1_primary"])
          PY
      - name: Retain all individual pair forecasts and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-v2-g1-prequential-paired-v1
          retention-days: 90
          path: |
            _g1/RESULT.json
            _g1/PREDICTIONS_FULL.csv
