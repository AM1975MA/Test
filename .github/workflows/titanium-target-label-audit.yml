name: Titanium Compact Target Label Audit
on:
  pull_request:
    branches: [titanium-target-audit-base-20260811]
  workflow_dispatch:

jobs:
  target-audit:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: [monthly, d21, d42, d63, multi]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Extract immutable production-aligned runner
        run: |
          git fetch --no-tags origin 28430c0c3487eb7973dc5c6f0d0a569a90d8224c
          git show 28430c0c3487eb7973dc5c6f0d0a569a90d8224c:regeneration/production_aligned_regen.py > production_aligned_regen.py
          python -m py_compile production_aligned_regen.py forensics/compact_target_variant.py
      - name: Download canonical ticker-data package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o a.zip
          mkdir a && unzip -q a.zip -d a
          INNER=$(find a -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' | head -1); test -n "$INNER"
          mkdir canonical && unzip -q "$INNER" -d canonical
          ROOT=$(find canonical -type d -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE' | head -1); test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Run 360-tree 500-basket target variant
        run: |
          python forensics/compact_target_variant.py \
            --runner production_aligned_regen.py \
            --base-module "$ROOT/source/titanium_retrained_current_data_audit.py" \
            --v5-module "$ROOT/source/titanium_reconstruction_v6.py" \
            --data-dir "$ROOT/data" \
            --target '${{ matrix.target }}' \
            --output "TARGET_${{ matrix.target }}"
      - name: Archive
        if: always()
        run: |
          zip -r "TITANIUM_TARGET_${{ matrix.target }}.zip" "TARGET_${{ matrix.target }}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_TARGET_${{ matrix.target }}
          path: "TITANIUM_TARGET_${{ matrix.target }}.zip"
          retention-days: 7
