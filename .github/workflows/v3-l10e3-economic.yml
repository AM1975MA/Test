name: ETF V3 L10.E3 matched economics next-open 10bps
on:
  push:
    branches: [research-v3-l10e3-pair-review-20261022]
    paths:
      - 'etf-trader-v3 corrected/experiments/l10_postrank_trajectory/START_E3_ECON.txt'
permissions:
  contents: read
  actions: read
jobs:
  matched-economic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy==2.2.6 pandas==2.2.3 scipy scikit-learn
      - name: Certified frozen 149 ETF daily OHLCV and unchanged original ML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/l10_frozen runs/e3_output
          gh run download 39482809691 --repo AM1975MA/Test --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          gh run download 39700865721 --repo AM1975MA/Test --name v3-l10-topk5-risk-tier-results --dir runs/l10_frozen
          gh run download 39752940429 --repo AM1975MA/Test --name v3-l10e3-pair-review --dir runs/e3_output
          python regeneration/certify_etf_trader_raw.py
          test -s runs/l10_frozen/OOS_SCORES.csv
          test -s runs/e3_output/SUBSTITUTIONS.csv
      - name: Reconstruct only documented substitutions; benchmark matching next-open 10bp fee
        run: |
          OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 OMP_NUM_THREADS=1 python \
            'etf-trader-v3 corrected/experiments/l10_postrank_trajectory/economic_e3.py' \
            --raw etf_trader_raw \
            --scores runs/l10_frozen/OOS_SCORES.csv \
            --e3-substitutions runs/e3_output/SUBSTITUTIONS.csv \
            --e3-manifest runs/e3_output/MANIFEST.json \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out runs/e3_economic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l10e3-matched-economic-nextopen-10bp
          path: runs/e3_economic/
          retention-days: 90
