name: ETF trader ranker stability V1 phase A

on:
  push:
    branches:
      - research/ranker-stability-v1
    paths:
      - .github/workflows/ranker-stability-v1-phase-a.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        model:
          - XGB_CANONICAL
          - LGBM_XENDCG
          - LGBM_LAMBDARANK
          - CAT_YETI
          - RIDGE_POINTWISE
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      ETF_TRADER_XGB_THREADS_PER_WORKER: "1"
      ETF_TRADER_XGB_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen benchmark environment
        run: |
          python -m pip install             "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0"             "xgboost==3.1.3" "lightgbm==4.7.0" "catboost==1.2.8"             pyarrow scipy
      - name: Restore frozen Titanium Compact panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _ti/repeat1 _ti/repeat2 _ti/repeat3
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-1 -D _ti/repeat1
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-2 -D _ti/repeat2
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-3 -D _ti/repeat3
          test -f _ti/repeat1/TI_COMPACT.parquet
          test -f _ti/repeat2/TI_COMPACT.parquet
          test -f _ti/repeat3/TI_COMPACT.parquet
      - name: Run model benchmark
        run: |
          mkdir -p _result
          python ranker_stability_v1/run_ranker_benchmark.py             --model "${{ matrix.model }}"             --r1 _ti/repeat1 --r2 _ti/repeat2 --r3 _ti/repeat3             --out "_result/${{ matrix.model }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ranker-v1-${{ matrix.model }}
          retention-days: 90
          path: _result/*.json

  summarize:
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ranker-v1-*
          path: _all
      - name: Aggregate and apply preregistered promotion gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          rows={}
          for p in Path("_all").rglob("*.json"):
              q=json.loads(p.read_text()); rows[q["model"]]=q
          base=rows["XGB_CANONICAL"]["aggregate_mean"]
          table=[]
          eligible=[]
          for name,q in rows.items():
              a=q["aggregate_mean"]
              rank_improve=(base["rank_mean_abs"]-a["rank_mean_abs"])/base["rank_mean_abs"]
              ndcg_ratio=a["ndcg5"]/base["ndcg5"] if base["ndcg5"] else 0
              pass_gate=bool(
                  name!="XGB_CANONICAL"
                  and rank_improve>=0.25
                  and a["top1_disagreement_fraction"]<=base["top1_disagreement_fraction"]
                  and a["mean_daily_spearman_stability"]>=base["mean_daily_spearman_stability"]
                  and ndcg_ratio>=0.95
                  and q["ALL_MATURITY_PASS"]
              )
              rec={
                  "model":name,**a,
                  "rank_mean_abs_improvement_vs_xgb_pct":100*rank_improve,
                  "ndcg5_ratio_vs_xgb":ndcg_ratio,
                  "maturity_pass":q["ALL_MATURITY_PASS"],
                  "determinism_pass":q["ALL_DETERMINISM_PASS"],
                  "PROMOTE_PHASE_B":pass_gate,
              }
              table.append(rec)
              if pass_gate: eligible.append(name)
          table.sort(key=lambda x:(not x["PROMOTE_PHASE_B"],x["rank_mean_abs"],-x["ndcg5"]))
          out={
              "status":"RANKER_STABILITY_V1_PHASE_A_COMPLETE",
              "baseline":"XGB_CANONICAL",
              "promotion_rule":"rank MAE >=25% better; Top1 no worse; stability Spearman no worse; NDCG@5 >=95%; maturity PASS",
              "eligible_phase_b":eligible,
              "ranking":table,
              "models":rows,
          }
          Path("ranker_stability_v1/results").mkdir(parents=True,exist_ok=True)
          Path("ranker_stability_v1/results/PHASE_A.json").write_text(json.dumps(out,indent=2)+"\n")
          md=["# Ranker stability V1 — Phase A results","","| Model | rank Δ abs | stable Spearman | Top1 disagree | Top5 Jaccard | NDCG@5 | target Spearman | sec/fit | Promote |","|---|---:|---:|---:|---:|---:|---:|---:|---|"]
          for x in table:
              md.append(f'| {x["model"]} | {x["rank_mean_abs"]:.6f} | {x["mean_daily_spearman_stability"]:.6f} | {x["top1_disagreement_fraction"]:.3f} | {x["top5_jaccard"]:.3f} | {x["ndcg5"]:.4f} | {x["daily_spearman_vs_target"]:.4f} | {x["mean_fit_predict_seconds"]:.2f} | {"YES" if x["PROMOTE_PHASE_B"] else "NO"} |')
          md+=["",f"Eligible Phase B: {', '.join(eligible) if eligible else 'none'}"]
          Path("ranker_stability_v1/results/PHASE_A.md").write_text("\n".join(md)+"\n")
          print(json.dumps({"eligible":eligible,"table":table},indent=2))
          PY
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranker_stability_v1/results/PHASE_A.json ranker_stability_v1/results/PHASE_A.md
          git commit -m "Persist ranker stability V1 Phase A"
          git pull --rebase --autostash origin research/ranker-stability-v1
          git push origin HEAD:research/ranker-stability-v1
      - uses: actions/upload-artifact@v4
        with:
          name: ranker-stability-v1-phase-a-summary
          retention-days: 90
          path: ranker_stability_v1/results/
