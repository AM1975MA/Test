name: OASIS149_G5_OPTIONS_PREDICTIVE_RISK_VARIANCE
on:
  push:
    branches:
      - research/oasis149-cboe-impliedvol-g4b-20261018
    paths:
      - 'oasis149/cboe_g4b/risk_g5/variance.py'
      - 'oasis149/cboe_g4b/risk_g5/test_variance.py'
      - 'oasis149/cboe_g4b/risk_g5/PROTOCOL_FROZEN.md'
      - '.github/workflows/oasis149-cboe-g5.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONHASHSEED: '0'
  PYTHONPATH: ${{ github.workspace }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  independent-risk-forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Minimal source verified statistical runtime
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'requests==2.32.5'
          python -m py_compile oasis149/cboe_g4b/risk_g5/variance.py oasis149/cboe_g4b/risk_g5/test_variance.py
      - name: Prove forward outcomes cannot modify as-of volatility forecasts
        run: |
          python -m unittest -v oasis149.cboe_g4b.risk_g5.test_variance oasis149.cboe_g4b.test_asof
      - name: Verify archived source and calculate 384 new held-position risk outcomes
        run: |
          python -m oasis149.cboe_g4b.risk_g5.variance --out _g5
      - name: Audit no invented options for bonds and 64 independent anchor counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("_g5/RESULT.json").read_text())
          assert d["status"]=="ORIGINAL149_CBOE_G5_RISK_VARIANCE_COMPLETED"
          assert d["n_orig_149_etfs"]==149
          assert d["n_anchors"]==64
          assert d["n_positions"]==384 and d["n_mapped_positions"]==320
          assert d["score_by_group"]["C05_BONDS_CASH_CREDIT"]["K2_CBOE_CALIBRATED"]["n"]==0
          assert d["no_switches_or_returns_optimized"]
          print("OASIS149_G5_CALIBRATION_GATE",d["preregistered_gates"])
          PY
      - name: Commit complete realized variance predictions and source receipts
        run: |
          mkdir -p oasis149/cboe_g4b/risk_g5/results
          cp _g5/*.csv _g5/*.json oasis149/cboe_g4b/risk_g5/results/
          (cd oasis149/cboe_g4b/risk_g5/results && sha256sum *.csv *.json > SHA256_MANIFEST.txt)
          (cd oasis149/cboe_g4b/risk_g5/results && sha256sum -c SHA256_MANIFEST.txt)
          git config user.name "OASIS149-RiskVariance-Scientist"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oasis149/cboe_g4b/risk_g5/results
          git commit -m "Archive ex-ante 21d ETF realized-variance risk probability substitute QLIKE diagnostics, CBOE factors, and strict accepted/rejected gates"
          git push origin HEAD:refs/heads/research/oasis149-cboe-impliedvol-g4b-20261018
      - name: Retain immutable risk evaluation even when scientific gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis149-g5-independent-risk-variance-prequential
          retention-days: 90
          path: |
            _g5/*.csv
            _g5/*.json
