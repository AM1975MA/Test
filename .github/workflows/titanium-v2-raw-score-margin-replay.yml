name: Titanium V2 raw-score margin replay

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/apply_exact_v2_raw_score_margin.py'
      - '.github/workflows/titanium-v2-raw-score-margin-replay.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 numba pyarrow matplotlib
      - name: Download best corrected OOS scores
        uses: actions/download-artifact@v4
        with:
          name: TITANIUM_PLATINUM_COMPACT_EXACT_TAIL_CVAR
          path: best
          repository: AM1975MA/Test
          run-id: 31647358105
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch execution margin and replay
        run: |
          ROOT=$(dirname "$(find best -name OOS_TICKER_SCORES.parquet | head -1)")
          EXEC=$(find best -path '*/source/exact_execution.py' | head -1)
          cp "$EXEC" work_execution.py
          python titanium_training_native/apply_exact_v2_raw_score_margin.py --source work_execution.py
          python -m py_compile work_execution.py
          python titanium_training_native/replay_macro_gate_from_artifact.py --root "$ROOT" --execution-source work_execution.py --output results
      - name: Fingerprint
        run: |
          ROOT=$(dirname "$(find best -name COMPACT_LABELED.parquet | head -1)")
          python titanium_training_native/audit_titanium_selection_fingerprint.py --scores results/OOS_TICKER_SCORES.parquet --labels "$ROOT/COMPACT_LABELED.parquet" --membership "$ROOT/BASKET_MEMBERSHIP_500.csv" --output results/fingerprint
      - name: Preserve patched execution
        run: cp work_execution.py results/exact_execution_raw_score_margin.py
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_V2_RAW_SCORE_MARGIN_REPLAY
          path: results
          retention-days: 30
