name: EU120 MX extras probe
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas yfinance
      - run: python europe120/probe_mx_extras.py
