name: V3 Europe48 controlled ranker leaf capacity root-cause ablation
on:
  push:
    branches:
      - research/v3-europe48-rootcause-leaves-20261024
    paths:
      - 'etf-trader-v3 corrected/experiments/europe48_transfer/CAPACITY_AUDIT_START.txt'
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:vendor/etf_trader_v2/src
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        year: [2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Match original Europe48 V3 pinned packages
        run: |
          pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'numba==0.65.1' 'pyarrow==23.0.1' 'matplotlib==3.10.8'
          python -m py_compile 'etf-trader-v3 corrected/experiments/europe48_transfer/diagnose_leaf_capacity.py'
      - name: Recover original Euro48 ISIN and US macro prior-close inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _US149_ORIG
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _US149_ORIG
          python -m isin_first2026.v2_unrestricted48.prepare --out _EU48_PREP
      - name: Compare 15 31 63 and certified 127 leaves without any other algorithm change
        run: |
          python -u 'etf-trader-v3 corrected/experiments/europe48_transfer/diagnose_leaf_capacity.py' \
            --year ${{ matrix.year }} --prep _EU48_PREP --us _US149_ORIG \
            --fx europe_only75/f3h1_original_transfer/results/EURUSD_PRIOR_US_CLOSE.csv \
            --out _EU48_CAPACITY_${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-europe48-capacity-diagnostic-${{ matrix.year }}
          path: _EU48_CAPACITY_${{ matrix.year }}/
          retention-days: 90
