name: Evidence V1 freeze universe-sensitivity subsets

on:
  push:
    branches: [ research/evidence-v1 ]
    paths:
      - '.github/workflows/evidence-v1-freeze-universe-sensitivity-subsets.yml'
      - 'evidence_v1/src/freeze_universe_sensitivity_v1_subsets.py'
      - 'evidence_v1/protocols/UNIVERSE_SENSITIVITY_V1_SUBSET_FREEZE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-subsets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Fail-closed frozen input gate
        run: |
          set -euo pipefail
          test "$(git hash-object evidence_v1/src/freeze_universe_sensitivity_v1_subsets.py)" = "6fecaae82c7ef28d8559e01aac55212b9135d194"
          test "$(git hash-object evidence_v1/protocols/UNIVERSE_SENSITIVITY_V1_SUBSET_FREEZE.md)" = "a452cd5a6807a87adb0136f44f43178cf4bea281"
          test "$(git hash-object evidence_v1/data/original149/universe.csv)" = "7d176c3963e3bc69c53745a68e1a1e8db6ca570d"
          echo "1efba2bc213ba26b042a9e77630fe26664343654629e658f43d314d068ba9e71  evidence_v1/DATA_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "cc4d315da68ec42275a7a74f05446ac6cbb484c3bd92a7861cd76805c5a94782  evidence_v1/SOURCE_MANIFEST_SHA256.txt" | sha256sum -c -
          (cd evidence_v1/data && sha256sum -c ../DATA_MANIFEST_SHA256.txt)
          (cd evidence_v1/source && sha256sum -c ../SOURCE_MANIFEST_SHA256.txt)

      - name: Install deterministic subset runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5

      - name: Generate subsets from metadata only
        run: |
          rm -rf _evidence_v1_universe_subsets
          python evidence_v1/src/freeze_universe_sensitivity_v1_subsets.py \
            --universe evidence_v1/data/original149/universe.csv \
            --out _evidence_v1_universe_subsets
          cat _evidence_v1_universe_subsets/SUBSET_MANIFEST.json

      - name: Persist frozen subset inputs
        run: |
          set -euo pipefail
          rm -rf evidence_v1/protocols/universe_sensitivity_v1
          mkdir -p evidence_v1/protocols/universe_sensitivity_v1
          cp _evidence_v1_universe_subsets/* evidence_v1/protocols/universe_sensitivity_v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_v1/protocols/universe_sensitivity_v1
          git diff --cached --stat
          git commit -m "Freeze Evidence V1 universe-sensitivity candidate subsets"
          git pull --rebase origin research/evidence-v1
          git push origin HEAD:research/evidence-v1

      - name: Upload frozen subset manifest
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v1-universe-sensitivity-subsets
          retention-days: 90
          if-no-files-found: error
          path: evidence_v1/protocols/universe_sensitivity_v1/*
