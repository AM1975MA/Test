name: INDEPENDENT_STOCHASTIC_ERGODIC_EU60_V1
on:
  push:
    branches:
      - research/independent-stochastic-ergodic-20261018
    paths:
      - 'independent_stochastic/**'
      - '.github/workflows/independent-stochastic.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONHASHSEED: '0'
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}/europe120/eu120_retrain:${{ github.workspace }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  independent-stochastic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen compatible numeric runtime
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
          python -m py_compile independent_stochastic/physics.py independent_stochastic/experts.py independent_stochastic/run.py
      - name: Load only frozen evaluation calendar, never old ML scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39084898663 -R AM1975MA/Test -n europe-only-eur60-hindsight-oracle -D _oracle
          test -f _oracle/MONTHLY_ORACLE_113.csv
      - name: Evaluate nine pre-registered stochastic and game-theoretic policies
        run: |
          python independent_stochastic/run.py --oracle _oracle --out _stoch_only
      - name: Preserve all stochastic monthly selections and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-stochastic-ergodic-eu60-v1
          retention-days: 90
          path: |
            _stoch_only/RESULT.json
            _stoch_only/MONTHLY_LEDGER.csv
            _stoch_only/MONTHLY_SIGNALS.json
