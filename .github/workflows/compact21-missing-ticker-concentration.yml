name: COMPACT21_MISSING_TICKER_CONCENTRATION
on:
  push:
    branches: [research/compact21-missing-ticker-concentration-20261011]
    paths: [.github/workflows/compact21-missing-ticker-concentration.yml]
permissions: {contents: read, actions: read}
jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
      - name: Restore existing six frozen panels
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 38094232042 -R ${{ github.repository }} -n compact21-two-alpha-panels-v1 -D _panels
      - name: Count affected ETFs
        run: python data_quality_audit_v1/missing_ticker_concentration.py
      - uses: actions/upload-artifact@v4
        with: {name: compact21-missing-ticker-concentration, path: _out/}
