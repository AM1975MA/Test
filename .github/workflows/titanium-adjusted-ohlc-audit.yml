name: Titanium adjusted OHLC audit

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/audit_adjusted_ohlc_path.py'
      - '.github/workflows/titanium-adjusted-ohlc-audit.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow
      - name: Download canonical V1 outputs
        uses: actions/download-artifact@v4
        with:
          name: TITANIUM_TRAINING_NATIVE_V1_CANONICAL
          path: v1
          repository: AM1975MA/Test
          run-id: 31616228523
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare OHLC paths
        run: python titanium_training_native/audit_adjusted_ohlc_path.py --root v1 --output results
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_ADJUSTED_OHLC_AUDIT
          path: results
          retention-days: 30
