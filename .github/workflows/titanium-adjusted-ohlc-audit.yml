name: Titanium adjusted OHLC audit

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/audit_adjusted_ohlc_path.py'
      - '.github/workflows/titanium-adjusted-ohlc-audit.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow
      - name: Download canonical V1 matrices
        uses: actions/download-artifact@v4
        with:
          name: TITANIUM_TRAINING_NATIVE_V1_CANONICAL
          path: v1
          repository: AM1975MA/Test
          run-id: 31616228523
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download historical raw fixture
        uses: actions/download-artifact@v4
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE
          path: fixture
          repository: AM1975MA/Test
          run-id: 31464219662
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recursively extract raw fixture
        run: |
          mkdir -p fixture_pkg
          unzip -q fixture/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip -d fixture_pkg
          for pass in 1 2 3; do
            while IFS= read -r -d '' z; do
              d="${z%.zip}_unpacked"
              if [ ! -d "$d" ]; then mkdir -p "$d"; unzip -q "$z" -d "$d" || true; fi
            done < <(find fixture_pkg -type f -name '*.zip' -print0)
          done
          find fixture_pkg -name DAILY_OHLCV_ACTIONS_150ETF.parquet -print
      - name: Compare OHLC paths
        run: |
          python titanium_training_native/audit_adjusted_ohlc_path.py \
            --matrix-root v1 \
            --raw-root fixture_pkg \
            --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_ADJUSTED_OHLC_AUDIT
          path: results
          retention-days: 30
