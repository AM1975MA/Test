name: LISTNET_EXACT_HISTORICAL_LINKAGE
on:
  push:
    branches: [research/paper-ltr-feasibility-20261012]
    paths: [.github/workflows/listnet-exact-linkage.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Richiedi istruzioni CPU compatibili prima di installare o scaricare dati
        run: |
          python3 -c "from pathlib import Path; flags=Path('/proc/cpuinfo').read_text(); assert 'avx512f' in flags.lower(), 'HOST_NON_COMPATIBILE_AVX512: nessun dato scaricato e nessun fit'"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ambiente storico per la sola ricostruzione delle feature
        run: python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'numba==0.65.1' 'threadpoolctl==3.6.0' 'matplotlib==3.10.8'
      - name: Recupera gli input e le cache giÃ  congelati
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 38179662587 -R AM1975MA/Test -n paper-ltr-feasibility -D _original
          for repeat in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$repeat -D "_ti/r$repeat"
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$repeat -D "_bases/r$repeat"
          done
      - name: Confronto esatto sotto dispatch storico, nessun addestramento
        run: |
          for repeat in 1 2 3; do
            python paper_ltr_v2/replay.py --audit-only --raw "_raw/_repeat$repeat" --baseline "_bases/r$repeat" --candidate _original/_candidate --repeat "$repeat" --ti-panel "_ti/r$repeat/TI_COMPACT.parquet" --out "_reference/linkage-r$repeat"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listnet-exact-historical-linkage
          retention-days: 90
          path: _reference/
