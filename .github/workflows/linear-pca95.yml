name: LINEAR_PCA95_FROZEN_ANNUAL
on:
  push:
    branches: [research/linear-pca95-20261016]
    paths: [.github/workflows/linear-pca95.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  pca:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen numerical runtime and regression tests
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python -c "from etf_trader.source_only import kernel; print('KERNEL_IMPORT_PASS')"
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s linear_pca_v1/tests -v
          python -m unittest discover -s paper_ltr_v2/tests -v
      - name: Reuse original frozen panels, raw and completed controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38580178650 -R AM1975MA/Test -n listnet-linear-relative-repair -D _annual
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _baseline
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-audit -D _audit
          for i in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$i -D _ti/r$i
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$i -D _bases/r$i
          done
      - name: PCA95 training-only annual fits and full-rotation invariance controls
        run: python linear_pca_v1/run.py --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --annual _annual/_candidate --baseline _baseline --out _pca/_candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linear-pca95-models
          retention-days: 90
          path: _pca/_candidate/
      - name: Independent PCA, inference and projected-gradient audit
        run: python linear_pca_v1/audit.py --candidate _pca/_candidate --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --out _pca/AUDIT.json
      - name: Complete frozen portfolio comparison
        run: |
          mkdir -p _replays
          cp -r _annual/_replays/* _replays/
          for i in 1 2 3; do
            python paper_ltr_v2/replay.py --raw _raw/_repeat$i --baseline _bases/r$i --candidate _pca/_candidate --repeat $i --ti-panel _ti/r$i/TI_COMPACT.parquet --linkage-audit _audit/linkage-r$i/INPUT_LINKAGE.json --out _replays/v2replay-LINEAR_PCA95-r$i
          done
          python linear_pca_v1/summarize.py --replays _replays --candidate _pca/_candidate --annual _annual/_candidate --audit _pca/AUDIT.json --out _pca/_comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linear-pca95-comparison
          retention-days: 90
          path: |
            _pca/AUDIT.json
            _pca/_comparison/
            _replays/v2replay-LINEAR_PCA95-*/
