name: V3 Europe48 127leaf decision tree causal EU account economic benchmark
on:
  push:
    branches:
      - research/v3-europe48-tree-transfer-20261024
    paths:
      - 'etf-trader-v3 corrected/experiments/europe48_transfer/TREE_START.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:vendor/etf_trader_v2/src
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fixed Euro execution and decision forest packages
        run: |
          pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'numba==0.65.1' 'pyarrow==23.0.1' 'matplotlib==3.10.8'
          python -m py_compile 'etf-trader-v3 corrected/experiments/europe48_transfer/v3_europe48_tree_econ.py'
      - name: Certified European raw OHLCV preparation and immutable 6-year V3 source-only firststage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m isin_first2026.v2_unrestricted48.prepare --out _EU48_PREP
          for year in 2021 2022 2023 2024 2025 2026; do
            mkdir -p "_V3_EU48_HEADS/$year"
            gh run download 40086216896 -R AM1975MA/Test \
              -n "v3-europe48-127leaf-heads-$year" -D "_V3_EU48_HEADS/$year"
            test -s "_V3_EU48_HEADS/$year/EU48_V3_FIRSTSTAGE_SCORES.csv"
          done
      - name: Strict prior 125F EU48 next-open EUR economic match, nested V3 tree, Top1/2/3/5 compared
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u 'etf-trader-v3 corrected/experiments/europe48_transfer/v3_europe48_tree_econ.py' \
            --heads _V3_EU48_HEADS --prep _EU48_PREP \
            --out _EU48_V3_127_TREE_ECON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-europe48-127leaf-tree-economic-benchmark
          path: _EU48_V3_127_TREE_ECON/
          retention-days: 90
