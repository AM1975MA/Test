name: Titanium monthly target maturity recovery
on:
  workflow_dispatch:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths: ['.github/workflows/titanium-mq.yml']
permissions: {contents: read, actions: read}
jobs:
  mq:
    strategy:
      fail-fast: false
      matrix: {mode: [MAT21_ONLY, MAT21_QUAL]}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 numba pyarrow matplotlib
      - uses: actions/download-artifact@v4
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE
          path: input
          repository: AM1975MA/Test
          run-id: 31464219662
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p input/package work && unzip -q input/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip -d input/package
      - run: python titanium_training_native/rebuild_v1.py --runner-input input/package/HISTORICAL_F2D_RECOVERY/code/HISTORICAL_F2D_RUNNER.py --execution-input input/package/HISTORICAL_F2D_RECOVERY/code/source_execution_reconstruction.py --runner-output work/titanium.py --execution-output work/exact.py
      - run: python titanium_training_native/apply_maturity_quality_ablation.py --source work/titanium.py --mode ${{ matrix.mode }}
      - run: python work/titanium.py --base-module input/package/HISTORICAL_F2D_RECOVERY/code/source_feature_engine.py --v5-module work/exact.py --data-dir input/package/HISTORICAL_F2D_RECOVERY --output results --n-estimators 360 --n-baskets 500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_MQ_${{ matrix.mode }}
          path: results
          retention-days: 30
