name: Holdout60 frozen download

on:
  push:
    branches:
      - research/holdout60-20261002
    paths:
      - 'holdout60/**'
      - '.github/workflows/holdout60-download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'yfinance>=0.2.66,<1' 'pyarrow>=16,<24'

      - name: Download and quality-gate 60 ETFs
        run: |
          python holdout60/download_holdout60.py

      - name: Show frozen universe
        if: always()
        run: |
          if [ -f holdout60/output/manifest.json ]; then cat holdout60/output/manifest.json; fi
          if [ -f holdout60/output/coverage.csv ]; then echo '--- coverage ---'; cat holdout60/output/coverage.csv; fi
          if [ -f holdout60/output/rejected.csv ]; then echo '--- rejected ---'; cat holdout60/output/rejected.csv; fi

      - name: Upload frozen holdout60
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: holdout60-frozen-20260731
          path: holdout60/output/
          if-no-files-found: error
          retention-days: 30
