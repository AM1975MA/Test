name: COMPACT21_PLS_XGB_CANONICAL_COMPARE
on:
  pull_request:
    branches: [research/compact21-signal-lockin-20261016]
    paths: [.github/workflows/compact21-pls-xgb.yml, 'pls_xgb_v1/**', paper_ltr_v2/replay.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  ranked-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen numerical profile and verify feature extraction
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python -m py_compile pls_xgb_v1/core.py pls_xgb_v1/run.py pls_xgb_v1/summarize.py
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s pls_xgb_v1/tests -v
          python -m unittest discover -s signal_lockin_v1/tests -v
      - name: Download frozen original149 panels and exact annual controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38580178650 -R AM1975MA/Test -n listnet-linear-relative-repair -D _annual
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _baseline
          for i in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$i -D _ti/r$i
          done
      - name: Fit 270 canonical XGB seed models and audit heldout rankings
        run: |
          python pls_xgb_v1/run.py --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --annual _annual/_candidate --baseline _baseline --out _pls_xgb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pls-xgb-predictive
          retention-days: 90
          path: _pls_xgb/
      - name: Fetch immutable portfolio references for parity replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-audit -D _audit
          for i in 1 2 3; do
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$i -D _bases/r$i
          done
      - name: Nine complete canonical V2 replays, unchanged risk and costs
        run: |
          mkdir -p _replays
          for variant in XGB125_MATCHED XGB_PLS12 XGB_PLS12_COHERENCE; do
            for i in 1 2 3; do
              python paper_ltr_v2/replay.py --raw _raw/_repeat$i --baseline _bases/r$i --candidate _pls_xgb/$variant --repeat $i --ti-panel _ti/r$i/TI_COMPACT.parquet --linkage-audit _audit/linkage-r$i/INPUT_LINKAGE.json --out _replays/v2replay-$variant-r$i
            done
          done
          python pls_xgb_v1/summarize.py --replays _replays --out _replays/ECONOMIC_SUMMARY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pls-xgb-economic
          retention-days: 90
          path: _replays/
