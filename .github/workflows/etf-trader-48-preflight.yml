name: ETF_TRADER_HYBRID24_EU48_SOURCE_INPUT_PREFLIGHT
on:
  push:
    branches:
      - research/etf-trader-hybrid24-eu48-port-20261019
    paths:
      - '.github/workflows/etf-trader-48-preflight.yml'
      - 'isin_first2026/etftrader48/prepare.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prep-raw-48:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: vendor/etf_trader_v2/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
          python -m py_compile isin_first2026/etftrader48/prepare.py
          python -m isin_first2026.etftrader48.prepare --out _TRADER48_PREP
      - name: Test real source vendor strict loader and original 500 6x4 baskets
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          from etf_trader.source_only.raw_io import load_ticker_csv_folder
          from etf_trader.source_only.baskets import build_canonical_baskets
          p=Path("_TRADER48_PREP/raw_ticker_csv")
          matrices,cats,provenance=load_ticker_csv_folder(p)
          d=pd.read_csv(p/"universe.csv")
          assert len(d)==48 and d["isin"].is_unique
          b=build_canonical_baskets(d,list(matrices["Close"].columns))
          assert len(b)==12000 and b.basket.nunique()==500
          assert b.groupby("basket").size().eq(24).all()
          assert b.groupby("basket").ticker.nunique().eq(24).all()
          assert set(cats.values())==set(d.macro_category)
          print("TRADER48_PREFLIGHT_OK",provenance["tickers"],b.basket.nunique())
          PY
      - name: Archive preflight provenance and source changes, no bulk prices redundant
        run: |
          mkdir -p isin_first2026/etftrader48/preview
          cp _TRADER48_PREP/RESULT.json isin_first2026/etftrader48/preview/RESULT.json
          cp _TRADER48_PREP/SOURCE_AND_OHLC_REPAIR_AUDIT.csv isin_first2026/etftrader48/preview/SOURCE_AND_OHLC_REPAIR_AUDIT.csv
          git config user.name "ETF-TRADER48-DATA-PORT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isin_first2026/etftrader48/preview
          git commit -m "Verify raw 48 EUR ETF venue data and 500 unique 24-fund basket source contract" || true
          git pull --rebase origin research/etf-trader-hybrid24-eu48-port-20261019
          git push origin HEAD:refs/heads/research/etf-trader-hybrid24-eu48-port-20261019
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader48-raw-venue-corrected-envelope-not-original
          retention-days: 30
          path: _TRADER48_PREP
