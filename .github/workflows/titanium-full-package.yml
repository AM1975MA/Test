name: Titanium Full Live Package
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
jobs:
  full-package:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      NUMBA_DISABLE_CACHING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen-compatible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Reconstruct production-aligned engine
        run: |
          mkdir -p upstream/gzpayload upstream/reconstruction
          for f in gz_00.b64 gz_01.b64 gz_02.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-source-faithful-20260803/gzpayload/$f" -o "upstream/gzpayload/$f"; done
          cat upstream/gzpayload/gz_*.b64 | base64 -d | gzip -dc > upstream/titanium_retrained_current_data_audit.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  upstream/titanium_retrained_current_data_audit.py' | sha256sum -c -
          for f in rv5_00.b64 rv5_01.b64 rv5_02.b64 rv5_04.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/reconstruction/$f"; done
          for f in rv5_03a.b64 rv5_03b.b64 rv5_03c.b64 rv5_03d.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/reconstruction/$f"; done
          cat upstream/reconstruction/rv5_00.b64 upstream/reconstruction/rv5_01.b64 upstream/reconstruction/rv5_02.b64 upstream/reconstruction/rv5_03a.b64 upstream/reconstruction/rv5_03b.b64 upstream/reconstruction/rv5_03c.b64 upstream/reconstruction/rv5_03d.b64 upstream/reconstruction/rv5_04.b64 | base64 -d | gzip -dc > upstream/titanium_reconstruction_v5.py
          echo 'ba99f9ce08d96e6b56567d44bf18b5caa7a76ccf13a7d44546e6d1416d79d65a  upstream/titanium_reconstruction_v5.py' | sha256sum -c -
          sed -i 's/@njit(cache=True)/@njit(cache=False)/g; s/@njit(parallel=True,cache=True)/@njit(parallel=True,cache=False)/g' upstream/titanium_reconstruction_v5.py
          curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/28430c0c3487eb7973dc5c6f0d0a569a90d8224c/regeneration/production_aligned_regen.py" -o production_aligned_regen.py
          python - <<'PY'
          from pathlib import Path
          p=Path('production_aligned_regen.py'); s=p.read_text()
          old="""    mats={k:pd.read_parquet(out/f'{k.upper()}.parquet') for k in ['Open','High','Low','Close','Volume']};longs=[]
    for k,x in mats.items(): longs.append(x.stack(dropna=False).rename(k.lower()).reset_index().rename(columns={'level_0':'date','level_1':'ticker'}))
    daily=longs[0]
    for x in longs[1:]:daily=daily.merge(x,on=['date','ticker'],how='outer')
"""
          new="""    mats={k:pd.read_parquet(out/f'{k.upper()}.parquet') for k in ['Open','High','Low','Close','Volume']}
    daily=pd.concat({k.lower():x.stack(dropna=False) for k,x in mats.items()},axis=1).reset_index()
    daily.columns=['date','ticker']+list(daily.columns[2:])
"""
          if old not in s: raise SystemExit('packager patch target not found')
          p.write_text(s.replace(old,new))
          PY
          python -m py_compile upstream/*.py production_aligned_regen.py
      - name: Download ticker OHLCV matrices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/8839840705/zip -o prior.zip
          mkdir prior && unzip -q prior.zip -d prior
          for f in OPEN HIGH LOW CLOSE VOLUME; do test -s "prior/titanium_retrained_output/${f}.parquet"; done
      - name: Regenerate production-aligned complete package
        run: |
          python production_aligned_regen.py \
            --base-module upstream/titanium_retrained_current_data_audit.py \
            --v5-module upstream/titanium_reconstruction_v5.py \
            --data-dir prior/titanium_retrained_output \
            --output METEOR_TITANIUM_V2_OPPORTUNITY_V3_REGENERATED \
            --n-estimators 360 --n-baskets 500 | tee FULL_PACKAGE_RUN_LOG.txt
          test -f METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip
          test -f METEOR_TITANIUM_V2_OPPORTUNITY_V3_REGENERATED/NPORT_TITANIUM_PANEL.parquet
          test -f METEOR_TITANIUM_V2_OPPORTUNITY_V3_REGENERATED/SUPER_GOLD_OOS_SCORE_PANEL.parquet
          test -f METEOR_TITANIUM_V2_OPPORTUNITY_V3_REGENERATED/DAILY_OHLCV_ACTIONS_150ETF.parquet
          sha256sum METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip > METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE_PRODUCTION_ALIGNED_COMPLETE
          path: |
            METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip
            METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE_SHA256.txt
            FULL_PACKAGE_RUN_LOG.txt
          retention-days: 14
