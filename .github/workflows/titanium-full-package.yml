name: Titanium Exact V23 Live Package
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  exact-v23-package:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Reconstruct verified Titanium sources
        run: |
          mkdir -p upstream/gzpayload upstream/reconstruction
          for f in gz_00.b64 gz_01.b64 gz_02.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-source-faithful-20260803/gzpayload/$f" -o "upstream/gzpayload/$f"; done
          cat upstream/gzpayload/gz_*.b64 | base64 -d | gzip -dc > upstream/titanium_retrained_current_data_audit.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  upstream/titanium_retrained_current_data_audit.py' | sha256sum -c -
          for f in rv5_00.b64 rv5_01.b64 rv5_02.b64 rv5_04.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/reconstruction/$f"; done
          for f in rv5_03a.b64 rv5_03b.b64 rv5_03c.b64 rv5_03d.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/reconstruction/$f"; done
          cat upstream/reconstruction/rv5_00.b64 upstream/reconstruction/rv5_01.b64 upstream/reconstruction/rv5_02.b64 upstream/reconstruction/rv5_03a.b64 upstream/reconstruction/rv5_03b.b64 upstream/reconstruction/rv5_03c.b64 upstream/reconstruction/rv5_03d.b64 upstream/reconstruction/rv5_04.b64 | base64 -d | gzip -dc > upstream/titanium_reconstruction_v5.py
          echo 'ba99f9ce08d96e6b56567d44bf18b5caa7a76ccf13a7d44546e6d1416d79d65a  upstream/titanium_reconstruction_v5.py' | sha256sum -c -
          sed -i 's/@njit(cache=True)/@njit(cache=False)/g; s/@njit(parallel=True,cache=True)/@njit(parallel=True,cache=False)/g' upstream/titanium_reconstruction_v5.py
      - name: Patch canonical V23 basket membership
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('regeneration/regenerate_live_package.py')
          s=p.read_text()
          old="    baskets, cats = v5.make_baskets(base, pred, args.n_baskets);idx, EB, ED, ER, active, margin, cond, bs, bw, ds, dw = v5.simulate_all(baskets, pred, opp_pred, clusters, mats, cal)"
          new="""    import random as _random
    _tickers = sorted(pred.ticker.astype(str).unique())
    _categories = sorted({base.TICKER_CATEGORY[t] for t in _tickers if t in base.TICKER_CATEGORY})
    if len(_categories) != 6:
        raise RuntimeError(f'Canonical V23 requires six categories, got {_categories}')
    _category_tickers = {c: sorted([t for t in _tickers if base.TICKER_CATEGORY.get(t) == c]) for c in _categories}
    _insufficient = {c: len(v) for c, v in _category_tickers.items() if len(v) < 4}
    if _insufficient:
        raise RuntimeError(f'Insufficient V23 tickers by category: {_insufficient}')
    _rng = _random.Random(20260721)
    baskets, _seen, _attempts = [], set(), 0
    while len(baskets) < args.n_baskets and _attempts < 500000:
        _attempts += 1
        _selected = []
        for _c in _categories:
            _selected.extend(_rng.sample(_category_tickers[_c], 4))
        _basket = tuple(sorted(_selected))
        if _basket not in _seen:
            _seen.add(_basket)
            baskets.append(_basket)
    if len(baskets) != args.n_baskets:
        raise RuntimeError(f'Could not construct canonical V23 membership: {len(baskets)}')
    cats = _categories
    _v23 = pd.DataFrame([{'basket': i, 'ticker': t} for i, b in enumerate(baskets) for t in b])
    _sizes = _v23.groupby('basket').ticker.nunique()
    if len(_sizes) != 500 or not _sizes.eq(24).all():
        raise RuntimeError(f'Canonical V23 membership validation failed: baskets={len(_sizes)}, range=({_sizes.min()},{_sizes.max()})')
    _v23.to_csv(root/'panels'/'V23_BASKET_MEMBERSHIP.csv', index=False)
    idx, EB, ED, ER, active, margin, cond, bs, bw, ds, dw = v5.simulate_all(baskets, pred, opp_pred, clusters, mats, cal)"""
          if old not in s:
              raise SystemExit('Target generator line not found; refusing non-certified patch')
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile upstream/*.py regeneration/regenerate_live_package.py
          grep -n "Random(20260721)" regeneration/regenerate_live_package.py
          grep -n "V23_BASKET_MEMBERSHIP" regeneration/regenerate_live_package.py
      - name: Download frozen ticker OHLCV matrices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/8839840705/zip -o prior.zip
          mkdir prior && unzip -q prior.zip -d prior
          for f in OPEN HIGH LOW CLOSE VOLUME; do test -s "prior/titanium_retrained_output/${f}.parquet"; done
          sha256sum prior/titanium_retrained_output/{OPEN,HIGH,LOW,CLOSE,VOLUME}.parquet | tee INPUT_OHLCV_SHA256.txt
      - name: Regenerate exact V23 full package
        run: |
          python regeneration/regenerate_live_package.py \
            --base-module upstream/titanium_retrained_current_data_audit.py \
            --v5-module upstream/titanium_reconstruction_v5.py \
            --data-dir prior/titanium_retrained_output \
            --output-parent . \
            --downvol-mode downside_rms \
            --n-estimators 360 \
            --n-baskets 500 | tee EXACT_V23_RUN_LOG.txt
          test -s METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip
          test -s METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/panels/V23_BASKET_MEMBERSHIP.csv
          sha256sum METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/panels/V23_BASKET_MEMBERSHIP.csv | tee V23_BASKET_MEMBERSHIP_SHA256.txt
          sha256sum METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip | tee METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE_SHA256.txt
      - name: Validate output
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          root=Path('METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE')
          m=pd.read_csv(root/'panels/V23_BASKET_MEMBERSHIP.csv')
          sizes=m.groupby('basket').ticker.nunique()
          assert len(sizes)==500 and sizes.eq(24).all()
          r=pd.read_csv(root/'backtest/BASKET_RESULTS_500.csv')
          g=pd.read_csv(root/'backtest/GLOBAL_SCORECARD.csv')
          assert r.basket.nunique()==500 and set(r.strategy)=={'BASE','DIRECT','ROUTER'}
          summary=json.loads((root/'backtest/SCORECARD_SUMMARY.json').read_text())
          out={
            'membership_baskets':int(len(sizes)),
            'membership_size':int(sizes.iloc[0]),
            'base_mean_cagr':float(r[r.strategy=='BASE'].cagr.mean()),
            'router_mean_cagr':float(r[r.strategy=='ROUTER'].cagr.mean()),
            'router_median_cagr':float(r[r.strategy=='ROUTER'].cagr.median()),
            'global':g.set_index('strategy').to_dict('index'),
            'downvol_mode':summary['downvol_mode'],
          }
          Path('EXACT_V23_VALIDATION.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_EXACT_V23_PACKAGE
          path: |
            METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip
            METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE_SHA256.txt
            V23_BASKET_MEMBERSHIP_SHA256.txt
            INPUT_OHLCV_SHA256.txt
            EXACT_V23_VALIDATION.json
            EXACT_V23_RUN_LOG.txt
          retention-days: 7
