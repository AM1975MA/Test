name: Titanium 150 Repair Smoke TEMP
on:
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba yfinance
      - name: Recover canonical package and repair VUG PIN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o canonical_outer.zip
          mkdir outer && unzip -q canonical_outer.zip -d outer
          mkdir canon && unzip -q outer/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip -d canon
          mkdir -p prices/titanium_retrained_output
          cp canon/data/{OPEN,HIGH,LOW,CLOSE,VOLUME}.parquet prices/titanium_retrained_output/
          python regeneration/repair_vug_pin_temp.py
      - name: Run canonical 150 smoke
        run: |
          python canon/source/regenerate_live_package.py --base-module canon/source/titanium_retrained_current_data_audit.py --v5-module canon/source/titanium_reconstruction_v6.py --data-dir prices/titanium_retrained_output --output-parent . --downvol-mode downside_rms --n-estimators 60 --n-baskets 20 | tee REPAIR150_LOG.txt
          cp METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/backtest/SCORECARD_SUMMARY.json REPAIR150_SUMMARY.json
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_150_REPAIR_SMOKE
          path: |
            REPAIR150_SUMMARY.json
            REPAIR150_LOG.txt
            METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/backtest/BASKET_RESULTS_500.csv
            METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/backtest/GLOBAL_SCORECARD.csv
          retention-days: 7
