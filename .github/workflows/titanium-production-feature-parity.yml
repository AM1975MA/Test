name: Titanium Production Feature Parity
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checkpoint-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib
      - name: Download canonical Aug6 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o canonical_artifact.zip
          mkdir artifact && unzip -q canonical_artifact.zip -d artifact
          INNER=$(find artifact -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' | head -1)
          test -n "$INNER"
          mkdir canonical && unzip -q "$INNER" -d canonical
          find canonical -name 'titanium_retrained_current_data_audit.py' -print
          find canonical -name 'OPEN.parquet' -print
      - name: Apply exact production feature and label semantics
        run: |
          ROOT=$(find canonical -type d -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE' | head -1)
          test -n "$ROOT"
          python regeneration/production_feature_parity_patch.py \
            --base "$ROOT/source/titanium_retrained_current_data_audit.py" \
            --v6 "$ROOT/source/titanium_reconstruction_v6.py"
          python -m py_compile "$ROOT/source/titanium_retrained_current_data_audit.py" "$ROOT/source/titanium_reconstruction_v6.py"
          grep -n "target_rank_pct.*fwd_ret_monthly\|compact.signal_date<cutoff.*compact.exit_date<cutoff" "$ROOT/source/"*.py
      - name: Train exact 2026 checkpoint at 360 trees
        run: |
          ROOT=$(find canonical -type d -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE' | head -1)
          python regeneration/checkpoint_2026_production_parity.py \
            --base "$ROOT/source/titanium_retrained_current_data_audit.py" \
            --v6 "$ROOT/source/titanium_reconstruction_v6.py" \
            --data-dir "$ROOT/data" \
            --output PRODUCTION_FEATURE_PARITY_2026
      - name: Archive checkpoint
        if: always()
        run: zip -r TITANIUM_PRODUCTION_FEATURE_PARITY_2026.zip PRODUCTION_FEATURE_PARITY_2026 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_PRODUCTION_FEATURE_PARITY_2026
          path: TITANIUM_PRODUCTION_FEATURE_PARITY_2026.zip
          retention-days: 7
