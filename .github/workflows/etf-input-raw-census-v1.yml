name: ETF_INPUT_RAW_CENSUS_V1
on:
  push:
    branches: [research/etf-input-quality-gate-v1]
    paths: [.github/workflows/etf-input-raw-census-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  raw_census:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Frozen parsing dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
      - name: Retrieve exact original three raw acquisitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R ${{ github.repository }} -n yfinance-repeatability-v1-raw -D _raw
          for r in 1 2 3; do test -f "_raw/_repeat${r}/universe.csv"; done
      - name: Audit all OHLCV source files and cross-download revision differences
        run: python data_quality_audit_v1/raw_census.py --r1 _raw/_repeat1 --r2 _raw/_repeat2 --r3 _raw/_repeat3 --out _output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-raw-triple-census-v1
          retention-days: 90
          path: _output/
