name: V3 Europe48 root cause XGB max leaf ablation
on:
  push:
    branches: [research/eu48-ranker-rootcause-20261024]
    paths:
      - 'etf-trader-v3 corrected/experiments/europe48_transfer/LEAF_ABLATION_START.txt'
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:vendor/etf_trader_v2/src
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Exact European model package versions
        run: pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'numba==0.65.1' 'pyarrow==23.0.1' 'matplotlib==3.10.8'
      - name: Recover exact audited Europe48 original causal source and original V3 127 predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _US149_ORIG _V3_127
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _US149_ORIG
          python -m isin_first2026.v2_unrestricted48.prepare --out _EU48_PREP
          gh run download 40086216896 -R AM1975MA/Test -n 'v3-europe48-127leaf-heads-${{ matrix.year }}' -D '_V3_127/${{ matrix.year }}'
      - name: Strict annual same-data leaf capacity ablation and original 127 exact control
        run: |
          python -u 'etf-trader-v3 corrected/experiments/europe48_transfer/europe48_leaf_ablation.py' \
            --year ${{ matrix.year }} --prep _EU48_PREP --us _US149_ORIG \
            --fx europe_only75/f3h1_original_transfer/results/EURUSD_PRIOR_US_CLOSE.csv \
            --prior-v3 _V3_127 --out '_EU48_LEAF_ABLATION_${{ matrix.year }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-eu48-diagnostic-leaf-${{ matrix.year }}
          path: _EU48_LEAF_ABLATION_${{ matrix.year }}/
          retention-days: 90
