name: Titanium Compact median historical identity

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/apply_compact_median_preprocess.py'
      - '.github/workflows/titanium-compact-median-identity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  identify:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {id: S3B60_B5_MED_XGB214, config: S3B60_B5, xgb: '2.1.4'}
          - {id: S3B60_B5_MED_XGB313, config: S3B60_B5, xgb: '3.1.3'}
          - {id: S3B60_R100_MED_XGB214, config: S3B60_R100, xgb: '2.1.4'}
          - {id: S3B60_R100_MED_XGB313, config: S3B60_R100, xgb: '3.1.3'}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install controlled runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==${{ matrix.xgb }} joblib==1.5.3 numba pyarrow matplotlib
      - uses: actions/download-artifact@v4
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE
          path: input
          repository: AM1975MA/Test
          run-id: 31464219662
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize median-imputed historical candidate
        run: |
          mkdir -p input/package work
          unzip -q input/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip -d input/package
          ROOT=input/package/HISTORICAL_F2D_RECOVERY
          python titanium_training_native/rebuild_v1.py --runner-input $ROOT/code/HISTORICAL_F2D_RUNNER.py --execution-input $ROOT/code/source_execution_reconstruction.py --runner-output work/candidate.py --execution-output work/exact_execution.py
          python titanium_training_native/apply_historical_compact_identity.py --source work/candidate.py --config ${{ matrix.config }}
          python titanium_training_native/apply_compact_median_preprocess.py --source work/candidate.py
          python -m py_compile work/candidate.py work/exact_execution.py
      - name: Train from scratch and backtest 500 baskets
        run: |
          ROOT=input/package/HISTORICAL_F2D_RECOVERY
          python work/candidate.py --base-module $ROOT/code/source_feature_engine.py --v5-module work/exact_execution.py --data-dir $ROOT --output results --n-estimators 360 --n-baskets 500
      - name: Frozen identity score
        run: |
          python - <<'PY'
          import json,math,pandas as pd
          from pathlib import Path
          fr={'D1':.15022713687299,'D2':.2264479079604543,'DEV':.1861726630584223,'HOLD':.2760542274772661,'FULL':.2165406437471759}
          sc=pd.read_csv('results/PERIOD_SCORECARD_500.csv'); b=sc[sc.strategy.eq('BASE')].set_index('period'); chk=json.loads(Path('results/KNOWN_SIGNAL_CHECK.json').read_text())
          periods={p:{'cagr':float(b.loc[p,'cagr']),'gap_pp':100*(float(b.loc[p,'cagr'])-v)} for p,v in fr.items()}
          rmse=math.sqrt(sum(x['gap_pp']**2 for x in periods.values())/len(periods))
          o={'id':'${{ matrix.id }}','config':'${{ matrix.config }}','xgboost':'${{ matrix.xgb }}','preprocess':'median_keep_empty','periods':periods,'rmse_pp_5periods':rmse,'checkpoint':chk}
          Path('results/HISTORICAL_IDENTITY_SCORE.json').write_text(json.dumps(o,indent=2,default=str)); print(json.dumps(o,indent=2,default=str))
          PY
      - name: Archive
        if: always()
        run: |
          mkdir -p artifact/source
          cp -f work/candidate.py work/exact_execution.py artifact/source/ 2>/dev/null || true
          if [ -d results ]; then cp -a results artifact/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_ID_${{ matrix.id }}
          path: artifact
          retention-days: 30
