name: COMPACT21_STABILITY_V1
on:
  push:
    branches: [research/compact21-stability-v1]
    paths: [.github/workflows/compact21-stability-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: compact21-stability-v1-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
  ETF_TRADER_XGB_WORKERS: '1'
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [BASE,Q4,ORDINAL,ECON1BP,Q4_ECON1BP,SCALE,SCALE_ECON1BP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen numerical environment
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'pyarrow==23.0.1' 'scipy==1.17.0'
      - name: Unit validation
        run: |
          python -m unittest discover -s compact21_stability_v1/tests -v
          python -m unittest discover -s tests -p test_quantization.py -v
          python compact21_stability_v1/source_gate.py
      - name: Frozen diagnostic panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _ti/r1 _ti/r2 _ti/r3
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-1 -D _ti/r1
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-2 -D _ti/r2
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-3 -D _ti/r3
      - name: All annual folds and all three pairs
        run: python compact21_stability_v1/run_benchmark.py --variant ${{ matrix.variant }} --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --out _benchmark/${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-benchmark-${{ matrix.variant }}
          retention-days: 90
          path: _benchmark/*.json
  benchmark_summary:
    needs: benchmark
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.summary.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: compact21-benchmark-*
          path: _benchmarks
      - id: summary
        run: python compact21_stability_v1/summarize.py --inputs _benchmarks --out compact21_stability_v1/results/BENCHMARK.json
      - name: Persist benchmark checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compact21_stability_v1/results/BENCHMARK.json
          git commit -m 'Persist preregistered Compact21 stability benchmark'
          git pull --rebase origin research/compact21-stability-v1
          git push origin HEAD:research/compact21-stability-v1
      - uses: actions/upload-artifact@v4
        with:
          name: compact21-benchmark-summary
          retention-days: 90
          path: compact21_stability_v1/results/BENCHMARK.json
  full_replay:
    needs: benchmark_summary
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.benchmark_summary.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen productive environment
        run: python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66' 'pyarrow==23.0.1' 'scipy==1.17.0'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Frozen raw only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R ${{ github.repository }} -n yfinance-repeatability-v1-raw -D _raw
          test "$(git hash-object holdout70/v2_canonical_same_source_compare.py)" = ebd578e0d92e986adb5c2fbf265a346f87b7218e
      - name: Regenerate full canonical chain
        run: python compact21_stability_v1/run_full_pipeline.py --raw _raw/_repeat${{ matrix.repeat }} --compare-script holdout70/v2_canonical_same_source_compare.py --variant ${{ matrix.variant }} --out _full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-full-${{ matrix.variant }}-r${{ matrix.repeat }}
          retention-days: 90
          path: |
            _full/INPUT_CONTRACT.json
            _full/RESULT_*.json
            _full/DAILY_LEADERS_*.csv
            _full/**/COMPACT21_STABILITY_AUDIT.json
            _full/**/ENSEMBLE_FIT_AUDIT.csv
  full_summary:
    needs: full_replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/compact21-stability-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: compact21-full-*
          path: _fulls
      - name: Fixed economic and decision assessment
        run: python compact21_stability_v1/summarize_full.py --inputs _fulls --out compact21_stability_v1/results/FULL_REPLAY.json --benchmark-summary compact21_stability_v1/results/BENCHMARK.json
      - name: Persist full outcome
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compact21_stability_v1/results/FULL_REPLAY.json
          git commit -m 'Persist Compact21 full replay outcome'
          git pull --rebase origin research/compact21-stability-v1
          git push origin HEAD:research/compact21-stability-v1
      - uses: actions/upload-artifact@v4
        with:
          name: compact21-full-summary
          retention-days: 90
          path: compact21_stability_v1/results/FULL_REPLAY.json
