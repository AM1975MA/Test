name: ETF trader perturbation forensics V1 ET 2023 residual audit

on:
  push:
    branches:
      - research/etf-trader-perturbation-forensics-v1
    paths:
      - .github/workflows/perturbation-forensics-v1-et2023.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0" "xgboost==3.1.3" pyarrow matplotlib
      - name: Download byte-preserved 2023 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _et
          gh run download 37151445684 -R ${{ github.repository }} -n lookahead-bp-2023-12-29-base -D _et/base
          gh run download 37151445684 -R ${{ github.repository }} -n lookahead-bp-2023-12-29-mutate -D _et/mutate
          gh run download 37151445684 -R ${{ github.repository }} -n lookahead-bp-2023-12-29-truncate -D _et/truncate
      - name: Audit 24 ET differences and refit
        run: |
          mkdir -p forensics_v1/results
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np, pandas as pd
          from sklearn.impute import SimpleImputer
          from sklearn.ensemble import ExtraTreesRegressor
          from etf_trader.ma3.producer import FEATURES_42
          from etf_trader.ma3.hybrid_producer import ET_MODEL_KW, corrected_target

          root=Path("_et")
          def ld(mode):
              p=pd.read_parquet(root/mode/"PANEL.parquet");p["signal_date"]=pd.to_datetime(p.signal_date);p["exit_date_63"]=pd.to_datetime(p.exit_date_63)
              r=pd.read_parquet(root/mode/"PRED.parquet");r["signal_date"]=pd.to_datetime(r.signal_date)
              return p,r
          B={m:ld(m) for m in ["base","mutate","truncate"]}
          res={"status":"ET_2023_RESIDUAL_AUDIT_COMPLETE","stored":{},"refit":{},"rowsets":{}}
          for mode in ["mutate","truncate"]:
              a=B["base"][1][["signal_date","ticker","ET_TAIL"]]
              b=B[mode][1][["signal_date","ticker","ET_TAIL"]]
              x=a.merge(b,on=["signal_date","ticker"],suffixes=("_base","_"+mode))
              d=np.abs(x.ET_TAIL_base-x["ET_TAIL_"+mode])
              z=x[d>1e-12].copy();z["abs_diff"]=d[d>1e-12]
              res["stored"][mode]={
                "changed":int(len(z)),"max_abs":float(z.abs_diff.max()) if len(z) else 0.0,
                "by_date":{str(k.date()):int(v) for k,v in z.groupby("signal_date").size().items()},
                "rows":z.sort_values(["signal_date","ticker"]).to_dict("records")
              }

          cutoff=pd.Timestamp("2023-01-01")
          common_pred=None
          for mode in ["base","mutate","truncate"]:
              p=B[mode][0].copy()
              tr=p[(p.signal_date<cutoff)&(p.exit_date_63<cutoff)].copy().sort_values(["signal_date","ticker"])
              pr=p[(p.signal_date>=cutoff)&(p.signal_date<pd.Timestamp("2024-01-01"))].copy().sort_values(["signal_date","ticker"])
              tr["Y"]=corrected_target(tr)
              tr=tr[tr.Y.notna()].copy()
              res["rowsets"][mode]={"train_rows":len(tr),"pred_rows":len(pr),
                                    "train_key_hash":str(pd.util.hash_pandas_object(tr[["signal_date","ticker"]],index=False).sum()),
                                    "pred_key_hash":str(pd.util.hash_pandas_object(pr[["signal_date","ticker"]],index=False).sum())}
          # Exact common training/prediction keys across all modes.
          tkeys=B["base"][0][(B["base"][0].signal_date<cutoff)&(B["base"][0].exit_date_63<cutoff)][["signal_date","ticker"]]
          pkeys=B["base"][0][(B["base"][0].signal_date>=cutoff)&(B["base"][0].signal_date<pd.Timestamp("2024-01-01"))][["signal_date","ticker"]]
          for mode in ["mutate","truncate"]:
              q=B[mode][0]
              tkeys=tkeys.merge(q[(q.signal_date<cutoff)&(q.exit_date_63<cutoff)][["signal_date","ticker"]],on=["signal_date","ticker"])
              pkeys=pkeys.merge(q[(q.signal_date>=cutoff)&(q.signal_date<pd.Timestamp("2024-01-01"))][["signal_date","ticker"]],on=["signal_date","ticker"])
          tkeys=tkeys.drop_duplicates().sort_values(["signal_date","ticker"]);pkeys=pkeys.drop_duplicates().sort_values(["signal_date","ticker"])
          fitted={}
          for mode in ["base","mutate","truncate"]:
              p=B[mode][0]
              tr=tkeys.merge(p,on=["signal_date","ticker"],validate="one_to_one")
              pr=pkeys.merge(p,on=["signal_date","ticker"],validate="one_to_one")
              tr["Y"]=corrected_target(tr)
              imp=SimpleImputer(strategy="median")
              X=imp.fit_transform(tr[FEATURES_42]);Xp=imp.transform(pr[FEATURES_42])
              et=ExtraTreesRegressor(n_jobs=1,**ET_MODEL_KW);et.fit(X,tr.Y.to_numpy(float))
              raw=et.predict(Xp)
              o=pkeys.copy();o["raw"]=raw;o["rank"]=o.assign(raw=raw).groupby("signal_date")["raw"].rank(pct=True,method="average").to_numpy()
              fitted[mode]=o
          for mode in ["mutate","truncate"]:
              x=fitted["base"].merge(fitted[mode],on=["signal_date","ticker"],suffixes=("_base","_"+mode))
              dr=np.abs(x.raw_base-x["raw_"+mode]);dk=np.abs(x.rank_base-x["rank_"+mode])
              res["refit"][mode]={"raw_changed":int(np.sum(dr>1e-12)),"raw_max_abs":float(dr.max()),
                                  "rank_changed":int(np.sum(dk>1e-12)),"rank_max_abs":float(dk.max())}
          Path("forensics_v1/results/ET_2023_RESIDUAL_AUDIT.json").write_text(json.dumps(res,indent=2,default=str)+"\n")
          print(json.dumps(res,indent=2,default=str))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensics_v1/results/ET_2023_RESIDUAL_AUDIT.json
          git commit -m "Persist ET 2023 residual lookahead audit"
          git pull --rebase --autostash origin research/etf-trader-perturbation-forensics-v1
          git push origin HEAD:research/etf-trader-perturbation-forensics-v1
      - uses: actions/upload-artifact@v4
        with:
          name: et-2023-residual-audit
          retention-days: 90
          path: forensics_v1/results/ET_2023_RESIDUAL_AUDIT.json
