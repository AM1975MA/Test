name: ETF trader feature quantization V1

on:
  push:
    branches:
      - research/etf-trader-perturbation-forensics-v1
    paths:
      - .github/workflows/feature-quantization-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      ETF_TRADER_XGB_THREADS_PER_WORKER: "1"
      ETF_TRADER_XGB_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned environment
        run: python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0" "xgboost==3.1.3" pyarrow matplotlib
      - name: Gate Compact21 source
        run: |
          python - <<'PY'
          import subprocess
          exp = {
            "vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py": "045e57996b02d481bd23f6e4dfe53738d43008e5",
            "vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py": "c07ef573da6aaa57a4e6bd2d097714e7105e5929",
          }
          for p,w in exp.items():
              g=subprocess.check_output(["git","rev-parse",f"HEAD:{p}"],text=True).strip()
              assert g==w,(p,g,w)
          print("SOURCE_GATE_PASS")
          PY
      - name: Download frozen Titanium internal artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _ti
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-1 -D _ti/repeat1
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-2 -D _ti/repeat2
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-3 -D _ti/repeat3
          test -f _ti/repeat1/TI_COMPACT.parquet
      - name: Run quantization forensic
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src
        run: |
          mkdir -p forensics_v1/results
          python forensics_v1/run_feature_quantization_v1.py             --r1 _ti/repeat1             --r2 _ti/repeat2             --r3 _ti/repeat3             --out forensics_v1/results/FEATURE_QUANTIZATION_V1.json
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensics_v1/results/FEATURE_QUANTIZATION_V1.json
          git commit -m "Persist feature quantization forensic V1"
          git pull --rebase --autostash origin research/etf-trader-perturbation-forensics-v1
          git push origin HEAD:research/etf-trader-perturbation-forensics-v1
      - uses: actions/upload-artifact@v4
        with:
          name: feature-quantization-v1
          retention-days: 90
          path: forensics_v1/results/FEATURE_QUANTIZATION_V1.json
