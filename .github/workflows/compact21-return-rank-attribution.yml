name: COMPACT21_RETURN_RANK_STAGE_ATTRIBUTION
on:
  pull_request:
    branches: [research/compact21-top5-economic-rerank-20261017]
    paths: [.github/workflows/compact21-return-rank-attribution.yml, 'compact21_attribution_v1/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned numerical environment and test exact stage19 mathematics
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'numba==0.65.1'
          python -m py_compile compact21_attribution_v1/analyze.py
          python -m unittest discover -s compact21_attribution_v1/tests -v
      - name: Retrieve hash-frozen 2017-2026 BASE and Return-Rank predictions and canonical V2 replays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _attribution_inputs
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _attribution_inputs/base
          gh run download 39031200131 -R AM1975MA/Test -n compact21-return-predictive -D _attribution_inputs/predictive
          gh run download 39031200131 -R AM1975MA/Test -n compact21-return-economic -D _attribution_inputs/economic
      - name: Audit Compact21 to Titanium to final-score to daily allocation and exact equity paths
        run: |
          python compact21_attribution_v1/analyze.py --inputs _attribution_inputs --out _attribution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-return-rank-stage-attribution
          retention-days: 90
          path: _attribution/
