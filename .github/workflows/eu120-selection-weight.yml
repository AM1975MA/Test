name: EU120_SELECTION_WEIGHT_COUNTERFACTUAL
on:
  pull_request:
    branches: [research/eu120-compact-return-tail-refit-20261017]
    paths:
      - '.github/workflows/eu120-selection-weight.yml'
      - 'eu120_selection_weight_v1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}:${{ github.workspace }}/europe120/eu120_retrain
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen original risk/execution and model loading dependencies
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'numba==0.65.1' 'threadpoolctl==3.6.0' 'matplotlib==3.10.8'
          python -m py_compile eu120_selection_weight_v1/run.py
      - name: Recover source-verified EU120 re-trained predictions and 120 ETF archived daily paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39064123941 -R AM1975MA/Test -n eu120-compact-return-tail-refit-full -D _frozen_pred
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _raw149
          test -f _frozen_pred/RESULT.json
          test -f _frozen_pred/H_ONLY_EQUITY.npz
          test -f _frozen_pred/R_H_EQUITY.npz
      - name: Exactly reproduce two certified EU120 portfolio paths and run six fixed factor arms
        run: |
          python eu120_selection_weight_v1/run.py --source _frozen_pred --raw149 _raw149 --out _isolation
      - name: Preserve complete economic, annual and daily allocation traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu120-selection-weight-six-arm-audit
          retention-days: 90
          path: |
            _isolation/RESULT.json
            _isolation/ECONOMICS.csv
            _isolation/ANNUAL_RETURN.csv
            _isolation/H_H.npz
            _isolation/R_R.npz
            _isolation/H_R.npz
            _isolation/R_H.npz
            _isolation/H_HALF.npz
            _isolation/R_HALF.npz
