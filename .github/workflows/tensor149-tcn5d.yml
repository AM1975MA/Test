name: TENSOR149_TCN5D_ORIGINAL_149_CAUSAL_PILOT
on:
  push:
    branches: [research/original149-tcn5d-causal-20261020]
    paths:
      - 'tensor149_tcn5d/**'
      - '.github/workflows/tensor149-tcn5d.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: '\${{ github.workspace }}/vendor/etf_trader_v2/src:\${{ github.workspace }}'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  causal-tcn-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical and CPU Torch environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'pyarrow==23.0.1' 'matplotlib==3.10.8' 'xgboost==3.1.3'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and pass exact 125-feature causality tests
        run: |
          python -m py_compile tensor149_tcn5d/*.py
          python -m unittest -v tensor149_tcn5d.test_contract
      - name: Run 2024 and 2025 TCN/Ridge/momentum matched OOS tests
        run: |
          set -o pipefail
          python -m tensor149_tcn5d.run --years 2024,2025 --epochs 5 --out _tensor149 | tee _tensor149_console.log
      - name: Retain complete results and logs, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensor149-5d-pilot-2024-2025
          retention-days: 90
          path: |
            _tensor149/
            _tensor149_console.log
