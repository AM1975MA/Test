name: EU48_CAUSAL_ONLINE_EXPERTS_NO_FUTURE_RANKING_COMPARE
on:
  push:
    branches:
      - research/eu48-predictive-skill-free-ranking-20261019
    paths:
      - '.github/workflows/eu48-causal-online-experts.yml'
      - 'isin_first2026/predict48/online_experts.py'
      - 'isin_first2026/predict48/PREREGISTERED_ONLINE_EXPERTS.md'
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONPATH: .:vendor/etf_trader_v2/src
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  online-adaptive-causal-no-retrain-48-etfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and install original causal rank numerical requirements
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'lightgbm==4.6.0' 'xgboost==3.1.3' 'numba==0.63.1'
          python -m py_compile isin_first2026/predict48/online_experts.py
      - name: Recreate exactly 48 EU venue historical source price quotes
        run: python -m isin_first2026.v2_unrestricted48.prepare --out _EU48_ONLINE_PRICE
      - name: Online mature-only 12-month no-lookahead forecast expert learning and 10bps actual share costed path
        run: python -u -m isin_first2026.predict48.online_experts --prep _EU48_ONLINE_PRICE --out _EU48_ONLINE
      - name: Strict 65x48 no US ETF assets and archived scores no leak plus source hash proof
        run: |
          python - <<'PY'
          import json,hashlib,pandas as pd
          from pathlib import Path
          p=Path('_EU48_ONLINE')
          z=json.loads((p/'RESULT.json').read_text())
          assert z['status']=='EU48_CAUSAL_ONLINE_EXPERT_RANKING_SECOND_FROZEN_STUDY_COMPLETE'
          assert z['months']==65 and z['unique_isins']==48
          assert z['rank_and_next_month_payoff_learning_only_from_prior_matured_exits']
          assert z['actual_matured_12month_window'] and z['never_add_US_assets_or_4_category_quota']
          assert len(z['methods'])==7
          c=pd.read_csv(p/'CAUSAL_EXPERT_WEIGHTS_AT_EACH_SIGNAL.csv')
          assert len(c)==65
          assert c.filter(regex=r'^ADAPT4_').sum(axis=1).sub(1).abs().max()<1e-10
          assert c.filter(regex=r'^ADAPT2_').sum(axis=1).sub(1).abs().max()<1e-10
          x=pd.read_csv(p/'ONLINE_EXPERT_TOP5_ISIN_SELECTION.csv')
          assert x.groupby(['method','signal_date'])['isin'].nunique().eq(5).all()
          for line in (p/'SHA256_MANIFEST.txt').read_text().splitlines():
            digest,f=line.split('  ',1)
            assert hashlib.sha256((p/f).read_bytes()).hexdigest()==digest
          print('EU48_EXPERT_ONLINE_NOFUTURE_AUDITED',json.dumps(z),flush=True)
          PY
      - name: Archive independent online experts true EU48 latest method comparison in Test only
        run: |
          mkdir -p isin_first2026/predict48/online_results
          cp -a _EU48_ONLINE/. isin_first2026/predict48/online_results/
          git config user.name "EU48_ONLINE_CAUSAL_PREDICTOR_RESEARCH"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isin_first2026/predict48/online_results
          git commit -m "Archive causal asof 12month MA3 Momentum and Ridge online forecast rank weights and out-of-time performance"
          git pull --rebase origin research/eu48-predictive-skill-free-ranking-20261019
          git push origin HEAD:refs/heads/research/eu48-predictive-skill-free-ranking-20261019
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EUROPE48_Causal_Online_Expert_NoFuture_Forecast_Research
          retention-days: 90
          path: _EU48_ONLINE/
