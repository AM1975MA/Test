name: V3 Europe148 TRUE corrected 125F asof 2012-2026 dynamic model panel
on:
  push:
    branches: [research/v3-europe148-historical-20261024]
    paths:
      - 'etf-trader-v3 corrected/experiments/europe148_2012/PANEL_START.txt'
permissions:
  contents: read
  actions: read
jobs:
  corrected125:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin corrected V3 kernel environment
        run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'xgboost==3.0.5' 'scikit-learn==1.9.1' scipy matplotlib pyarrow numba
      - name: Recover certified full Europe148 real historical ISIN with legal venue dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/euro148_ohlcv
          gh run download 40135988905 -R AM1975MA/Test \
             -n v3-europe148-2010-vintage-verified-ohlcv -D runs/euro148_ohlcv
          test -s runs/euro148_ohlcv/MANIFEST.json
      - name: Exact source-native V3 corrected kernel features no V2 downside logic, European daily calendar and dynamic 252-observed-bar eligibility
        env:
          PYTHONPATH: etf-trader-v3 corrected/src
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
        run: |
          python -u 'etf-trader-v3 corrected/experiments/europe148_2012/build_corrected_panel.py' \
            --raw runs/euro148_ohlcv \
            --out runs/euro148_corrected125_monthly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-europe148-corrected-125F-dynamic-panel
          path: runs/euro148_corrected125_monthly/
          retention-days: 90
