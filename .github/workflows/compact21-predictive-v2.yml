name: COMPACT21_PREDICTIVE_V2
on:
  push:
    branches: [research/compact21-predictive-v2]
    paths: [.github/workflows/compact21-predictive-v2.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: compact21-predictive-v2-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: 'Haswell'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
  ETF_TRADER_XGB_WORKERS: '1'
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Predictive maturity, evidence and gate tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s compact21_predictive_v2/tests -v 2>&1 | tee PREDICTIVE_VALIDATION.txt
          python -m unittest discover -s compact21_learner_swap_v1/tests -v 2>&1 | tee LEGACY_VALIDATION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictive-validation
          retention-days: 90
          path: '*VALIDATION.txt'
  predictive:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [BASE,RIDGE,LGBM_LAMBDARANK,LGBM_TOP5,ADDITIVE_RIDGE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Frozen inputs and old control evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-1 -D _ti/r1
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-2 -D _ti/r2
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-3 -D _ti/r3
          gh run download 37195399755 -R ${{ github.repository }} -n learner-benchmark-BASE -D _refs/base
          gh run download 37195399755 -R ${{ github.repository }} -n learner-benchmark-RIDGE -D _refs/ridge
          gh run download 37195399755 -R ${{ github.repository }} -n learner-benchmark-LGBM_LAMBDARANK -D _refs/lgbm
      - name: Every annual fold and snapshot, with retained vectors
        run: python compact21_predictive_v2/run.py --variant ${{ matrix.variant }} --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --reference _refs --out _predictive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictive-${{ matrix.variant }}
          retention-days: 90
          path: _predictive/
  summary:
    needs: predictive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - uses: actions/download-artifact@v4
        with:
          pattern: predictive-*
          path: _results
      - name: Independent vector reconstruction, paired intervals and fixed gates
        run: python -m compact21_predictive_v2.summarize --inputs _results --out _summary/PREDICTIVE_SUMMARY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictive-summary
          retention-days: 90
          path: _summary/
