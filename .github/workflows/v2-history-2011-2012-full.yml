name: V2_HISTORY_2011_2012_FULL_58_MONTHS
on:
  push:
    branches: [research/v2-history-2011-2012-20261011]
    paths: [.github/workflows/v2-history-2011-2012-full.yml]
permissions: {contents: read, actions: write}
env:
  PYTHONPATH: '${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}'
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: 'Haswell'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
  ETF_TRADER_XGB_WORKERS: '1'
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: {repeat: [1, 2, 3]}
    steps:
      - name: Stop preliminary run with mismatched numerical execution
        if: matrix.repeat == 1
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run cancel 38176634299 -R AM1975MA/Test || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Frozen V2 environment
        run: python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66' 'pyarrow==23.0.1' 'scipy==1.17.0'
      - name: Pristine canonical sources and targeted patch tests
        run: |
          python compact21_stability_v1/source_gate.py
          python -m unittest history_window_v1.test_contract history_window_v1.test_replay_patch -v
      - name: Restore frozen Yahoo raw, no new download or old score consumption
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
      - name: Full canonical replay, explicit 58-month gate and 2012 training floor
        run: python -m history_window_v1.full_replay --raw _raw/_repeat${{ matrix.repeat }} --out _full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-full-repeat-${{ matrix.repeat }}
          retention-days: 90
          path: |
            _full/RESULT.json
            _full/RESEARCH_PATCH.json
            _full/RAW_WINDOW_MANIFEST.csv
            _full/TITANIUM_FIT_AUDIT.csv
            _full/replay/original149/DAILY_LEADERS.csv
            _full/replay/original149/ENSEMBLE_FIT_AUDIT.csv
            _full/replay/original149/FULL_UNIVERSE_PATH.npz
            _full/replay/original149/titanium/annual_models/eligibility_audit.json
            _full/replay/original149/titanium/annual_models/fit_audit_*.json
  summarize:
    needs: replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
      - uses: actions/download-artifact@v4
        with: {pattern: 'history-full-repeat-*', path: _fulls}
      - run: python -m history_window_v1.full_summary --inputs _fulls --out _summary
      - uses: actions/upload-artifact@v4
        with: {name: history-full-three-source-comparison, path: _summary/, retention-days: 90}
