name: Titanium D42 Eligibility126 Audit
on:
  push:
    branches: [titanium-d42-elig126-run-20260811]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: {actions: read, contents: read}
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      NUMBA_DISABLE_CACHING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Extract immutable production runner
        run: |
          git fetch --no-tags origin 28430c0c3487eb7973dc5c6f0d0a569a90d8224c
          git show 28430c0c3487eb7973dc5c6f0d0a569a90d8224c:regeneration/production_aligned_regen.py > production_aligned_regen.py
          python -m py_compile production_aligned_regen.py forensics/d42_elig126_audit.py
      - name: Download canonical ticker-data package
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o x.zip
          mkdir outer && unzip -q x.zip -d outer
          INNER=$(find outer -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' | head -1); test -n "$INNER"
          mkdir canonical && unzip -q "$INNER" -d canonical
          ROOT=$(find canonical -type d -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE' | head -1); test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Run D42 plus historical eligibility
        run: python forensics/d42_elig126_audit.py --runner production_aligned_regen.py --base-module "$ROOT/source/titanium_retrained_current_data_audit.py" --v5-module "$ROOT/source/titanium_reconstruction_v6.py" --data-dir "$ROOT/data" --output D42_ELIG126
      - name: Archive
        if: always()
        run: zip -j D42_ELIG126_DIAGNOSTIC.zip D42_ELIG126/D42_ELIG126_SUMMARY.json D42_ELIG126/ELIGIBILITY_AUDIT.csv D42_ELIG126/KNOWN_SIGNAL_CHECK.json D42_ELIG126/BASKET_RESULTS_500.csv D42_ELIG126/CAGR_DISTRIBUTION_SUMMARY.csv D42_ELIG126/FIT_AUDIT.csv D42_ELIG126/GLOBAL_SCORECARD.csv D42_ELIG126/TITANIUM_CONCENTRATION_FRONTIER_PATHS.npz || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_D42_ELIG126
          path: D42_ELIG126_DIAGNOSTIC.zip
          retention-days: 14
