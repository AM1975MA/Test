name: PAPER_LTR_FEASIBILITY_V1
on:
  push:
    branches: [research/paper-ltr-feasibility-20261012]
    paths: [.github/workflows/paper-ltr-feasibility.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ambiente numerico congelato
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
      - name: Controlli sorgenti e test matematici
        run: |
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s paper_ltr_v1/tests -v
      - name: Recupera solo input e baseline già congelati
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _ti/r1 _ti/r2 _ti/r3 _baseline
          gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-1 -D _ti/r1
          gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-2 -D _ti/r2
          gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-3 -D _ti/r3
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _baseline
      - name: Addestra soltanto ListNet sulle tre acquisizioni
        run: python paper_ltr_v1/run.py --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --baseline _baseline --out _candidate
      - name: Confronto qualità e stabilità su supporto ed esiti comuni
        run: python paper_ltr_v1/summarize.py --candidate _candidate --baseline _baseline --out _comparison/COMPARISON.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-ltr-feasibility
          retention-days: 90
          path: |
            _candidate/
            _comparison/
