name: OLC96 - CFTC short positions (research only)
on:
  push:
    branches: [research/olc96-cftc-shorts]
    paths: ['research/olc96/**', '.github/workflows/olc96-cftc-cot.yml']
permissions:
  contents: read
jobs:
  cftc-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pandas>=2.2,<4" "requests>=2.32,<3"
      - name: CFTC futures-only Disaggregated and TFF history
        run: python research/olc96/fetch_cftc_cot.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olc96-cftc-shorts-source
          path: research/olc96/cftc_output/
          retention-days: 7
          if-no-files-found: warn
