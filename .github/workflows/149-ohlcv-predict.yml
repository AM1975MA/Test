name: T149E_COMPLETE_OHLCV_BAR_VOLUME_PREDICTOR_TOURNAMENT
on:
  push:
    branches:
      - research/149-ohlcv-microstructure-predict-20261019
    paths:
      - 'research_reset/predict149/ohlcv/run.py'
      - 'research_reset/predict149/ohlcv/test_run.py'
      - 'research_reset/predict149/ohlcv/PREREGISTERED.md'
      - '.github/workflows/149-ohlcv-predict.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONHASHSEED: '0'
  PYTHONPATH: ${{ github.workspace }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  original149-four-price-volume-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Deterministic dependency and source compilation
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'lightgbm==4.6.0'
          python -m py_compile research_reset/predict149/ohlcv/run.py research_reset/predict149/ohlcv/test_run.py
      - name: Verify raw volume and real intraday features are strictly causal
        run: |
          python -m unittest -v research_reset.predict149.ohlcv.test_run
      - name: Run frozen 149 ETF bar and volume information-only tournament
        run: |
          python -m research_reset.predict149.ohlcv.run --out _t149e
      - name: Reject missing ticker, unreliable old benchmark or immature training label
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("_t149e/RESULT.json").read_text())
          assert d["status"]=="ORIGINAL149_TRUE_OHLCV_FEATURE_CHALLENGE_COMPLETED"
          assert d["n_etfs"]==149 and d["n_anchors"]==64
          assert d["n_ticker_prediction_rows"]==9536
          assert d["frozen_original_N4_economic_parity"] and d["train_labels_strictly_matured"]
          assert len(d["model_scores"])==5
          print("T149E_FEATURE_PROPER_SCORE_GATES",d["preregistered_proper_skill_gates"])
          PY
      - name: Freeze every 149 monthly ticker prediction and fully costed wealth result
        run: |
          mkdir -p research_reset/predict149/ohlcv/results
          cp _t149e/*.csv _t149e/*.json research_reset/predict149/ohlcv/results/
          (cd research_reset/predict149/ohlcv/results && sha256sum *.csv *.json > SHA256_MANIFEST.txt)
          (cd research_reset/predict149/ohlcv/results && sha256sum -c SHA256_MANIFEST.txt)
          git config user.name "ETF149-Market-Activity-Science"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_reset/predict149/ohlcv/results
          git commit -m "Archive all 149 daily OHLCV bar vs engineered price-volume indicators predictive methods, entire as-of forecast record"
          git push origin HEAD:refs/heads/research/149-ohlcv-microstructure-predict-20261019
      - name: Save outcome artifact on failures or model veto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original149-raw-ohlcv-versus-engineered-ticker-forecast
          retention-days: 90
          path: |
            _t149e/*.csv
            _t149e/*.json
