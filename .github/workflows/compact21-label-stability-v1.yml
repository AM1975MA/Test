name: ETF trader Compact21 label stability V1

on:
  push:
    branches:
      - research/etf-trader-perturbation-forensics-v1
    paths:
      - .github/workflows/compact21-label-stability-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  variant:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - BASE
          - L50
          - Q4_L50
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      ETF_TRADER_XGB_THREADS_PER_WORKER: "1"
      ETF_TRADER_XGB_WORKERS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0" "xgboost==3.1.3" pyarrow matplotlib
      - name: Download frozen Titanium internal inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _ti/r1 _ti/r3
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-1 -D _ti/r1
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-3 -D _ti/r3
      - name: Run label stability cells
        run: |
          mkdir -p _out
          for y in 2017 2020 2023 2026; do
            python forensics_v1/run_label_stability_one.py               --r1 _ti/r1 --r3 _ti/r3               --year "$y" --variant "${{ matrix.variant }}"               --out "_out/$y.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          vals=[json.loads((Path("_out")/f"{y}.json").read_text()) for y in [2017,2020,2023,2026]]
          fields=["raw_mean_abs","rank_mean_abs","mean_daily_spearman","top1_disagreement_fraction","train_feature_exact_fraction","test_feature_exact_fraction","label_disagreement_fraction"]
          out={
            "status":"COMPACT21_LABEL_STABILITY_VARIANT_COMPLETE",
            "variant":vals[0]["variant"],
            "feature_decimals":vals[0]["feature_decimals"],
            "label_bins":vals[0]["label_bins"],
            "per_year":{str(x["year"]):x for x in vals},
            "aggregate_mean":{f:sum(x[f] for x in vals)/len(vals) for f in fields}
          }
          Path("_out/VARIANT.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compact21-label-${{ matrix.variant }}
          retention-days: 90
          path: _out/VARIANT.json

  summarize:
    needs: variant
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: compact21-label-*
          path: _all
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          R={}
          for v in ["BASE","L50","Q4_L50"]:
              R[v]=json.loads((Path("_all")/f"compact21-label-{v}"/"VARIANT.json").read_text())
          base=R["BASE"]["aggregate_mean"]
          out={"status":"COMPACT21_LABEL_STABILITY_V1_COMPLETE","variants":R}
          for v in ["L50","Q4_L50"]:
              a=R[v]["aggregate_mean"]
              a["rank_mean_abs_reduction_vs_base_pct"]=100*(base["rank_mean_abs"]-a["rank_mean_abs"])/base["rank_mean_abs"]
              a["top1_disagreement_reduction_vs_base_pct"]=100*(base["top1_disagreement_fraction"]-a["top1_disagreement_fraction"])/base["top1_disagreement_fraction"]
              a["label_disagreement_reduction_vs_base_pct"]=100*(base["label_disagreement_fraction"]-a["label_disagreement_fraction"])/base["label_disagreement_fraction"]
          Path("forensics_v1/results/COMPACT21_LABEL_STABILITY_V1.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin research/etf-trader-perturbation-forensics-v1
          git add forensics_v1/results/COMPACT21_LABEL_STABILITY_V1.json
          git commit -m "Persist Compact21 label stability forensic"
          git push origin HEAD:research/etf-trader-perturbation-forensics-v1
