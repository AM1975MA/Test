name: LISTNET_LINEAR_INDEPENDENT_CERTIFICATE_NOFIT
on:
  push:
    branches: [research/paper-ltr-feasibility-20261012]
    paths: [.github/workflows/listnet-linear-certificate.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
      - name: Existing models and frozen inputs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38580178650 -R AM1975MA/Test -n listnet-linear-relative-repair -D _repair
          for i in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$i -D _ti/r$i
          done
      - name: Recompute thirty gradients without optimization
        run: python paper_ltr_v2/diagnostics_solver/verify_linear_stationarity.py --candidate _repair/_candidate --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --out _certificate/THIRTY_GRADIENTS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listnet-linear-independent-certificate
          retention-days: 90
          path: _certificate/
