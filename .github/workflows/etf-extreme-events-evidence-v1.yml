name: ETF_EXTREME_EVENTS_EVIDENCE_V1
on:
  push:
    branches: [research/etf-input-quality-gate-v1]
    paths: [.github/workflows/etf-extreme-events-evidence-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
      - name: Download frozen 3 original Yahoo acquisitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37121749852 -R ${{ github.repository }} -n yfinance-repeatability-v1-raw -D _raw
      - name: Emit every >20 percent event and its original OHLC evidence
        run: python data_quality_audit_v1/extreme_events.py --r1 _raw/_repeat1 --r2 _raw/_repeat2 --r3 _raw/_repeat3 --out _evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extreme-events-original149-inventory
          retention-days: 90
          path: _evidence/
