name: COMPACT21_CLEAN_DOWNVOL_SUMMARY_RECOVERY
on:
  push:
    branches: [research/compact21-clean-downvol-training-v1]
    paths: [.github/workflows/compact21-clean-downvol-summary-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: 'Haswell'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
  ETF_TRADER_XGB_WORKERS: '1'
jobs:
  summary_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Frozen dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Canonical original source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Verify canonical ordering fix and source regression tests
        run: |
          python -m unittest discover -s compact21_downvol_cleanup_v1/tests -v
          python -m unittest discover -s compact21_predictive_v2/tests -v
      - name: Download the unchanged original 10 successful yearly model outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37936989442 -R ${{ github.repository }} -p 'cleaned-model-20*' -D _years
          gh run download 37229180477 -R ${{ github.repository }} -n predictive-BASE -D _ref
          for y in {2017..2026}; do
            test -f "_years/cleaned-model-${y}/RESULT.json"
            test -f "_years/cleaned-model-${y}/NATIVE_PREDICTIONS.parquet"
          done
      - name: Recompute untouched 114-month stability and 113-month quality gates
        run: python -m compact21_downvol_cleanup_v1.summarize_training --years _years --reference _ref --out _summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-downvol-three-source-summary-recovery
          retention-days: 90
          path: _summary/
