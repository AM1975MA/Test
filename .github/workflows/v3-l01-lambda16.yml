name: V3 L01.2 pairwise127 regularization-only experiment
on:
  push:
    branches: [research-v3-next-layer-gates-20261021]
    paths:
      - '.github/workflows/v3-l01-lambda16.yml'
      - 'etf-trader-v3 corrected/experiments/l01_regularization/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fit:
    name: L01.2 frozen corrected125 pairwise127 ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: years_2018_2020, years: '2018,2019,2020'}
          - {shard: years_2021_2023, years: '2021,2022,2023'}
          - {shard: years_2024_2026, years: '2024,2025,2026'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - name: Original frozen ETF snapshot and numerically certified Pair127 controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/v2_corrected_oracle
          gh run download 39482809691 --repo AM1975MA/Test \
            --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          gh run download 39515716383 --repo AM1975MA/Test \
            --name v2-formula-retrain-complete --dir runs/v2_corrected_oracle
          python regeneration/certify_etf_trader_raw.py
          test -s runs/v2_corrected_oracle/OOS_SCORES.csv
      - name: Refit only lambda=16, no new ranking loss or feature changes
        run: |
          python 'etf-trader-v3 corrected/experiments/l01_regularization/evaluate.py' \
            --years '${{ matrix.years }}' \
            --raw etf_trader_raw \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --prior runs/v2_corrected_oracle \
            --out 'runs/v3_l01_lambda_shards/${{ matrix.shard }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l01-lambda-${{ matrix.shard }}
          path: runs/v3_l01_lambda_shards/
          if-no-files-found: warn
          retention-days: 90
  report:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: v3-l01-lambda-years_*
          merge-multiple: true
          path: runs/v3_l01_lambda_shards/
      - name: Exact 101-month paired predictive-only ranking evaluation
        run: |
          python 'etf-trader-v3 corrected/experiments/l01_regularization/aggregate.py' \
            --root runs/v3_l01_lambda_shards \
            --out runs/v3_l01_lambda_complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l01-lambda16-regularization-results
          path: runs/v3_l01_lambda_complete/
          if-no-files-found: warn
          retention-days: 90
