name: OASIS_POST_RESULT_CRISIS_OPPORTUNITY_AUDIT
on:
  push:
    branches:
      - research/opportunity-crisis-switching-20261018
    paths:
      - 'research_extensions/oasis_crisis/run.py'
      - 'research_extensions/oasis_crisis/PROTOCOL.md'
      - '.github/workflows/oasis-crisis-opportunities.yml'
permissions:
  contents: write
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python numerical dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
          python -m py_compile research_extensions/oasis_crisis/run.py
      - name: Audit 5 and 21 session opportunities by as-of crisis stage
        run: |
          python research_extensions/oasis_crisis/run.py
      - name: Preserve independently computed forward-label diagnostics
        run: |
          git config user.name "OASIS-Forensic-Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_extensions/oasis_crisis/RESULT.json
          git commit -m "Persist ex-post crisis regime conditional opportunity skill, actual economic switch evidence"
          git push origin HEAD:refs/heads/research/opportunity-crisis-switching-20261018
