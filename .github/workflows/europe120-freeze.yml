name: EU120 frozen universe validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'europe120/freeze_eu120_candidates.py'
      - '.github/workflows/europe120-freeze.yml'
  pull_request:
    paths:
      - 'europe120/freeze_eu120_candidates.py'
      - '.github/workflows/europe120-freeze.yml'

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow yfinance
      - name: Validate and freeze EU120
        run: python europe120/freeze_eu120_candidates.py
      - name: Upload frozen EU120
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu120-frozen-20260701
          path: europe120/frozen_output/
          retention-days: 30
