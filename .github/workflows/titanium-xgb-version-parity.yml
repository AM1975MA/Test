name: Titanium XGBoost Version Parity
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  version-parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {xgb: '2.1.4', tag: xgb214}
          - {xgb: '3.0.2', tag: xgb302}
          - {xgb: '3.1.3', tag: xgb313}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install stack
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==${{ matrix.xgb }} joblib==1.5.3 pyarrow matplotlib numba
      - name: Fetch parity audit source
        run: curl -fsSL https://raw.githubusercontent.com/AM1975MA/Test/titanium-live-package-regeneration-20260804/regeneration/compact_param_archaeology.py -o compact_param_archaeology.py
      - name: Download canonical package
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o canonical.zip
          mkdir artifact && unzip -q canonical.zip -d artifact
          inner=$(find artifact -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' -print -quit); test -n "$inner"
          mkdir pkg && unzip -q "$inner" -d pkg
      - name: Run exact same Compact configuration
        run: |
          python - <<'PY'
          import xgboost; print('XGBOOST_VERSION', xgboost.__version__)
          PY
          root=$(dirname $(dirname $(find pkg -name SCORECARD_SUMMARY.json -print -quit)))
          python compact_param_archaeology.py --package-root "$root" --tag '${{ matrix.tag }}' --trees 360 --depth 4 --lr 0.035 --mcw 8 --lam 8 --alpha 0.1 --subsample 0.85 --colsample 0.8 --output 'VER_${{ matrix.tag }}'
      - uses: actions/upload-artifact@v4
        with:
          name: VER_${{ matrix.tag }}
          path: VER_${{ matrix.tag }}/
          retention-days: 7
