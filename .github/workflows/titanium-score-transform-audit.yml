name: Titanium TIT_R Score Transform Audit
on:
  pull_request:
    branches: [titanium-score-transform-base-20260811]
  workflow_dispatch:
jobs:
  score-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow numba matplotlib
      - name: Download trained monthly artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9113321430/zip -o m.zip
          mkdir ma && unzip -q m.zip -d ma
          INNER=$(find ma -name 'TITANIUM_TARGET_monthly.zip' | head -1); test -n "$INNER"
          mkdir monthly && unzip -q "$INNER" -d monthly
          ROOT=$(find monthly -type d -name 'TARGET_monthly' | head -1); test -n "$ROOT"
          echo "MONTHLY_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Download canonical source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o c.zip
          mkdir ca && unzip -q c.zip -d ca
          INNER=$(find ca -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' | head -1); test -n "$INNER"
          mkdir canonical && unzip -q "$INNER" -d canonical
          CROOT=$(find canonical -type d -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE' | head -1); test -n "$CROOT"
          echo "CANONICAL_ROOT=$CROOT" >> "$GITHUB_ENV"
      - name: Audit TIT_R transforms
        run: |
          python forensics/score_transform_audit.py --trained "$MONTHLY_ROOT" --v5-module "$CANONICAL_ROOT/source/titanium_reconstruction_v6.py" --output SCORE_TRANSFORM_AUDIT
      - name: Archive
        run: zip -r TITANIUM_SCORE_TRANSFORM_AUDIT.zip SCORE_TRANSFORM_AUDIT
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_SCORE_TRANSFORM_AUDIT
          path: TITANIUM_SCORE_TRANSFORM_AUDIT.zip
          retention-days: 7
