name: EU120_RULE_WEIGHT_MARGIN_AGREEMENT_FACTORIAL
on:
  pull_request:
    branches: [research/eu120-selection-weight-mediation-20261017]
    paths:
      - '.github/workflows/eu120-rule-factorial.yml'
      - 'eu120_rule_factorial_v1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}:${{ github.workspace }}/europe120/eu120_retrain
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  factorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned original EU120 numerical environment and tests
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'numba==0.65.1' 'threadpoolctl==3.6.0' 'matplotlib==3.10.8'
          python -m py_compile eu120_rule_factorial_v1/run.py
          python -m unittest discover -s eu120_rule_factorial_v1/tests -v
      - name: Recover independently frozen EU120 refits, source daily equity and prior fixed-50/50 paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39064123941 -R AM1975MA/Test -n eu120-compact-return-tail-refit-full -D _frozen
          gh run download 39065982541 -R AM1975MA/Test -n eu120-selection-weight-six-arm-audit -D _prior
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _raw149
          test -f _frozen/H_ONLY_EQUITY.npz
          test -f _frozen/R_H_EQUITY.npz
          test -f _prior/H_HALF.npz
          test -f _prior/R_HALF.npz
      - name: Sixteen full original120 common-open V2 risk-rule ablations with four archival controls
        run: |
          python eu120_rule_factorial_v1/run.py --source _frozen --prior-six _prior --raw149 _raw149 --out _factorial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eu120-margin-agreement-weight-factorial
          retention-days: 90
          path: |
            _factorial/RESULT.json
            _factorial/ECONOMICS.csv
            _factorial/ANNUAL_RETURN.csv
            _factorial/*.npz
