name: LISTNET_LINEAR_RELATIVE_CURVATURE_REPAIR
on:
  push:
    branches: [research/paper-ltr-feasibility-20261012]
    paths: [.github/workflows/listnet-linear-repair.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  linear-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen environment and regression checks
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s paper_ltr_v1/tests -v
          python -m unittest discover -s paper_ltr_v2/tests -v
          python -m unittest discover -s paper_ltr_v2/diagnostics_solver -p 'test_*.py' -v
      - name: Reuse frozen inputs and completed controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38179662587 -R AM1975MA/Test -n paper-ltr-feasibility -D _original
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _baseline
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-audit -D _audit
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-BUDGET300 -D _budget
          for repeat in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$repeat -D "_ti/r$repeat"
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$repeat -D "_bases/r$repeat"
            gh run download 38180179897 -R AM1975MA/Test -n paper-ltr-replay-r$repeat -D "_v1replays/paper-ltr-replay-r$repeat"
          done
      - name: Thirty linear folds under separate repair protocol
        run: python paper_ltr_v2/linear_repair_run.py --variant LINEAR --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --original _original/_candidate --baseline _baseline --diagnostic _audit/AUDIT.json --out _candidate
      - name: Independent checkpoint and predictive checks
        run: python paper_ltr_v2/summarize.py --candidate _candidate --original _original/_candidate --baseline _baseline --diagnostic _audit/AUDIT.json --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --out _comparison/PREDICTIVE.json
      - name: Diagnostic economics on all three frozen downloads
        run: |
          for repeat in 1 2 3; do
            python paper_ltr_v2/replay.py --raw "_raw/_repeat$repeat" --baseline "_bases/r$repeat" --candidate _candidate --repeat "$repeat" --ti-panel "_ti/r$repeat/TI_COMPACT.parquet" --linkage-audit "_audit/linkage-r$repeat/INPUT_LINKAGE.json" --out "_replays/v2replay-LINEAR_NUMERICAL_REPAIR-r$repeat"
          done
          cp -r _budget/_replays/* _replays/
          python paper_ltr_v2/summarize_replay.py --inputs _replays --v1-inputs _v1replays --variants BUDGET300 LINEAR_NUMERICAL_REPAIR --out _comparison/ECONOMIC.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listnet-linear-relative-repair
          retention-days: 90
          path: |
            _candidate/
            _comparison/
            _replays/v2replay-LINEAR_NUMERICAL_REPAIR-*/
