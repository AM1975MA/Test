name: Gap analysis - canonical V2 across repeated Yahoo snapshots

on:
  push:
    branches: [ research/evidence-v2 ]
    paths:
      - '.github/workflows/gap-analysis-yfinance-replay-repeat-v1.yml'
      - 'gap_analysis/src/replay_repeat_snapshot.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact fresh-replay environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib \
            'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' \
            'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'
          python - <<'PY'
          import numpy,pandas,sklearn,xgboost,numba,yfinance
          assert numpy.__version__=='2.3.5'
          assert pandas.__version__=='2.2.3'
          assert sklearn.__version__=='1.8.0'
          assert xgboost.__version__=='3.1.3'
          assert numba.__version__=='0.65.1'
          assert yfinance.__version__=='0.2.66'
          print('ENV_GATE_PASS')
          PY

      - name: Gate exact productive V2 source blobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exp = {
            'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
            'vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223',
            'vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
            'vendor/etf_trader_v2/src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ddfirst.py':'3794564fdfe8501c2c19e618bc7d1550884aeb53',
            'vendor/etf_trader_v2/src/etf_trader/ma3/v6.py':'6c5d3fd6f54fb5ef5162f4b26d3ef9af2af34701',
            'vendor/p45/v2_stage19_kernel.py':'364c16f61d1866946827626e0d8f26dab276aca4',
          }
          lf_fix={
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py',
          }
          for p,want in exp.items():
              got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              if got!=want and p in lf_fix:
                  path=Path(p); raw=path.read_bytes()
                  if not raw.endswith(b'\n'):
                      path.write_bytes(raw+b'\n')
                      got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              assert got==want,(p,got,want)
          print('CANONICAL_V2_SOURCE_GATE_PASS')
          PY

      - name: Restore three frozen repeated Yahoo snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R ${{ github.repository }} \
            -n yfinance-repeatability-v1-raw -D _raw
          test -f _raw/_repeat${{ matrix.repeat }}/universe.csv
          test -f _raw/_repeat${{ matrix.repeat }}/manifest.json
          test "$(find _raw/_repeat${{ matrix.repeat }} -maxdepth 1 -name '*.csv' | wc -l)" -ge 150

      - name: Restore exact canonical comparison runner
        run: |
          mkdir -p holdout70
          curl -fsSL \
            'https://raw.githubusercontent.com/AM1975MA/Test/research/v2-same-source-149-vs-70-20261002/holdout70/v2_canonical_same_source_compare.py' \
            -o holdout70/v2_canonical_same_source_compare.py
          test "$(git hash-object holdout70/v2_canonical_same_source_compare.py)" = 'ebd578e0d92e986adb5c2fbf265a346f87b7218e'
          echo CANONICAL_RUNNER_GATE_PASS

      - name: Replay canonical Annual V2 on snapshot
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
          ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
          ETF_TRADER_XGB_WORKERS: '3'
        run: |
          python gap_analysis/src/replay_repeat_snapshot.py \
            --raw _raw/_repeat${{ matrix.repeat }} \
            --compare-script holdout70/v2_canonical_same_source_compare.py \
            --out _result

      - name: Upload compact replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: repeat-replay-${{ matrix.repeat }}
          retention-days: 90
          if-no-files-found: error
          path: |
            _result/original149/RESULT.json
            _result/original149/INPUT_CONTRACT.json
            _result/original149/ENSEMBLE_FIT_AUDIT.csv
            _result/original149/DAILY_LEADERS.csv

  summarize:
    needs: replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: repeat-replay-*
          path: _collected

      - name: Build frozen comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          roots=sorted(Path('_collected').glob('repeat-replay-*'))
          rows=[]
          for root in roots:
              p=next(root.rglob('RESULT.json'))
              r=json.loads(p.read_text())
              rep=int(root.name.rsplit('-',1)[-1])
              m=r['v2_full_universe']
              s=r['source_only']
              rows.append({
                  'repeat':rep,
                  'cagr':m['cagr'],
                  'maxdd':m['maxdd'],
                  'sharpe':m['sharpe'],
                  'terminal_equity':m['terminal_equity'],
                  'annualized_turnover':m['annualized_turnover'],
                  'titanium_sha256':s['titanium_full_sha256'],
                  'predictions_sha256':s['predictions_sha256'],
                  'ma3_panel_sha256':s['ma3_panel_sha256'],
              })
          rows=sorted(rows,key=lambda x:x['repeat'])
          if len(rows)!=3: raise RuntimeError(rows)
          cagrs=[x['cagr'] for x in rows]
          out={
              'status':'CANONICAL_V2_REPEAT_REPLAY_COMPLETE',
              'baseline_reference_fresh_cagr':0.31603994562922105,
              'replays':rows,
              'cagr_min':min(cagrs),
              'cagr_max':max(cagrs),
              'cagr_span':max(cagrs)-min(cagrs),
              'cagr_span_percentage_points':100*(max(cagrs)-min(cagrs)),
              'max_abs_vs_31pp_reference':max(abs(x-0.31603994562922105) for x in cagrs),
              'unique_titanium_hashes':len(set(x['titanium_sha256'] for x in rows)),
              'unique_prediction_hashes':len(set(x['predictions_sha256'] for x in rows)),
              'unique_ma3_panel_hashes':len(set(x['ma3_panel_sha256'] for x in rows)),
              'interpretation_rule':{
                  'stable_if_cagr_span_pp_le_0_25':100*(max(cagrs)-min(cagrs))<=0.25,
                  'materially_unstable_if_cagr_span_pp_ge_2':100*(max(cagrs)-min(cagrs))>=2.0,
              },
              'source_contract':'same canonical V2 blobs and pinned fresh-replay environment for all three jobs',
              'raw_input_contract':'three consecutive Yahoo/yfinance 0.2.66 downloads from run 37121749852',
          }
          dest=Path('gap_analysis/results/yfinance_repeatability_replay_v1')
          dest.mkdir(parents=True,exist_ok=True)
          (dest/'RESULT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Persist comparison
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin research/evidence-v2
          git add gap_analysis/results/yfinance_repeatability_replay_v1/RESULT.json
          git commit -m 'Persist canonical V2 repeated-data replay result' || true
          git push origin HEAD:research/evidence-v2

      - uses: actions/upload-artifact@v4
        with:
          name: yfinance-repeatability-v1-canonical-replay-summary
          retention-days: 90
          path: gap_analysis/results/yfinance_repeatability_replay_v1/RESULT.json
