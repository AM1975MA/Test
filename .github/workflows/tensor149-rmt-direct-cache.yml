name: ORIGINAL149_RMT_DIRECT_FEATURES_PRECOMPUTE_QA
on:
  push:
    branches: [research/original149-rmt-direct-features-20261020]
    paths: ['.github/workflows/tensor149-rmt-direct-cache.yml']
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: '${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  causal_features:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Pinned original matrix and CPU ranker packages
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'matplotlib==3.10.8' 'pyarrow==23.0.1'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and synthetic future-truncation evidence
        run: |
          python -m py_compile tensor149_tcn5d/rmt_direct_features.py tensor149_tcn5d/rmt_direct_run.py tensor149_tcn5d/test_rmt_direct.py
          python -m unittest -v tensor149_tcn5d.test_rmt_direct tensor149_tcn5d.test_contract
      - name: Generate causal daily RMT global ETF and matched correlation control tensors
        run: |
          set -o pipefail
          python -m tensor149_tcn5d.rmt_direct_features --raw evidence_v1/data/original149 --out _rmtcache | tee _cache.log
      - name: Preserve immutable reusable source verified RMT feature cache
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original149-rmt-direct-daily-causal-cache
          retention-days: 90
          path: |
            _rmtcache/
            _cache.log
