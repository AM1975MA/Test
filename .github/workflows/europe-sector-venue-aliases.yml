name: EUROPE_EQUITY_SECTOR_YAHOO_ALIAS_RECOVERY
on:
  push:
    branches:
      - research/europe-sector-alternatives-amundi-xtrackers-20261019
    paths:
      - '.github/workflows/europe-sector-venue-aliases.yml'
      - 'europe_sector2026/aliases/CATALOG.csv'
      - 'europe_sector2026/aliases/run.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover-xetra-and-milan-8:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin vendor runtime, compile
        run: |
          python -m pip install 'yfinance==0.2.65' 'numpy==2.3.5' 'pandas==2.2.3'
          python -m py_compile europe_sector2026/aliases/run.py
      - name: Confirm original benchmark, independent instruments vs same-ISIN venue identity
        run: |
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv("europe_sector2026/aliases/CATALOG.csv")
          assert len(x)==8 and x.ticker.is_unique
          assert (x.comparison_type=="SAME_ISIN_MILAN").sum()==3
          assert (x.comparison_type=="XETRA_ALIAS").sum()==4
          PY
      - name: Fetch Yahoo quotes for alias tickers, grade original vs alternative
        run: |
          python -m europe_sector2026.aliases.run --out _ALIASES
      - name: Verify checksum files and source provenance
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,pandas as pd
          p=pathlib.Path("_ALIASES")
          a=pd.read_csv(p/"ALIAS_AUDIT.csv")
          assert len(a)==8
          for line in (p/"SHA256_MANIFEST.txt").read_text().splitlines():
              h,f=line.split("  ",1)
              assert hashlib.sha256((p/f).read_bytes()).hexdigest()==h
          print("STATUS",json.loads((p/"RESULT.json").read_text())["results"])
          PY
      - name: Archive new venue Yahoo sources
        run: |
          mkdir -p europe_sector2026/aliases/results
          cp -a _ALIASES/. europe_sector2026/aliases/results/
          git config user.name "EUROPE-ETF-SECTOR-VENUE-ALIASES"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add europe_sector2026/aliases/results
          git commit -m "Verify ticker aliases and same-ISIN EU ETF venue quotes against Yahoo stalled or zero-volume histories"
          git push origin HEAD:refs/heads/research/europe-sector-alternatives-amundi-xtrackers-20261019
      - name: Retain provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: europe-sector-8-alternative-venue-alias-yahoo-quotes
          retention-days: 90
          path: _ALIASES/
