name: INDEPENDENT_STOCHASTIC_BAYESIAN_RISK_H10
on:
  push:
    branches:
      - research/independent-stochastic-ergodic-20261018
    paths:
      - 'independent_stochastic/risk_stage2.py'
      - 'independent_stochastic/H10_BAYESIAN_RISK_PROTOCOL.md'
      - '.github/workflows/independent-bayesian-risk-h10.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONHASHSEED: '0'
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}/europe120/eu120_retrain:${{ github.workspace }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  frozen-risk-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen source-compatible runtime
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
          python -m py_compile independent_stochastic/risk_stage2.py
      - name: Restore previous D1 strategy without reranking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39119879600 -R AM1975MA/Test -n independent-stochastic-ergodic-eu60-v1 -D _independent
          test -f _independent/MONTHLY_LEDGER.csv
          test -f _independent/RESULT.json
      - name: Execute as-of HMM and heavy-tail budget frozen ablations
        run: |
          python independent_stochastic/risk_stage2.py --independent _independent --out _risk
      - name: Preserve full probabilistic risk forecasts, calendar and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-stochastic-bayesian-risk-h10-v1
          retention-days: 90
          path: |
            _risk/RESULT.json
            _risk/MONTHLY_LEDGER.csv
            _risk/PROBABILITY_AND_TAIL_RISK.csv
