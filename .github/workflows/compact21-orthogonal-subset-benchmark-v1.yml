name: COMPACT21_ORTHOGONAL_SUBSET_BENCHMARK_V1
on:
  pull_request:
    branches: [research/compact21-orthogonal-feature-ablation-v1]
    paths:
      - feature_ablation_v1/subset_benchmark_trigger.txt
      - feature_ablation_v1/selected_sets.json
      - feature_ablation_v1/run_subset_benchmark.py
      - feature_ablation_v1/summarize_subset_benchmark.py
      - .github/workflows/compact21-orthogonal-subset-benchmark-v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [BASE125,K8,K12,K16,K24,K32,K40,FAMILY46]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen numerical environment
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Recover frozen three-snapshot Compact21 panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _ti/r1 _ti/r2 _ti/r3 _subset
          gh run download 37150436612 -R "${{ github.repository }}" -n titanium-internal-fixed-repeat-1 -D _ti/r1
          gh run download 37150436612 -R "${{ github.repository }}" -n titanium-internal-fixed-repeat-2 -D _ti/r2
          gh run download 37150436612 -R "${{ github.repository }}" -n titanium-internal-fixed-repeat-3 -D _ti/r3
      - name: Canonical XGB on frozen feature subset
        run: |
          python feature_ablation_v1/run_subset_benchmark.py             --variant ${{ matrix.variant }}             --sets feature_ablation_v1/selected_sets.json             --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3             --out _subset/${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-subset-${{ matrix.variant }}
          retention-days: 90
          path: _subset/${{ matrix.variant }}.json
  summary:
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: compact21-subset-*
          path: _subsets
      - name: Frozen stability and predictive-quality gate
        run: |
          mkdir -p _summary
          python feature_ablation_v1/summarize_subset_benchmark.py             --inputs _subsets             --out _summary/SUBSET_BENCHMARK.json             --md _summary/SUBSET_BENCHMARK.md
      - uses: actions/upload-artifact@v4
        with:
          name: compact21-subset-benchmark-summary
          retention-days: 90
          path: _summary/*
