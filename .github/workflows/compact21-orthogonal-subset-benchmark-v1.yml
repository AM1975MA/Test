name: COMPACT21_K13A_FULL_REPLAY
on:
  pull_request:
    branches: [research/compact21-k12-forward-ablation-v1]
    paths:
      - feature_ablation_v1/k12_forward_v1/run_full_pipeline_k13a.py
      - feature_ablation_v1/k12_forward_v1/full_replay_trigger.txt
      - .github/workflows/compact21-orthogonal-subset-benchmark-v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
  ETF_TRADER_XGB_WORKERS: '3'
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        repeat: [1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen productive environment
        run: python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66' 'pyarrow==23.0.1' 'scipy==1.17.0'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Frozen Original149 raw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R "${{ github.repository }}" -n yfinance-repeatability-v1-raw -D _raw
          test "$(git hash-object holdout70/v2_canonical_same_source_compare.py)" = ebd578e0d92e986adb5c2fbf265a346f87b7218e
      - name: Full K13A economic replay
        run: |
          mkdir -p _full
          python feature_ablation_v1/k12_forward_v1/run_full_pipeline_k13a.py \
            --raw "_raw/_repeat${{ matrix.repeat }}" \
            --compare-script holdout70/v2_canonical_same_source_compare.py \
            --variant K13A \
            --out _full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-k13a-full-r${{ matrix.repeat }}
          retention-days: 90
          path: |
            _full/INPUT_CONTRACT.json
            _full/RESULT_K13A.json
            _full/DAILY_LEADERS_K13A.csv
            _full/**/stability_transform_*.json
            _full/**/ENSEMBLE_FIT_AUDIT.csv
