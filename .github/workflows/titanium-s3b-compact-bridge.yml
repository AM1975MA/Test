name: Titanium S3B Compact bridge

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/apply_s3b_compact_bridge.py'
      - '.github/workflows/titanium-s3b-compact-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bridge:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {id: R21_B5_MED_OLDENV, target: R21, relevance: B5, median: 'yes'}
          - {id: R21_B5_NOMED_OLDENV, target: R21, relevance: B5, median: 'no'}
          - {id: R21_R100_MED_OLDENV, target: R21, relevance: R100, median: 'yes'}
          - {id: MONTHLY_B5_MED_OLDENV, target: MONTHLY, relevance: B5, median: 'yes'}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install documented S3B environment core
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.6.1 xgboost==2.1.4 joblib==1.5.3 numba 'pyarrow>=16,<24' matplotlib
          python - <<'PY'
          import sklearn,xgboost
          print('sklearn',sklearn.__version__,'xgb',xgboost.__version__)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE
          path: input
          repository: AM1975MA/Test
          run-id: 31464219662
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize exact bridge candidate
        run: |
          mkdir -p input/package work
          unzip -q input/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip -d input/package
          ROOT=input/package/HISTORICAL_F2D_RECOVERY
          python titanium_training_native/rebuild_v1.py --runner-input $ROOT/code/HISTORICAL_F2D_RUNNER.py --execution-input $ROOT/code/source_execution_reconstruction.py --runner-output work/candidate.py --execution-output work/exact_execution.py
          MED=''
          if [ '${{ matrix.median }}' = 'yes' ]; then MED='--median'; fi
          python titanium_training_native/apply_s3b_compact_bridge.py --source work/candidate.py --target ${{ matrix.target }} --relevance ${{ matrix.relevance }} $MED
          python -m py_compile work/candidate.py work/exact_execution.py
      - name: Train from scratch and backtest 500 baskets
        run: |
          ROOT=input/package/HISTORICAL_F2D_RECOVERY
          python work/candidate.py --base-module $ROOT/code/source_feature_engine.py --v5-module work/exact_execution.py --data-dir $ROOT --output results --n-estimators 60 --n-baskets 500
      - name: Score bridge against frozen
        run: |
          python - <<'PY'
          import json,math,pandas as pd
          from pathlib import Path
          fr={'D1':.15022713687299,'D2':.2264479079604543,'DEV':.1861726630584223,'HOLD':.2760542274772661,'FULL':.2165406437471759}
          sc=pd.read_csv('results/PERIOD_SCORECARD_500.csv'); b=sc[sc.strategy.eq('BASE')].set_index('period'); chk=json.loads(Path('results/KNOWN_SIGNAL_CHECK.json').read_text())
          periods={p:{'cagr':float(b.loc[p,'cagr']),'gap_pp':100*(float(b.loc[p,'cagr'])-v)} for p,v in fr.items()}
          rmse=math.sqrt(sum(x['gap_pp']**2 for x in periods.values())/len(periods))
          o={'id':'${{ matrix.id }}','target':'${{ matrix.target }}','relevance':'${{ matrix.relevance }}','median':'${{ matrix.median }}','xgboost':'2.1.4','sklearn':'1.6.1','periods':periods,'rmse_pp_5periods':rmse,'checkpoint':chk}
          Path('results/BRIDGE_SCORE.json').write_text(json.dumps(o,indent=2,default=str)); print(json.dumps(o,indent=2,default=str))
          PY
      - name: Archive
        if: always()
        run: |
          mkdir -p artifact/source
          cp -f work/candidate.py work/exact_execution.py artifact/source/ 2>/dev/null || true
          if [ -d results ]; then cp -a results artifact/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_BRIDGE_${{ matrix.id }}
          path: artifact
          retention-days: 30
