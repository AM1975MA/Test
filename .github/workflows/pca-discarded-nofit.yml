name: PCA_DISCARDED_FROZEN_WEIGHTS_NOFIT
on:
  push:
    branches: [research/pca-discarded-audit-20261016]
    paths: [.github/workflows/pca-discarded-nofit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
          python -m unittest discover -s pca_discarded_v1/tests -v
      - name: Reuse completed models and exact frozen feature panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38580178650 -R AM1975MA/Test -n listnet-linear-relative-repair -D _annual
          gh run download 38968119427 -R AM1975MA/Test -n linear-pca95-models -D _pca
          for i in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$i -D _ti/r$i
          done
      - name: Frozen coefficient and predictive decomposition only
        run: python pca_discarded_v1/run.py --annual _annual/_candidate --pca _pca --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --out _diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pca-discarded-nofit
          retention-days: 90
          path: _diagnostic/
