name: COMPACT21_BASE_TOP5_ECONOMIC_RERANK
on:
  pull_request:
    branches: [research/compact21-economic-layer-20261017]
    paths: [.github/workflows/compact21-top5-economic-rerank.yml, 'compact21_top5_rerank_v1/**', paper_ltr_v2/replay.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  top5-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen numerical environment and validate deterministic rerank
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python -m py_compile compact21_top5_rerank_v1/core.py compact21_top5_rerank_v1/run.py compact21_top5_rerank_v1/summarize.py
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s compact21_top5_rerank_v1/tests -v
      - name: Download frozen original Compact21 BASE and already trained historical OOS economic layer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _base
          gh run download 39039845251 -R AM1975MA/Test -n compact21-oos-economic-layer-predictive -D _old_layer
      - name: Strict BASE-top5 permutation only, identical original scoring distribution and primary regret audit
        run: |
          python compact21_top5_rerank_v1/run.py --base _base --old-layer _old_layer/ECON_LAYER_OOS30 --out _top5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-top5-rerank-predictive
          retention-days: 90
          path: _top5/
      - name: Retrieve canonical frozen full-portfolio inputs and source linkage certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-audit -D _audit
          for i in 1 2 3; do
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$i -D _bases/r$i
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$i -D _ti/r$i
          done
      - name: Three complete canonical V2 replays and independent equity and ranking audits
        run: |
          mkdir -p _replays
          for i in 1 2 3; do
            python paper_ltr_v2/replay.py --raw _raw/_repeat$i --baseline _bases/r$i --candidate _top5/ECON_TOP5_RERANK --repeat $i --ti-panel _ti/r$i/TI_COMPACT.parquet --linkage-audit _audit/linkage-r$i/INPUT_LINKAGE.json --out _replays/v2replay-ECON_TOP5_RERANK-r$i
          done
          python compact21_top5_rerank_v1/summarize.py --replays _replays --out _replays/TOP5_RERANK_ECONOMIC.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-top5-rerank-economic
          retention-days: 90
          path: _replays/
