name: V3 L10.D1 durable audit data archive
on:
  push:
    branches: [research-v3-l10d-analytic-signal-20261022]
    paths: ['etf-trader-v3 corrected/experiments/l10_analytic_discriminator/START_ARCHIVE.txt']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Download successful D1 outputs and verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/l10d1_source
          gh run download 39738471945 --repo AM1975MA/Test --name v3-l10d1-analytical-discriminator --dir /tmp/l10d1_source
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("/tmp/l10d1_source")
          assert sum(1 for _ in csv.DictReader(open(p/"ANALYTIC_MONTHLY.csv")))==101
          m=json.loads((p/"MANIFEST.json").read_text())
          assert m["expected_mature_months"]==101
          assert m["frozen_scores_run"]==39700865721
          assert m["raw_run"]==39482809691
          assert m["no_model_training"] and m["no_CAGR"] and m["no_production_change"]
          PY
      - name: Atomic source-faithful archive using Git (handles >1MB CSV)
        run: |
          git fetch origin main
          git switch -c l10d1-archive origin/main
          mkdir -p 'etf-trader-v3 corrected/reports/L10/data_run_39738471945'
          cp /tmp/l10d1_source/* 'etf-trader-v3 corrected/reports/L10/data_run_39738471945/'
          git add 'etf-trader-v3 corrected/reports/L10/data_run_39738471945'
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "All source artifacts already archived"; exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "L10.D1 archive all source monthly, annual and OOS signal outputs"
          git push origin HEAD:main
