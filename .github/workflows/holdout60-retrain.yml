name: Holdout60 Annual Monthly causal retrain

on:
  push:
    branches: [ research/holdout60-20261002 ]
    paths: [ '.github/workflows/holdout60-retrain.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source requirements
        run: python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib 'pandas==2.2.3'
      - name: Retrieve frozen holdout60
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36993278058 -R ${{ github.repository }} -n holdout60-frozen-20260731 -D _holdout60
      - name: Retrieve frozen 149 reference prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36551650325 -R ${{ github.repository }} -n etf-trader-raw-149 -D _raw149
      - name: Validate frozen inputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          h=Path('_holdout60'); r=Path('_raw149/etf_trader_raw')
          u=list(csv.DictReader((h/'raw_ticker_csv/universe.csv').open()))
          v=list(csv.DictReader((r/'universe.csv').open()))
          m=json.loads((h/'manifest.json').read_text())
          assert len(u)==60 and len(v)==149
          assert m['selected_count']==60 and m['intersection_with_original149']==[]
          assert not ({x['ticker'] for x in u} & {x['ticker'] for x in v})
          assert all((h/'raw_ticker_csv'/(x['ticker']+'.csv')).is_file() for x in u)
          print('HOLDOUT60_INPUT_GATE_PASS')
          PY
      - name: Prepare holdout60 causal runner
        run: |
          cp europe120/eu120_retrain/run_eu120_retrain.py holdout60/run_holdout60_retrain.py
          cp europe120/eu120_retrain/build_ma3_panel_causal.py holdout60/build_ma3_panel_causal.py
          cp europe120/eu120_retrain/bocpd_router.py holdout60/bocpd_router.py
          sed -i 's/FROZEN_EU120_ROOT/FROZEN_HOLDOUT60_ROOT/g' holdout60/run_holdout60_retrain.py
          sed -i 's/len(meta)==120/len(meta)==60/g' holdout60/run_holdout60_retrain.py
          sed -i 's/UNIVERSE_120.csv/FROZEN_UNIVERSE.csv/g' holdout60/run_holdout60_retrain.py
          sed -i 's/len(target)==120/len(target)==60/g' holdout60/run_holdout60_retrain.py
          sed -i 's/training_target_overlap":120/training_target_overlap":60/g' holdout60/run_holdout60_retrain.py
          sed -i 's/120 ETF expanding walk-forward/60 ETF expanding walk-forward/g' holdout60/run_holdout60_retrain.py
          sed -i 's/P45_EU120_RETRAIN_COMPLETE/HOLDOUT60_RETRAIN_COMPLETE/g' holdout60/run_holdout60_retrain.py
          sed -i 's/ANNUAL_PREDICTIONS_120/ANNUAL_PREDICTIONS_60/g; s/MONTHLY_PREDICTIONS_120/MONTHLY_PREDICTIONS_60/g; s/PATHS_120/PATHS_60/g' holdout60/run_holdout60_retrain.py
      - name: Fit and replay holdout60
        env:
          ETF_TRADER_ROOT: ${{ github.workspace }}/vendor/etf_trader_v2
          FROZEN_HOLDOUT60_ROOT: ${{ github.workspace }}/_holdout60
          FROZEN_149_ROOT: ${{ github.workspace }}/_raw149
          EU120_LEGACY_REPLAY: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: python holdout60/run_holdout60_retrain.py
      - name: Show result
        if: success()
        run: |
          cat holdout60/results/RESULT.json
          echo '--- annual comparison ---'
          cat holdout60/results/ANNUAL_COMPARISON.csv
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holdout60-causal-retrain-results
          if-no-files-found: warn
          retention-days: 30
          path: |
            holdout60/results/RESULT.json
            holdout60/results/ANNUAL_COMPARISON.csv
            holdout60/results/ANNUAL_PREDICTIONS_60.csv
            holdout60/results/MONTHLY_PREDICTIONS_60.csv
            holdout60/results/MODEL_BUNDLE_MANIFEST.json
            holdout60/results/ROUTER_TRACE.csv
            holdout60/results/SHADOW_SKILL.csv
            holdout60/results/PATHS_60.npz
