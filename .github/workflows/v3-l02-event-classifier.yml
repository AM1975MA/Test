name: V3 L02 independent upper-tail event classification
on:
  push:
    branches: [research-v3-l00-quality-l01-ranker-20261021]
    paths:
      - '.github/workflows/v3-l02-event-classifier.yml'
      - 'etf-trader-v3 corrected/experiments/l02_tail_classifier/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fit:
    name: Tail rare-event model ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: years_2018_2020, years: '2018,2019,2020'}
          - {shard: years_2021_2023, years: '2021,2022,2023'}
          - {shard: years_2024_2026, years: '2024,2025,2026'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - name: Load exact same frozen 149 ETF OHLCV and completed dedup45 Tail baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/v3_l02_reference
          gh run download 39482809691 --repo AM1975MA/Test \
            --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          gh run download 39654585994 --repo AM1975MA/Test \
            --name v3-l02-tail-only-results --dir runs/v3_l02_reference
          python regeneration/certify_etf_trader_raw.py
          test -s runs/v3_l02_reference/OOS_SCORES.csv
          test -s runs/v3_l02_reference/PAIRED_MONTHLY.csv
      - name: Classify fully matured future elite Tail events, never retrain Compact
        run: |
          python 'etf-trader-v3 corrected/experiments/l02_tail_classifier/classifier.py' \
            --years '${{ matrix.years }}' \
            --raw etf_trader_raw \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --control runs/v3_l02_reference \
            --out 'runs/v3_l02_event_shards/${{ matrix.shard }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l02-event-${{ matrix.shard }}
          path: runs/v3_l02_event_shards/
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    name: Tail skill validation AP, Recall and false-selection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: v3-l02-event-years_*
          merge-multiple: true
          path: runs/v3_l02_event_shards/
      - name: Verify paired 98 matured Tail-label dates and bootstrap month uncertainty
        run: |
          python 'etf-trader-v3 corrected/experiments/l02_tail_classifier/aggregate.py' \
            --root runs/v3_l02_event_shards \
            --out runs/v3_l02_event_complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l02-elite-classification-complete
          path: runs/v3_l02_event_complete/
          if-no-files-found: warn
          retention-days: 90
