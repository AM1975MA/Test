name: V2 controlled fresh 149 vs 70

on:
  push:
    branches: [ research/v2-same-source-149-vs-70-20261002 ]
    paths:
      - '.github/workflows/v2-controlled-fresh-149-vs-70.yml'
      - 'holdout70/download_uniform_yahoo.py'
      - 'holdout70/v2_fresh_same_source_compare.py'
      - 'holdout70/v2_canonical_same_source_compare.py'
      - 'holdout70/universes/**'
      - 'holdout70/CANONICAL_149_REFERENCE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install one locked numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib \
            'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' \
            'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'
          python - <<'PY'
          import sys, numpy, pandas, sklearn, xgboost, numba, yfinance
          print('python', sys.version)
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('sklearn', sklearn.__version__)
          print('xgboost', xgboost.__version__)
          print('numba', numba.__version__)
          print('yfinance', yfinance.__version__)
          PY

      - name: Gate exact productive V2 source blobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exp = {
            'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
            'vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223',
            'vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
            'vendor/etf_trader_v2/src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ddfirst.py':'3794564fdfe8501c2c19e618bc7d1550884aeb53',
            'vendor/etf_trader_v2/src/etf_trader/ma3/v6.py':'6c5d3fd6f54fb5ef5162f4b26d3ef9af2af34701',
            'vendor/p45/v2_stage19_kernel.py':'364c16f61d1866946827626e0d8f26dab276aca4',
          }
          lf_fix = {
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py',
          }
          for p, want in exp.items():
              got = subprocess.check_output(['git','hash-object',p], text=True).strip()
              if got != want and p in lf_fix:
                  path = Path(p)
                  raw = path.read_bytes()
                  if not raw.endswith(b'\n'):
                      path.write_bytes(raw + b'\n')
                      got = subprocess.check_output(['git','hash-object',p], text=True).strip()
              print(p, got)
              assert got == want, (p, got, want)
          print('CANONICAL_V2_SOURCE_GATE_PASS')
          PY

      - name: Download both universes with one identical raw contract
        run: |
          python holdout70/download_uniform_yahoo.py \
            --universe holdout70/universes/original149.csv \
            --output _fresh149/etf_trader_raw \
            --start 2004-01-01 --end 2026-08-01
          python holdout70/download_uniform_yahoo.py \
            --universe holdout70/universes/holdout70.csv \
            --output _fresh70/raw_ticker_csv \
            --start 2004-01-01 --end 2026-08-01

      - name: Verify controlled raw contract
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          u149=pd.read_csv('_fresh149/etf_trader_raw/universe.csv')
          u70=pd.read_csv('_fresh70/raw_ticker_csv/universe.csv')
          assert len(u149)==149 and u149.ticker.nunique()==149
          assert len(u70)==70 and u70.ticker.nunique()==70
          assert not (set(u149.ticker) & set(u70.ticker))
          m149=json.loads(Path('_fresh149/etf_trader_raw/manifest.json').read_text())
          m70=json.loads(Path('_fresh70/raw_ticker_csv/manifest.json').read_text())
          for m,n in [(m149,149),(m70,70)]:
              assert m['status']=='UNIFORM_YAHOO_FRESH_RAW'
              assert m['requested_start']=='2004-01-01'
              assert m['requested_end_exclusive']=='2026-08-01'
              assert m['tickers']==n
              assert m['price_semantics']=='same-row Adj Close/raw Close adjustment for OHLC; raw Volume'
          print('CONTROLLED_RAW_GATE_PASS')
          PY

      - name: Run identical canonical V2 freely on all 149 and all 70 candidates
        env:
          FRESH_149_ROOT: ${{ github.workspace }}/_fresh149
          FRESH_70_ROOT: ${{ github.workspace }}/_fresh70
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: python holdout70/v2_fresh_same_source_compare.py

      - name: Show result
        if: always()
        run: |
          test -f holdout70/fresh_same_source_results/COMPARISON.json && cat holdout70/fresh_same_source_results/COMPARISON.json || true

      - name: Freeze exact fresh raw used by this comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-controlled-fresh-raw-149-70
          retention-days: 90
          if-no-files-found: error
          path: |
            _fresh149/etf_trader_raw
            _fresh70/raw_ticker_csv

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-controlled-fresh-149-vs-70-results
          retention-days: 90
          if-no-files-found: warn
          path: |
            holdout70/fresh_same_source_results/COMPARISON.json
            holdout70/fresh_same_source_results/original149/RESULT.json
            holdout70/fresh_same_source_results/original149/INPUT_CONTRACT.json
            holdout70/fresh_same_source_results/original149/ENSEMBLE_FIT_AUDIT.csv
            holdout70/fresh_same_source_results/original149/DAILY_LEADERS.csv
            holdout70/fresh_same_source_results/original149/FULL_UNIVERSE_PATH.npz
            holdout70/fresh_same_source_results/holdout70/RESULT.json
            holdout70/fresh_same_source_results/holdout70/INPUT_CONTRACT.json
            holdout70/fresh_same_source_results/holdout70/ENSEMBLE_FIT_AUDIT.csv
            holdout70/fresh_same_source_results/holdout70/DAILY_LEADERS.csv
            holdout70/fresh_same_source_results/holdout70/FULL_UNIVERSE_PATH.npz
