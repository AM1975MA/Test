name: V2 replay-only frozen-fresh 149 vs 70

on:
  push:
    branches: [ research/v2-same-source-149-vs-70-20261002 ]
    paths:
      - '.github/workflows/v2-controlled-fresh-149-vs-70.yml'
      - 'holdout70/v2_replay_only_from_checkpoint.py'
      - 'holdout70/v2_canonical_same_source_compare.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install locked replay environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib \
            'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' \
            'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'

      - name: Gate exact productive V2 source blobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exp = {
            'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
            'vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223',
            'vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
            'vendor/etf_trader_v2/src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ddfirst.py':'3794564fdfe8501c2c19e618bc7d1550884aeb53',
            'vendor/etf_trader_v2/src/etf_trader/ma3/v6.py':'6c5d3fd6f54fb5ef5162f4b26d3ef9af2af34701',
            'vendor/p45/v2_stage19_kernel.py':'364c16f61d1866946827626e0d8f26dab276aca4',
          }
          lf_fix = {
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py',
          }
          for p, want in exp.items():
              got = subprocess.check_output(['git','hash-object',p], text=True).strip()
              if got != want and p in lf_fix:
                  path = Path(p); raw = path.read_bytes()
                  if not raw.endswith(b'\n'):
                      path.write_bytes(raw + b'\n')
                      got = subprocess.check_output(['git','hash-object',p], text=True).strip()
              assert got == want, (p, got, want)
          print('CANONICAL_V2_SOURCE_GATE_PASS')
          PY

      - name: Restore frozen raw, completed 149 and saved Holdout70 training checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37017429560 -R ${{ github.repository }} \
            -n v2-controlled-fresh-raw-149-70 -D .
          gh run download 37017928047 -R ${{ github.repository }} \
            -n v2-controlled-frozen-fresh-149-vs-70-results -D _partial149
          gh run download 37019935712 -R ${{ github.repository }} \
            -n v2-controlled-frozen-fresh-149-vs-70-resume -D _checkpoint70
          test -f _fresh149/etf_trader_raw/manifest.json
          test -f _fresh70/raw_ticker_csv/manifest.json
          test -f _partial149/original149/RESULT.json
          test -f _checkpoint70/holdout70/TIT_R_CANDIDATES_ONLY.csv
          test -f _checkpoint70/holdout70/ENSEMBLE_TAIL_OOS.csv
          test -f _checkpoint70/holdout70/ma3_panel/RAW_FEATURE_PANEL.pkl

      - name: Verify resume checkpoint contract
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          r149=json.loads(Path('_partial149/original149/RESULT.json').read_text())
          assert r149['candidate_count']==149 and r149['sessions']==2366
          assert abs(r149['v2_full_universe']['cagr']-0.31603994562922105)<1e-12
          tit=pd.read_csv('_checkpoint70/holdout70/TIT_R_CANDIDATES_ONLY.csv')
          pred=pd.read_csv('_checkpoint70/holdout70/ENSEMBLE_TAIL_OOS.csv')
          assert tit.ticker.nunique()==70
          assert pred.ticker.nunique()==70
          print('REPLAY_ONLY_CHECKPOINT_GATE_PASS', len(tit), len(pred))
          PY

      - name: Replay only Holdout70 from checkpoint
        env:
          FRESH_149_ROOT: ${{ github.workspace }}/_fresh149
          FRESH_70_ROOT: ${{ github.workspace }}/_fresh70
          PARTIAL149_ROOT: ${{ github.workspace }}/_partial149
          CHECKPOINT_ROOT: ${{ github.workspace }}/_checkpoint70
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: python holdout70/v2_replay_only_from_checkpoint.py

      - name: Show result
        if: always()
        run: |
          test -f holdout70/fresh_same_source_results/COMPARISON.json && cat holdout70/fresh_same_source_results/COMPARISON.json || true

      - name: Upload final comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-controlled-frozen-fresh-149-vs-70-final
          retention-days: 90
          if-no-files-found: warn
          path: |
            holdout70/fresh_same_source_results/COMPARISON.json
            holdout70/fresh_same_source_results/original149/RESULT.json
            holdout70/fresh_same_source_results/original149/DAILY_LEADERS.csv
            holdout70/fresh_same_source_results/original149/FULL_UNIVERSE_PATH.npz
            holdout70/fresh_same_source_results/holdout70/RESULT.json
            holdout70/fresh_same_source_results/holdout70/INPUT_CONTRACT.json
            holdout70/fresh_same_source_results/holdout70/DAILY_LEADERS.csv
            holdout70/fresh_same_source_results/holdout70/FULL_UNIVERSE_PATH.npz
            holdout70/fresh_same_source_results/holdout70/TIT_R_CANDIDATES_ONLY.csv
            holdout70/fresh_same_source_results/holdout70/ENSEMBLE_TAIL_OOS.csv
