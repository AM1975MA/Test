name: V2_THREE_REPEAT_GLOBAL_DOWNVOL_REPLAY_V1
on:
  push:
    branches: [research/v2-three-repeat-downvol-full-replay-v1]
    paths: [.github/workflows/v2-three-repeat-global-downvol-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen canonical V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib \
            'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' \
            'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'
      - name: Verify immutable baseline V2 kernel before experiment
        run: |
          test "$(git hash-object vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py)" = '045e57996b02d481bd23f6e4dfe53738d43008e5'
          python -m unittest discover -s compact21_downvol_cleanup_v1/tests
      - name: Restore one of the original three Yahoo acquisitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R ${{ github.repository }} -n yfinance-repeatability-v1-raw -D _raw
          test -f "_raw/_repeat${{ matrix.repeat }}/manifest.json"
      - name: Frozen canonical V2 replay runner
        run: |
          mkdir -p holdout70
          curl -fsSL 'https://raw.githubusercontent.com/AM1975MA/Test/research/v2-same-source-149-vs-70-20261002/holdout70/v2_canonical_same_source_compare.py' -o holdout70/v2_canonical_same_source_compare.py
          test "$(git hash-object holdout70/v2_canonical_same_source_compare.py)" = 'ebd578e0d92e986adb5c2fbf265a346f87b7218e'
      - name: Patch ONLY the shared downside-volatility generator across V2 stages
        run: |
          python data_quality_audit_v1/full_v2_downvol_patch.py vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'vendor/etf_trader_v2/src')
          import pandas as pd
          import numpy as np
          from etf_trader.source_only.kernel import rolling_downvol
          ix=pd.date_range('2025-01-01',periods=130,freq='B')
          z=pd.DataFrame({'up':[0.01]*130,'down':[-0.01]*130},index=ix)
          assert rolling_downvol(z,21)['up'].iloc[-1]==0
          assert np.isclose(rolling_downvol(z,21)['down'].iloc[-1],np.sqrt(252)*0.01)
          assert np.isnan(rolling_downvol(z,21)['up'].iloc[19])
          print('PATCH_INTEGRITY_PASS')
          PY
      - name: Replay full canonical ETF Trader V2 with global downvol cleanup
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
          ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
          ETF_TRADER_XGB_WORKERS: '3'
        run: |
          python gap_analysis/src/replay_repeat_snapshot.py --raw "_raw/_repeat${{ matrix.repeat }}" \
            --compare-script holdout70/v2_canonical_same_source_compare.py --out _result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-global-downvol-repeat-${{ matrix.repeat }}
          retention-days: 90
          path: |
            _result/original149/RESULT.json
            _result/original149/INPUT_CONTRACT.json
            _result/original149/ENSEMBLE_FIT_AUDIT.csv
            _result/original149/DAILY_LEADERS.csv
  summarize:
    needs: replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-global-downvol-repeat-*
          path: _collected
      - name: Contrast historical BASE with candidate 3-source economics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=[]
          for p in sorted(Path('_collected').rglob('RESULT.json')):
              r=json.loads(p.read_text())
              v=r['v2_full_universe']
              out.append({'repeat':len(out)+1,'cagr':v['cagr'],'maxdd':v['maxdd'],
                          'sharpe':v['sharpe'],'turnover':v['annualized_turnover'],
                          'terminal_equity':v['terminal_equity']})
          assert len(out)==3,out
          result={'candidate':'RESEARCH_GLOBAL_DOWNVOL_SEMIDEVIATION',
            'scope':'entire shared kernel downstream, all three original Yahoo repeats',
            'baseline_cagr_by_repeat':[0.29753447746605766,0.30843704925646037,0.346770790748319],
            'candidate_by_repeat':out,
            'baseline_cagr_span_pp':4.9236313282261355,
            'candidate_cagr_span_pp':(max(z['cagr'] for z in out)-min(z['cagr'] for z in out))*100,
            'no_production_adoption':True,'other_input_defects_not_certified':True}
          Path('SUMMARY.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v2-global-downvol-three-source-summary
          retention-days: 90
          path: SUMMARY.json
