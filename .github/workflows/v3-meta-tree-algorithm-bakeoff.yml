name: V3 chronological meta decision-tree algorithm bakeoff
on:
  push:
    branches: [research-v3-meta-tree-ensemble-20261024]
    paths:
      - 'etf-trader-v3 corrected/experiments/l00_rank_reg_fusion/BAKEOFF_START.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare_tree_families:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        family: [DT, RF, ET, HGB, XGB, LGB, CAT, XGB_RET, LGB_RET]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned ML algorithms
        run: |
          python -m pip install 'numpy==2.2.6' 'pandas==2.2.3' 'scikit-learn==1.9.1' 'xgboost==3.0.5'
          if [ "${{ matrix.family }}" = "LGB" ] || [ "${{ matrix.family }}" = "LGB_RET" ]; then
            python -m pip install 'lightgbm==4.6.0'
          fi
          if [ "${{ matrix.family }}" = "CAT" ]; then
            python -m pip install 'catboost==1.2.8'
          fi
      - name: Rehydrate same 149 ETF 500 basket 101 mature months
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/v3_rrf
          for shard in s1 s2 s3; do
            gh run download 40016809498 -R AM1975MA/Test -n rrf-regression-$shard -D runs/v3_rrf
          done
          test -s runs/v3_rrf/regression/s1/OOS_SCORES.csv
      - name: Mature-only quarterly unique ETF pair meta training
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -u 'etf-trader-v3 corrected/experiments/l00_rank_reg_fusion/tree_algorithm_bakeoff.py' \
            --family '${{ matrix.family }}' \
            --shards runs/v3_rrf \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out 'runs/v3_tree_algorithms_${{ matrix.family }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-meta-tree-algorithm-${{ matrix.family }}
          path: runs/v3_tree_algorithms_${{ matrix.family }}/
          retention-days: 90
