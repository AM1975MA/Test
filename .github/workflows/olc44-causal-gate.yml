name: OLC44 frozen-input causal score gate
on:
  push:
    branches: [research/olc44-causal-score-gate-20261103]
    paths:
      - research/olc44_causal_gate_20261103/**
      - .github/workflows/olc44-causal-gate.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  prequential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install controlled dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "scikit-learn>=1.5,<2"
      - name: Fetch exact frozen E1 price-vintage artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41724810594 -R AM1975MA/Test -n sector-opportunity-e1-research -D research/olc44_causal_gate_20261103/source_artifact
          test -f research/olc44_causal_gate_20261103/source_artifact/candidate_monthly_labels.csv
      - name: Strict causal model audit and score-gate test
        run: |
          python research/olc44_causal_gate_20261103/olc44_prequential_gate.py
      - name: Preserve evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olc44-causal-score-audit
          path: research/olc44_causal_gate_20261103/results/
          retention-days: 60

      - name: Commit reproducible small-text results to isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/olc44_causal_gate_20261103/results/
          if ! git diff --staged --quiet; then
            git commit -m "research(olc44): archive prequential score and maturity audits"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
