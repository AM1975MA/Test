name: ETF Trader canonical raw regeneration
on:
  workflow_dispatch:
  push:
    paths:
      - 'regeneration/etf_trader_raw.py'
      - '.github/workflows/etf-trader-raw.yml'
jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas yfinance
      - run: python regeneration/etf_trader_raw.py
      - uses: actions/upload-artifact@v4
        with:
          name: etf-trader-raw-149
          path: |
            etf_trader_raw/
            regeneration/titanium_kernel_local.py
            regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv
          retention-days: 30
