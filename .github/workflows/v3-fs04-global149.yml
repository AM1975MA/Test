name: ETF V3 FS04 unrestricted 149 Hybrid24 full risk source-only
on:
  push:
    branches: [research-v3-fs04-full149-20261022]
    paths:
      - 'etf-trader-v3 corrected/fullstack_legacy/START_FS04_GLOBAL149.txt'
permissions:
  contents: read
  actions: read
jobs:
  global149:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install 'numpy==2.3.5' 'pandas==2.2.3' 'numba==0.65.1' 'scipy>=1.13'
      - name: Same source-only original 149 OHLCV and original full V2 as-of scores, no model refitting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/fs02_source_only runs/v3_frozen
          gh run download 39482809691 -R AM1975MA/Test -n v2-deep-leaf-frozen-raw -D etf_trader_raw
          gh run download 39836842157 -R AM1975MA/Test -n v3-fullstack-model-agreement-500 -D runs/fs02_source_only
          gh run download 39700865721 -R AM1975MA/Test -n v3-l10-topk5-risk-tier-results -D runs/v3_frozen
          python regeneration/certify_etf_trader_raw.py
          test -s runs/fs02_source_only/PATH.npz
          test -s runs/fs02_source_only/ENSEMBLE_TAIL_OOS.csv
      - name: Verify original 500 monthly decisions exact, and run new global 149 full-stack Top2 and risk
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          NUMBA_NUM_THREADS: '2'
        run: |
          python -u 'etf-trader-v3 corrected/fullstack_legacy/experiments/fs04_unrestricted149.py' \
            --raw etf_trader_raw \
            --fs02-path runs/fs02_source_only/PATH.npz \
            --fs02-result runs/fs02_source_only/RESULT.json \
            --fs02-pred runs/fs02_source_only/ENSEMBLE_TAIL_OOS.csv \
            --pair runs/v3_frozen/OOS_SCORES.csv \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out runs/fs04_global149
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-fs04-global149-source-only
          path: runs/fs04_global149/
          retention-days: 90
