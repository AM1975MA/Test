name: ETF Trader V2 frozen 127 unrestricted 149 ETF
on:
  push:
    branches: [research-v2-127-free149-20261021]
    paths:
      - 'regeneration/v2_127_free149_replay.py'
      - '.github/workflows/v2-127-free149.yml'
  workflow_dispatch:

jobs:
  free149:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib
      - name: Restore EXACT frozen 149-ETF OHLCV source used for 127 leaves
        uses: actions/download-artifact@v4
        with:
          name: v2-deep-leaf-frozen-raw
          run-id: 39482809691
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: etf_trader_raw/
      - name: Restore causal 127-leaf XGBoost and original Tail Macro predictions
        uses: actions/download-artifact@v4
        with:
          name: v2-127-direct-tail-macro-results
          run-id: 39496306356
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Certify OHLCV and 500 original basket source identity
        run: |
          echo "36a45916b5d8191f3ccd206f39bf3fd3f1ed4bcaffd474e352b69c598f2b6a5e  regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv" | sha256sum --check
          python regeneration/certify_etf_trader_raw.py
      - name: Run unrestricted 149 ETF Top1–Top10 and compare canonical Top2 engine NAV
        run: python regeneration/v2_127_free149_replay.py
      - name: Save audited unrestricted ETF 149 results and NAVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-127-free149-results
          path: |
            runs/v2_127_free149/
            certification/
          if-no-files-found: warn
          retention-days: 30
