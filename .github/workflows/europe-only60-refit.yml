name: EUROPE_ONLY_EUR60_FRESH_BASE_RANK_TAIL_REFIT
on:
  pull_request:
    branches: [research/eu120-margin-predictive-validation-20261017]
    paths:
      - '.github/workflows/europe-only60-refit.yml'
      - 'europe_only75/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}:${{ github.workspace }}/europe120/eu120_retrain
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  europe-refit:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen numerical dependencies and 120/75/60 geography controls
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'numba==0.65.1' 'threadpoolctl==3.6.0' 'matplotlib==3.10.8'
          python -m py_compile europe_only75/refit.py
          python -m unittest discover -s europe_only75/tests -v
      - name: Original immutable market-risk benchmark prices (not training candidates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _raw149
          test -f _raw149/etf_trader_raw/universe.csv
      - name: Refit all 10 annual folds on EUR-trading 60 European ETFs only
        run: |
          python europe_only75/refit.py --raw149 _raw149 --out _europe60
      - name: Upload all new predictions, checks, equity and persisted learner models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: europe-only-eur60-full-refit
          retention-days: 90
          path: |
            _europe60/RESULT.json
            _europe60/TRAINING_AUDIT.csv
            _europe60/COMPACT_REFITTED.parquet
            _europe60/HYBRID_REFITTED.parquet
            _europe60/MONTHLY_QUALITY.csv
            _europe60/ECONOMICS.csv
            _europe60/FIXED_5050.csv
            _europe60/ANNUAL_RETURN.csv
            _europe60/*_EQUITY.npz
            _europe60/models/
