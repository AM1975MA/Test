name: V3 EU48 ACTUAL corrected kernel 127leaf six annual OOS heads
on:
  push:
    branches:
      - research/v3-europe48-tree-transfer-20261024
    paths:
      - 'etf-trader-v3 corrected/experiments/europe48_transfer/TRUECORRECTED_START.txt'
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.:vendor/etf_trader_v2/src:etf-trader-v3 corrected/src'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  yearly:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        year: [2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'numba==0.65.1' 'pyarrow==23.0.1' 'matplotlib==3.10.8'
      - name: Recover exact original 48 European ISIN corpus and original external SPY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _US149_ORIG
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _US149_ORIG
          python -m isin_first2026.v2_unrestricted48.prepare --out _EU48_PREP
      - name: Source-corrected V3 features, original annual 2021-26 embargo and hyperparameters, 6 heads
        run: |
          python -u 'etf-trader-v3 corrected/experiments/europe48_transfer/v3_europe48_heads_truecorrected.py' \
            --years '${{ matrix.year }}' --prep _EU48_PREP \
            --us _US149_ORIG \
            --fx europe_only75/f3h1_original_transfer/results/EURUSD_PRIOR_US_CLOSE.csv \
            --out '_EU48_TRUECORRECTED_${{ matrix.year }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-europe48-truecorrected-127leaf-heads-${{ matrix.year }}
          path: _EU48_TRUECORRECTED_${{ matrix.year }}/
          retention-days: 90
