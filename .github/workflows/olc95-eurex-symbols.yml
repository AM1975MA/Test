name: OLC95 Eurex Yahoo symbol coverage check
on:
  push:
    branches:
      - research/olc95-europe-futures
    paths:
      - '.github/workflows/olc95-eurex-symbols.yml'
      - 'research/olc95/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "yfinance>=0.2.65,<2" "pandas>=2.2,<4"
      - name: Audit FESX and FGBL Yahoo candidates
        run: python research/olc95/probe_yahoo_eurex.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olc95-europe-futures-symbol-probe
          path: research/olc95/probe_output/
          if-no-files-found: warn
          retention-days: 7
