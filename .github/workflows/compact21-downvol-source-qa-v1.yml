name: COMPACT21_DOWNVOL_SOURCE_QA_V1
on:
  push:
    branches: [research/compact21-clean-downvol-source-v1]
    paths: [.github/workflows/compact21-downvol-source-qa-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: compact21-downvol-source-qa-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: 'Haswell'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  qa_first_source_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Frozen dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: First cleanup regression tests (NO model fit)
        run: python -m unittest discover -s compact21_downvol_cleanup_v1/tests -v
      - name: Retrieve frozen raw Original149 and original Repeat1 feature panels ONLY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R ${{ github.repository }} -n yfinance-repeatability-v1-raw -D _raw
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-1 -D _ti/r1
          test -f _raw/_repeat1/universe.csv
          test -f _ti/r1/TI_COMPACT.parquet
      - name: Validate source lineage then profile proposed downside semideviation
        run: python -m compact21_downvol_cleanup_v1.audit --raw _raw/_repeat1 --ti _ti/r1 --out _qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downvol-cleanup-repeat1-qa
          retention-days: 90
          path: _qa/
