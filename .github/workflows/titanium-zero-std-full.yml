name: Titanium ZeroStd Full Parity Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      NUMBA_DISABLE_CACHING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Reconstruct verified V5/base engines
        run: |
          mkdir -p upstream/gz upstream/v5
          for f in gz_00.b64 gz_01.b64 gz_02.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-source-faithful-20260803/gzpayload/$f" -o "upstream/gz/$f"; done
          cat upstream/gz/gz_*.b64 | base64 -d | gzip -dc > upstream/base.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  upstream/base.py' | sha256sum -c -
          for f in rv5_00.b64 rv5_01.b64 rv5_02.b64 rv5_04.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/v5/$f"; done
          for f in rv5_03a.b64 rv5_03b.b64 rv5_03c.b64 rv5_03d.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/v5/$f"; done
          cat upstream/v5/rv5_00.b64 upstream/v5/rv5_01.b64 upstream/v5/rv5_02.b64 upstream/v5/rv5_03a.b64 upstream/v5/rv5_03b.b64 upstream/v5/rv5_03c.b64 upstream/v5/rv5_03d.b64 upstream/v5/rv5_04.b64 | base64 -d | gzip -dc > upstream/v5.py
          echo 'ba99f9ce08d96e6b56567d44bf18b5caa7a76ccf13a7d44546e6d1416d79d65a  upstream/v5.py' | sha256sum -c -
          sed -i 's/@njit(cache=True)/@njit(cache=False)/g; s/@njit(parallel=True,cache=True)/@njit(parallel=True,cache=False)/g' upstream/v5.py
          curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-live-package-regeneration-20260804/regeneration/run_downvol_variant.py" -o upstream/run_downvol_variant.py
          python -m py_compile upstream/base.py upstream/v5.py upstream/run_downvol_variant.py
      - name: Recover OHLCV matrices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9053946155/zip -o source.zip
          mkdir source && unzip -q source.zip -d source
          for pass in 1 2 3; do
            while IFS= read -r -d '' z; do d="${z%.zip}_unpacked"; if [ ! -d "$d" ]; then mkdir -p "$d"; unzip -q "$z" -d "$d" || true; fi; done < <(find source -type f -name '*.zip' -print0)
          done
          mkdir -p prices
          for f in OPEN HIGH LOW CLOSE VOLUME; do p=$(find source -type f -name "${f}.parquet" | head -1); test -n "$p"; cp "$p" "prices/${f}.parquet"; done
      - name: Full zero_std run
        run: |
          python upstream/run_downvol_variant.py --v5 upstream/v5.py --base upstream/base.py --data-dir prices --output ZERO_STD_FULL --mode zero_std | tee ZERO_STD_FULL_LOG.txt
      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json
          p=Path('ZERO_STD_FULL')
          if (p/'BASKET_RESULTS.csv').exists():
              b=pd.read_csv(p/'BASKET_RESULTS.csv')
              g=pd.read_csv(p/'GLOBAL_SCORECARD.csv')
              out={}
              for s in ['BASE','DIRECT','ROUTER']:
                  q=b[b.strategy==s]
                  out[s]={'mean_cagr':float(q.cagr.mean()),'median_cagr':float(q.cagr.median()),'p05':float(q.cagr.quantile(.05)),'p95':float(q.cagr.quantile(.95)),'mean_maxdd':float(q.maxdd.mean()),'median_maxdd':float(q.maxdd.median()),'mean_sharpe':float(q.sharpe.mean())}
              out['global']=g.to_dict('records')
              if (p/'KNOWN_SIGNAL_CHECK.json').exists(): out['checkpoint']=json.loads((p/'KNOWN_SIGNAL_CHECK.json').read_text())
              Path('ZERO_STD_FULL_SUMMARY.json').write_text(json.dumps(out,indent=2))
              print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_ZERO_STD_FULL
          path: |
            ZERO_STD_FULL/
            ZERO_STD_FULL_LOG.txt
            ZERO_STD_FULL_SUMMARY.json
          retention-days: 7
