name: V3 EU48 2022 model capacity root cause diagnostic
on:
  push:
    branches:
      - research/v3-europe48-tree-transfer-20261024
    paths:
      - 'etf-trader-v3 corrected/experiments/europe48_transfer/CAPACITY_START.txt'
permissions:
  contents: read
  actions: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONPATH: .:vendor/etf_trader_v2/src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'numba==0.65.1' 'pyarrow==23.0.1' 'matplotlib==3.10.8'
      - name: Recover original 48 ISIN universe and 2022 frozen 127-leaf OOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _US149_ORIG _V3_2022
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _US149_ORIG
          gh run download 40086216896 -R AM1975MA/Test -n v3-europe48-127leaf-heads-2022 -D _V3_2022
          python -m isin_first2026.v2_unrestricted48.prepare --out _EU48_PREP
          test -s _V3_2022/EU48_V3_FIRSTSTAGE_SCORES.csv
      - name: Compare actual 360-round tree leaves and 2022 train-vs-OOS rank quality
        run: |
          python -u 'etf-trader-v3 corrected/experiments/europe48_transfer/audit_eu48_capacity2022.py' \
            --prep _EU48_PREP --us _US149_ORIG \
            --fx europe_only75/f3h1_original_transfer/results/EURUSD_PRIOR_US_CLOSE.csv \
            --reference127 _V3_2022 --out _DIAG_EU48_2022
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-europe48-source-capacity-2022-audit
          path: _DIAG_EU48_2022/
          retention-days: 90
