name: BUILD_2016_WARMUP_ISIN_UNIQUE_EUROPE_EQUITY_SECTORS_AND_BONDS
on:
  push:
    branches:
      - research/europe-isin-download-backtest-ready-20261019
    paths:
      - '.github/workflows/europe-isin-warm-sector-universe.yml'
      - 'isin_first2026/full_eu_2017/build_universe.py'
      - 'isin_first2026/full_eu_2017/PREREGISTERED.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  standalone-sectorized-isin-fund-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build pinned 2017 warm dataset using stored actual adjusted vendor prices
        run: |
          python -m pip install 'pandas==2.2.3' 'numpy==2.3.5'
          python -m py_compile isin_first2026/full_eu_2017/build_universe.py
          python -m isin_first2026.full_eu_2017.build_universe --out _EU_ISIN_WARM
      - name: Check pre-start 2016 history, unique ISIN, 11 equity sectors, no global credit or 2024 fund history in strict cohort
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,pandas as pd
          p=pathlib.Path("_EU_ISIN_WARM")
          d=json.loads((p/"RESULT.json").read_text())
          x=pd.read_csv(p/"STRICT_EUROPE_2017_WARM_2016_UNIQUE_ISIN.csv")
          assert d["original60_ISIN_distinct"]==44 and d["original60_2017_252day_warmup"]==60
          assert x["isin"].is_unique
          assert len(x)>40
          assert x.sufficient_252_warmup.astype(bool).all()
          assert (x.underlying_scope=="STRICT_EUROPE").all()
          assert (~x.known_2018_current_class_quarantine.astype(bool)).all()
          assert x.decision.isin(["A","B"]).all()
          assert d["selected_strict_sector_count"]==11
          assert d["backtest_not_executed"]
          assert "IE00B3F81R35" not in set(x["isin"])
          assert "IE00B66F4759" not in set(x["isin"])
          assert "IE00B4L60045" not in set(x["isin"])
          assert set(pd.read_csv(p/"WIDE_DAILY_OPEN_2016_2026.csv").columns[1:]) == set(x["isin"])
          for line in (p/"SHA256_MANIFEST.txt").read_text().splitlines():
             sha,name=line.split("  ",1)
             assert hashlib.sha256((p/name).read_bytes()).hexdigest()==sha
          print("ISIN_UNIQUE_EUROPE_2016_WARM_RESULTS",json.dumps(d),flush=True)
          PY
      - name: Archive final strict 2017-European sector and duration ISIN vendor panel to Test research branch
        run: |
          mkdir -p isin_first2026/full_eu_2017/results
          cp -a _EU_ISIN_WARM/. isin_first2026/full_eu_2017/results/
          git config user.name "EUROPE-ISIN-UNIVERSE-QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isin_first2026/full_eu_2017/results/
          git commit -m "Archive strict Europe 2016 warmup, no duplicate ISIN sector/government ETF panel with quality and separate euro mixed credit"
          git pull --rebase origin research/europe-isin-download-backtest-ready-20261019
          git push origin HEAD:refs/heads/research/europe-isin-download-backtest-ready-20261019
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Europe-2016-2026-ISIN-unique-11-sector-government-OHLCV
          retention-days: 90
          path: _EU_ISIN_WARM/
