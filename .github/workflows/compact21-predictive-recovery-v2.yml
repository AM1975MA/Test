name: COMPACT21_PREDICTIVE_V2_RECOVERY
on:
  push:
    branches: [research/compact21-predictive-v2]
    paths: [.github/workflows/compact21-predictive-recovery-v2.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: 'Haswell'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
  ETF_TRADER_XGB_WORKERS: '1'
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Corrected integrity and predictive tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s compact21_predictive_v2/tests -v 2>&1 | tee RECOVERY_VALIDATION.txt
      - name: Hardware-only dispatch evidence
        run: python -m compact21_predictive_v2.audit_runtime --out _summary/RUNTIME_AUDIT.json
      - name: Immutable original financial run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37229180477 -R ${{ github.repository }} --pattern 'predictive-*' -D _results
      - name: Independent original-vector reconstruction
        run: python -m compact21_predictive_v2.summarize --inputs _results --out _summary/PREDICTIVE_SUMMARY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictive-summary-recovered
          retention-days: 90
          path: |
            _summary/
            RECOVERY_VALIDATION.txt
