name: V3 L02.4 Tail45 logistic class-weight-only experiment
on:
  push:
    branches: [research-v3-next-layer-gates-20261021]
    paths:
      - '.github/workflows/v3-l02-classweight.yml'
      - 'etf-trader-v3 corrected/experiments/l02_classweight/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fit:
    name: Tail45 balanced vs unweighted ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: years_2018_2020, years: '2018,2019,2020'}
          - {shard: years_2021_2023, years: '2021,2022,2023'}
          - {shard: years_2024_2026, years: '2024,2025,2026'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - name: Exact original frozen source and independent balanced45 OOS scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/v3_l02_reference
          gh run download 39482809691 --repo AM1975MA/Test \
            --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          gh run download 39655513813 --repo AM1975MA/Test \
            --name v3-l02-tail-event-results --dir runs/v3_l02_reference
          python regeneration/certify_etf_trader_raw.py
          test -s runs/v3_l02_reference/OOS_SCORES.csv
      - name: Annual logistic fit with only class weight changed to None
        run: |
          python 'etf-trader-v3 corrected/experiments/l02_classweight/evaluate.py' \
            --years '${{ matrix.years }}' --raw etf_trader_raw \
            --control runs/v3_l02_reference \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out 'runs/v3_l02_weight_shards/${{ matrix.shard }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l02-unbalanced-${{ matrix.shard }}
          path: runs/v3_l02_weight_shards/
          if-no-files-found: warn
          retention-days: 90
  complete:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: v3-l02-unbalanced-years_*
          merge-multiple: true
          path: runs/v3_l02_weight_shards/
      - run: |
          python 'etf-trader-v3 corrected/experiments/l02_classweight/aggregate.py' \
            --root runs/v3_l02_weight_shards --out runs/v3_l02_classweight_complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l02-unbalanced-classweight-results
          path: runs/v3_l02_classweight_complete/
          if-no-files-found: warn
          retention-days: 90
