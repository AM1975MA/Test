name: Titanium Checkpoint 2026 Probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Get exact Compact module
        run: curl -fsSL https://raw.githubusercontent.com/AM1975MA/Test/titanium-base-parity-probe-20260810/forensics/base_parity_probe.py -o forensics/base_parity_probe_upstream.py
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o canonical.zip
          mkdir outer && unzip -q canonical.zip -d outer
          inner=$(find outer -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' -print -quit)
          mkdir package && unzip -q "$inner" -d package
          pkg=$(find package -type d -name METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE -print -quit)
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - run: python forensics/checkpoint_2026_probe.py --package "$PKG" --compact-probe forensics/base_parity_probe_upstream.py --broad-probe forensics/broad_tail_parity_probe.py --output CHECKPOINT_2026
      - run: zip -r TITANIUM_CHECKPOINT_2026.zip CHECKPOINT_2026
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_CHECKPOINT_2026
          path: TITANIUM_CHECKPOINT_2026.zip
          retention-days: 7
