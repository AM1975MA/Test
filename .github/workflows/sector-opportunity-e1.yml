name: Sector opportunity E1 - historical price probe
on:
  push:
    branches:
      - research/sector-opportunity-e1-20261103
    paths:
      - research/sector_opportunity_e1_20261103/**
      - .github/workflows/sector-opportunity-e1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-price-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-price research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "yfinance>=0.2.60,<1"
      - name: E1 source-frozen price and oracle test
        run: |
          python research/sector_opportunity_e1_20261103/run_candidate_oracle.py
      - name: Archive QA and any matched results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-opportunity-e1-research
          path: research/sector_opportunity_e1_20261103/results/
          retention-days: 30
