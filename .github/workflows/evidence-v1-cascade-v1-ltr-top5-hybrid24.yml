name: Evidence V1 cascade v1 LTR Top5 Hybrid24

on:
  push:
    branches: [ research/evidence-v1 ]
    paths:
      - '.github/workflows/evidence-v1-cascade-v1-ltr-top5-hybrid24.yml'
      - 'evidence_v1/protocols/CASCADE_V1_LTR_TOP5_HYBRID24_PREREG.md'
      - 'evidence_v1/protocols/CASCADE_V1_RUN_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cascade-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Fail-closed preregistration and frozen-state gate
        run: |
          set -euo pipefail
          test "$(git hash-object evidence_v1/src/cascade_v1_ltr_top5_hybrid24.py)" = "aafff4f99552b23fc5e547690ee21b093625f741"
          test "$(git hash-object evidence_v1/protocols/CASCADE_V1_LTR_TOP5_HYBRID24_PREREG.md)" = "cf081f2389914ff5f17b02d7fbcf5d2d7b966992"
          test "$(git hash-object evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py)" = "34cc133d4d44bb06cc21363b1444865e2d8ec5c1"
          test "$(git hash-object evidence_v1/checkpoints/retriever_ltr_v1/CHECKPOINT_MANIFEST.json)" = "e51a8651f6696a0081acb09e3ed230e7e35fd79c"
          test "$(git hash-object evidence_v1/checkpoints/retriever_ltr_v1/TOP5.csv)" = "2e2463fd7a04370f637d5165e6f9a5f5ff09f8a4"
          test "$(git hash-object evidence_v1/checkpoints/retriever_ltr_v1/OOS_PREDICTIONS.csv)" = "1745a6d12b6957bc629998c7ac3417550ac9bceb"
          test "$(git hash-object evidence_v1/checkpoints/hybrid24_oos_v1/CHECKPOINT_MANIFEST.json)" = "7c05170b816337a863b5f02f083a930b45fda8f2"
          test "$(git hash-object evidence_v1/checkpoints/hybrid24_oos_v1/OOS_SCORES.csv)" = "15d346c6723c85e9d7975254b07e20e4fbd2fe53"
          echo "1cccbd18c7c05128fd9a22e2f71c51efa38a11c1d9f4c6a79c3022ee56ff85df  evidence_v1/checkpoints/retriever_ltr_v1/TOP5.csv" | sha256sum -c -
          echo "3f9e054fdc0716161cec185ad5a32a62671ad3032070b9ca24ceed655011abd6  evidence_v1/checkpoints/retriever_ltr_v1/OOS_PREDICTIONS.csv" | sha256sum -c -
          echo "661feb2b9b80997e78e51b4701a2f4d9501b1ac390ceb331d59bec837b0db4f7  evidence_v1/checkpoints/hybrid24_oos_v1/OOS_SCORES.csv" | sha256sum -c -
          echo "1efba2bc213ba26b042a9e77630fe26664343654629e658f43d314d068ba9e71  evidence_v1/DATA_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "cc4d315da68ec42275a7a74f05446ac6cbb484c3bd92a7861cd76805c5a94782  evidence_v1/SOURCE_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "01305fe62203c7b7895d95836267c4288f86d2c5a763ce7070c9c3d3d9f807ae  evidence_v1/requirements.lock.txt" | sha256sum -c -
          (cd evidence_v1/data && sha256sum -c ../DATA_MANIFEST_SHA256.txt)
          (cd evidence_v1/source && sha256sum -c ../SOURCE_MANIFEST_SHA256.txt)
          python -m py_compile evidence_v1/src/cascade_v1_ltr_top5_hybrid24.py

      - name: Install locked numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r evidence_v1/requirements.lock.txt

      - name: Rebuild frozen Original149 reference panel
        env:
          PYTHONPATH: ${{ github.workspace }}/evidence_v1/source/baseline/etf_trader_v2/src
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          rm -rf _evidence_v1_cascade1
          mkdir -p _evidence_v1_cascade1/panel149 _evidence_v1_cascade1/result
          python evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py \
            --data evidence_v1/data/original149 \
            --cluster-data evidence_v1/data/original149 \
            --output _evidence_v1_cascade1/panel149

      - name: Run single preregistered LTR Top5 to Hybrid24 cascade
        run: |
          python evidence_v1/src/cascade_v1_ltr_top5_hybrid24.py \
            --panel _evidence_v1_cascade1/panel149/RAW_FEATURE_PANEL.pkl \
            --ltr-checkpoint evidence_v1/checkpoints/retriever_ltr_v1 \
            --hybrid24-checkpoint evidence_v1/checkpoints/hybrid24_oos_v1 \
            --out _evidence_v1_cascade1/result

      - name: Build provenance and final manifest
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          import numpy,pandas
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          r=Path('_evidence_v1_cascade1/result')
          p={
            'line':'Evidence V1','test':'cascade_v1_ltr_top5_hybrid24',
            'git_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'evaluator_git_blob':subprocess.check_output(['git','hash-object','evidence_v1/src/cascade_v1_ltr_top5_hybrid24.py'],text=True).strip(),
            'preregistration_git_blob':subprocess.check_output(['git','hash-object','evidence_v1/protocols/CASCADE_V1_LTR_TOP5_HYBRID24_PREREG.md'],text=True).strip(),
            'data_manifest_sha256':h('evidence_v1/DATA_MANIFEST_SHA256.txt'),
            'source_manifest_sha256':h('evidence_v1/SOURCE_MANIFEST_SHA256.txt'),
            'requirements_sha256':h('evidence_v1/requirements.lock.txt'),
            'retriever_checkpoint_manifest_sha256':h('evidence_v1/checkpoints/retriever_ltr_v1/CHECKPOINT_MANIFEST.json'),
            'retriever_top5_sha256':h('evidence_v1/checkpoints/retriever_ltr_v1/TOP5.csv'),
            'retriever_oos_predictions_sha256':h('evidence_v1/checkpoints/retriever_ltr_v1/OOS_PREDICTIONS.csv'),
            'hybrid24_checkpoint_manifest_sha256':h('evidence_v1/checkpoints/hybrid24_oos_v1/CHECKPOINT_MANIFEST.json'),
            'hybrid24_oos_scores_sha256':h('evidence_v1/checkpoints/hybrid24_oos_v1/OOS_SCORES.csv'),
            'panel_manifest_sha256':h('_evidence_v1_cascade1/panel149/RAW_FEATURE_PANEL_MANIFEST.json'),
            'holdout70_used':False,
            'models_refit':False,
            'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__}
          (r/'PROVENANCE.json').write_text(json.dumps(p,indent=2)+'\n')
          files=sorted(x.name for x in r.iterdir() if x.is_file() and x.name!='RESULT_MANIFEST.json')
          (r/'RESULT_MANIFEST.json').write_text(json.dumps({'test':'cascade_v1_ltr_top5_hybrid24','files_sha256':{f:h(r/f) for f in files}},indent=2)+'\n')
          print(json.dumps(p,indent=2))
          PY
          cat _evidence_v1_cascade1/result/SUMMARY.json

      - name: Persist cascade v1 evidence in branch
        run: |
          set -euo pipefail
          test ! -e evidence_v1/results/cascade_v1_ltr_top5_hybrid24
          mkdir -p evidence_v1/results/cascade_v1_ltr_top5_hybrid24
          cp _evidence_v1_cascade1/result/* evidence_v1/results/cascade_v1_ltr_top5_hybrid24/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_v1/results/cascade_v1_ltr_top5_hybrid24
          git diff --cached --stat
          git commit -m "Record Evidence V1 LTR Top5 Hybrid24 cascade v1"
          git pull --rebase origin research/evidence-v1
          git push origin HEAD:research/evidence-v1

      - name: Upload cascade v1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v1-cascade-v1-ltr-top5-hybrid24
          retention-days: 90
          if-no-files-found: error
          path: evidence_v1/results/cascade_v1_ltr_top5_hybrid24/*
