name: ORIGINAL149_TCN_RISK_RELATIVE_5D_FULL
on:
  push:
    branches: [research/original149-tcn-riskrelative-20261020]
    paths:
      - '.github/workflows/tensor149-riskrelative-full.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: '${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [RAW_EXCESS_DIST, VOL_EXCESS_DIST, BETA_VOL_RESID_DIST]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Frozen TCN numerical requirements
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'pyarrow==23.0.1' 'matplotlib==3.10.8' 'xgboost==3.1.3'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests of causal features, groupwise permutation and gradient
        run: |
          python -m py_compile tensor149_tcn5d/*.py
          python -m unittest -v tensor149_tcn5d.test_contract tensor149_tcn5d.test_riskrelative
      - name: Complete matched OOS two-year test on Original149
        run: |
          set -o pipefail
          python -m tensor149_tcn5d.risk_run --variant ${{ matrix.variant }} --years 2017,2018,2019,2020,2021,2022,2023,2024,2025,2026 --epochs 5 --out "_results/${{ matrix.variant }}" | tee "_log_${{ matrix.variant }}.txt"
      - name: Preserve model checkpoints all per-ETF predictions and full NAV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'original149-riskrelative-full-${{ matrix.variant }}'
          retention-days: 90
          path: |
            _results/
            _log_*.txt
