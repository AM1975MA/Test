name: V2_ALPHA_EQUITY_ATTRIBUTION_REPORT_V1
on:
  push:
    branches: [research/v2-alpha-cagr-attribution-v1]
    paths: [.github/workflows/v2-alpha-equity-attribution-report-v1.yml, data_quality_audit_v1/v2_equity_attribution.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
      - name: Restore six exact executed portfolios from successful replay jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for alpha in 0.05 1.0; do
            for repeat in 1 2 3; do
              gh run download 38130407167 -R ${{ github.repository }} -n "equity-alpha-${alpha}-repeat-${repeat}" -D "_frozen/equity-alpha-${alpha}-repeat-${repeat}"
              test "$(find "_frozen/equity-alpha-${alpha}-repeat-${repeat}" -name FULL_UNIVERSE_PATH.npz | wc -l)" -eq 1
            done
          done
      - name: Partition actual portfolio log terminal capital gaps by leader disagreement
        run: python data_quality_audit_v1/v2_equity_attribution.py --root _frozen --out _attribution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-six-frozen-portfolios-cagr-attribution
          path: _attribution/
          retention-days: 90
