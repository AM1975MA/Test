name: Evidence V4 magnitude direction v1

on:
  push:
    branches: [ research/evidence-v4 ]
    paths:
      - 'evidence_v4/protocols/MAGNITUDE_DIRECTION_V1_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  magnitude-direction-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence-v4
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Fail-closed preregistration and corrected frozen-data gate
        run: |
          set -euo pipefail
          test "$(git hash-object evidence_v4/src/magnitude_direction_v1.py)" = "b7a517b247e62de8866dfe35592a7ba73643b504"
          test "$(git hash-object evidence_v4/protocols/MAGNITUDE_DIRECTION_V1_PREREG.md)" = "8cdcc887f6707352645f90bff1a95519146bd1d7"
          test "$(git hash-object evidence_v4/protocols/DEV60_TO_DEV72_ENGINEERING_FIX.md)" = "edc3dfced2e64ecb59a1e7edaf59c00a49a11be5"
          test "$(git hash-object evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py)" = "34cc133d4d44bb06cc21363b1444865e2d8ec5c1"
          test "$(git hash-object evidence_v1/source/baseline/etf_trader_v2/src/etf_trader/ma3/producer.py)" = "e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592"
          echo "8a50de08efd056e2637b6e043ff540d19d882ab34e53c16c930eea43a642a4dd  evidence_v4/data/dev72v4/manifest.json" | sha256sum -c -
          echo "ae19ffdd0f4e89c677734a640ca1814c3651489caddc61aef089158d3ccb6a62  evidence_v4/data/dev72v4/universe.csv" | sha256sum -c -
          echo "c83494032c4a0675a1cf5769dd01cefa5025f406606e3bb0c4a2779f1a9e642a  evidence_v4/data/dev60/manifest.json" | sha256sum -c -
          echo "01305fe62203c7b7895d95836267c4288f86d2c5a763ce7070c9c3d3d9f807ae  evidence_v1/requirements.lock.txt" | sha256sum -c -
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence_v4/data/dev72v4')
          m=json.loads((root/'manifest.json').read_text())
          assert m['selected_count']==72
          assert m['per_cluster']==12
          assert m['dev60_prefix_preserved'] is True
          assert m['burned_reference_counts']['union']==400
          assert m['intersection_with_burned_union']==[]
          assert m['performance_used_for_selection'] is False
          assert m['invalid_preperformance_run']=='37075621569'
          for ticker,want in m['file_sha256'].items():
              p=root/'raw_ticker_csv'/f'{ticker}.csv'
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'raw hash mismatch {ticker}: {got} != {want}')
          print('Corrected Dev72V4 raw hashes and Dev60-prefix provenance: OK')
          PY
          python -m py_compile evidence_v4/src/magnitude_direction_v1.py
          test ! -e evidence_v4/results/magnitude_direction_v1

      - name: Install locked numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r evidence_v1/requirements.lock.txt

      - name: Stage corrected frozen Dev72V4 in canonical raw format
        run: |
          rm -rf _evidence_v4_magdir
          mkdir -p _evidence_v4_magdir/data _evidence_v4_magdir/panel _evidence_v4_magdir/result
          cp evidence_v4/data/dev72v4/universe.csv _evidence_v4_magdir/data/universe.csv
          cp evidence_v4/data/dev72v4/raw_ticker_csv/*.csv _evidence_v4_magdir/data/

      - name: Rebuild corrected Dev72V4 canonical MA3 source-only panel
        env:
          PYTHONPATH: ${{ github.workspace }}/evidence_v1/source/baseline/etf_trader_v2/src
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          python evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py \
            --data _evidence_v4_magdir/data \
            --cluster-data _evidence_v4_magdir/data \
            --output _evidence_v4_magdir/panel

      - name: Run preregistered magnitude plus direction architecture
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          python evidence_v4/src/magnitude_direction_v1.py \
            --panel _evidence_v4_magdir/panel/RAW_FEATURE_PANEL.pkl \
            --frozen-source evidence_v1/source/baseline/etf_trader_v2 \
            --out _evidence_v4_magdir/result

      - name: Build provenance and final manifest
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          import numpy,pandas,sklearn,xgboost
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          r=Path('_evidence_v4_magdir/result')
          p={
            'line':'Evidence V4','test':'magnitude_direction_v1',
            'git_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'evaluator_git_blob':subprocess.check_output(['git','hash-object','evidence_v4/src/magnitude_direction_v1.py'],text=True).strip(),
            'preregistration_git_blob':subprocess.check_output(['git','hash-object','evidence_v4/protocols/MAGNITUDE_DIRECTION_V1_PREREG.md'],text=True).strip(),
            'engineering_fix_git_blob':subprocess.check_output(['git','hash-object','evidence_v4/protocols/DEV60_TO_DEV72_ENGINEERING_FIX.md'],text=True).strip(),
            'invalid_preperformance_run':'37075621569',
            'dev72v4_manifest_sha256':h('evidence_v4/data/dev72v4/manifest.json'),
            'dev72v4_universe_sha256':h('evidence_v4/data/dev72v4/universe.csv'),
            'dev60_manifest_sha256':h('evidence_v4/data/dev60/manifest.json'),
            'panel_manifest_sha256':h('_evidence_v4_magdir/panel/RAW_FEATURE_PANEL_MANIFEST.json'),
            'builder_git_blob':subprocess.check_output(['git','hash-object','evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py'],text=True).strip(),
            'producer_git_blob':subprocess.check_output(['git','hash-object','evidence_v1/source/baseline/etf_trader_v2/src/etf_trader/ma3/producer.py'],text=True).strip(),
            'requirements_sha256':h('evidence_v1/requirements.lock.txt'),
            'network_used_during_model_test':False,
            'original149_used_for_fit':False,'holdout70_used':False,
            'eu110_eu120_used_for_fit':False,'dev72_v3_used_for_fit':False,
            'dev60_prefix_preserved_in_corrected_universe':True,
            'architecture_preregistered_before_dev60_freeze_completed':True,
            'engineering_universe_size_fix_before_any_performance_observed':True,
            'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,
            'scikit_learn':sklearn.__version__,'xgboost':xgboost.__version__}
          (r/'PROVENANCE.json').write_text(json.dumps(p,indent=2)+'\n')
          files=sorted(x.name for x in r.iterdir() if x.is_file() and x.name!='RESULT_MANIFEST.json')
          (r/'RESULT_MANIFEST.json').write_text(json.dumps({'test':'magnitude_direction_v1','files_sha256':{f:h(r/f) for f in files}},indent=2)+'\n')
          print(json.dumps(p,indent=2))
          print((r/'SUMMARY.json').read_text())
          PY

      - name: Persist Evidence V4 result in branch
        run: |
          set -euo pipefail
          mkdir -p evidence_v4/results/magnitude_direction_v1
          cp _evidence_v4_magdir/result/* evidence_v4/results/magnitude_direction_v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_v4/results/magnitude_direction_v1
          git commit -m "Record Evidence V4 magnitude-direction v1 result"
          git pull --rebase origin research/evidence-v4
          git push origin HEAD:research/evidence-v4

      - name: Upload Evidence V4 result
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v4-magnitude-direction-v1
          retention-days: 90
          if-no-files-found: error
          path: evidence_v4/results/magnitude_direction_v1/
