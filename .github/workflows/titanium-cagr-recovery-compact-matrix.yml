name: Titanium CAGR Recovery Compact Matrix
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  compact-parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: exit_date_21
            filter30: 1
            tag: exit21_filter
          - label: exit_date_21
            filter30: 0
            tag: exit21_nofilter
          - label: exit_date
            filter30: 1
            tag: exitfull_filter
          - label: exit_date
            filter30: 0
            tag: exitfull_nofilter
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen stack
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Download canonical Aug6 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o canonical.zip
          mkdir artifact && unzip -q canonical.zip -d artifact
          inner=$(find artifact -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' -print -quit)
          test -n "$inner"
          mkdir pkg && unzip -q "$inner" -d pkg
          find pkg -name SCORECARD_SUMMARY.json -print
      - name: Run parity candidate
        run: |
          root=$(dirname $(dirname $(find pkg -name SCORECARD_SUMMARY.json -print -quit)))
          python regeneration/compact_training_matrix_remote.py --package-root "$root" --label '${{ matrix.label }}' --filter30 '${{ matrix.filter30 }}' --trees 120 --output 'RESULT_${{ matrix.tag }}'
      - uses: actions/upload-artifact@v4
        with:
          name: COMPACT_PARITY_${{ matrix.tag }}
          path: RESULT_${{ matrix.tag }}/
          retention-days: 7
