name: Titanium Compact Parameter Archaeology
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  archaeology:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {tag: base, trees: 360, depth: 4, lr: 0.035, mcw: 8, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: d3, trees: 360, depth: 3, lr: 0.035, mcw: 8, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: d5, trees: 360, depth: 5, lr: 0.035, mcw: 8, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: d6, trees: 360, depth: 6, lr: 0.035, mcw: 8, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: lr025_t480, trees: 480, depth: 4, lr: 0.025, mcw: 8, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: lr050_t240, trees: 240, depth: 4, lr: 0.050, mcw: 8, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: lr040_t300, trees: 300, depth: 4, lr: 0.040, mcw: 8, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: lr030_t420, trees: 420, depth: 4, lr: 0.030, mcw: 8, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: mcw4, trees: 360, depth: 4, lr: 0.035, mcw: 4, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: mcw12, trees: 360, depth: 4, lr: 0.035, mcw: 12, lam: 8, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: lam4, trees: 360, depth: 4, lr: 0.035, mcw: 8, lam: 4, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: lam12, trees: 360, depth: 4, lr: 0.035, mcw: 8, lam: 12, alpha: 0.1, sub: 0.85, col: 0.8}
          - {tag: alpha0, trees: 360, depth: 4, lr: 0.035, mcw: 8, lam: 8, alpha: 0.0, sub: 0.85, col: 0.8}
          - {tag: alpha03, trees: 360, depth: 4, lr: 0.035, mcw: 8, lam: 8, alpha: 0.3, sub: 0.85, col: 0.8}
          - {tag: sample100, trees: 360, depth: 4, lr: 0.035, mcw: 8, lam: 8, alpha: 0.1, sub: 1.0, col: 1.0}
          - {tag: sample070, trees: 360, depth: 4, lr: 0.035, mcw: 8, lam: 8, alpha: 0.1, sub: 0.7, col: 0.7}
          - {tag: d3_loose, trees: 300, depth: 3, lr: 0.040, mcw: 4, lam: 4, alpha: 0.0, sub: 0.9, col: 0.9}
          - {tag: d5_loose, trees: 300, depth: 5, lr: 0.040, mcw: 4, lam: 4, alpha: 0.0, sub: 0.9, col: 0.9}
          - {tag: d3_tight, trees: 480, depth: 3, lr: 0.025, mcw: 12, lam: 12, alpha: 0.3, sub: 0.8, col: 0.8}
          - {tag: d5_tight, trees: 480, depth: 5, lr: 0.025, mcw: 12, lam: 12, alpha: 0.3, sub: 0.8, col: 0.8}
          - {tag: sample095, trees: 360, depth: 4, lr: 0.035, mcw: 8, lam: 8, alpha: 0.1, sub: 0.95, col: 0.9}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen stack
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Download canonical package
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o canonical.zip
          mkdir artifact && unzip -q canonical.zip -d artifact
          inner=$(find artifact -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' -print -quit); test -n "$inner"
          mkdir pkg && unzip -q "$inner" -d pkg
      - name: Run archaeology candidate
        run: |
          root=$(dirname $(dirname $(find pkg -name SCORECARD_SUMMARY.json -print -quit)))
          python regeneration/compact_param_archaeology.py --package-root "$root" --tag '${{ matrix.tag }}' --trees '${{ matrix.trees }}' --depth '${{ matrix.depth }}' --lr '${{ matrix.lr }}' --mcw '${{ matrix.mcw }}' --lam '${{ matrix.lam }}' --alpha '${{ matrix.alpha }}' --subsample '${{ matrix.sub }}' --colsample '${{ matrix.col }}' --output 'ARCH_${{ matrix.tag }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ARCH_${{ matrix.tag }}
          path: ARCH_${{ matrix.tag }}/
          retention-days: 7
