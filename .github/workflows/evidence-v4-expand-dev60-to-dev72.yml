name: Evidence V4 expand Dev60 to Dev72

on:
  push:
    branches: [ research/evidence-v4 ]
    paths:
      - 'evidence_v4/protocols/DEV60_TO_DEV72_ENGINEERING_FIX_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-dev72:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence-v4
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Fail-closed engineering-fix gate
        run: |
          set -euo pipefail
          test "$(git hash-object evidence_v4/src/expand_dev60_to_dev72v4.py)" = "40627bcc9ec8ce778f242cec27991cdbf3738e0a"
          test "$(git hash-object evidence_v4/protocols/DEV60_TO_DEV72_ENGINEERING_FIX.md)" = "edc3dfced2e64ecb59a1e7edaf59c00a49a11be5"
          test "$(git hash-object evidence_v3/src/freeze_dev72.py)" = "0fc474e657975e11faf56629c3e98114dc09c796"
          echo "c83494032c4a0675a1cf5769dd01cefa5025f406606e3bb0c4a2779f1a9e642a  evidence_v4/data/dev60/manifest.json" | sha256sum -c -
          echo "b2a14c91f5dad67132032f79249bd00a8fd742bf13eaddf6dea712ca93dcde40  evidence_v4/data/dev60/universe.csv" | sha256sum -c -
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence_v4/data/dev60')
          m=json.loads((root/'manifest.json').read_text())
          assert m['selected_count']==60 and m['per_cluster']==10
          assert m['intersection_with_burned_union']==[]
          assert m['performance_used_for_selection'] is False
          for t,w in m['file_sha256'].items():
              got=hashlib.sha256((root/'raw_ticker_csv'/f'{t}.csv').read_bytes()).hexdigest()
              if got != w: raise SystemExit(f'Dev60 raw mismatch {t}')
          print('Frozen Dev60 prefix hashes: OK')
          PY
          python -m py_compile evidence_v4/src/expand_dev60_to_dev72v4.py
          test ! -e evidence_v4/data/dev72v4

      - name: Install pinned expansion environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 yfinance==0.2.66

      - name: Expand frozen Dev60 prefix to Dev72V4
        run: |
          rm -rf _evidence_v4_dev72_fix
          python evidence_v4/src/expand_dev60_to_dev72v4.py \
            --v3-freezer evidence_v3/src/freeze_dev72.py \
            --original149 evidence_v1/data/original149/universe.csv \
            --holdout70 evidence_v1/data/holdout70/universe.csv \
            --eu110 evidence_v3/reference/EU110_TESTED.csv \
            --dev72-v3 evidence_v3/data/dev72/universe.csv \
            --dev60-root evidence_v4/data/dev60 \
            --out _evidence_v4_dev72_fix

      - name: Build provenance
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          import numpy,pandas,yfinance
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          out=Path('_evidence_v4_dev72_fix')
          m=json.loads((out/'manifest.json').read_text())
          assert m['selected_count']==72 and m['per_cluster']==12
          assert m['dev60_prefix_preserved'] is True
          assert m['intersection_with_burned_union']==[]
          assert m['performance_used_for_selection'] is False
          p={
            'line':'Evidence V4','dataset':'Dev72V4','status':'FROZEN_ENGINEERING_FIX_NO_PERFORMANCE',
            'invalid_preperformance_run':'37075621569',
            'git_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'expander_git_blob':subprocess.check_output(['git','hash-object','evidence_v4/src/expand_dev60_to_dev72v4.py'],text=True).strip(),
            'engineering_fix_git_blob':subprocess.check_output(['git','hash-object','evidence_v4/protocols/DEV60_TO_DEV72_ENGINEERING_FIX.md'],text=True).strip(),
            'architecture_prereg_git_blob':subprocess.check_output(['git','hash-object','evidence_v4/protocols/MAGNITUDE_DIRECTION_V1_PREREG.md'],text=True).strip(),
            'architecture_source_git_blob':subprocess.check_output(['git','hash-object','evidence_v4/src/magnitude_direction_v1.py'],text=True).strip(),
            'dev60_manifest_sha256':h('evidence_v4/data/dev60/manifest.json'),
            'manifest_sha256':h(out/'manifest.json'),'universe_sha256':h(out/'universe.csv'),
            'coverage_sha256':h(out/'coverage.csv'),
            'network_used_only_for_12_added_data_series':True,
            'performance_test_executed':False,
            'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,'yfinance':yfinance.__version__}
          (out/'PROVENANCE.json').write_text(json.dumps(p,indent=2)+'\n')
          print(json.dumps(p,indent=2))
          PY

      - name: Persist corrected Dev72V4 in branch
        run: |
          set -euo pipefail
          mkdir -p evidence_v4/data/dev72v4
          cp -r _evidence_v4_dev72_fix/* evidence_v4/data/dev72v4/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_v4/data/dev72v4
          git commit -m "Freeze corrected Evidence V4 Dev72 universe"
          git pull --rebase origin research/evidence-v4
          git push origin HEAD:research/evidence-v4

      - name: Upload corrected Dev72V4
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v4-dev72-engineering-fix
          retention-days: 90
          if-no-files-found: error
          path: evidence_v4/data/dev72v4/
