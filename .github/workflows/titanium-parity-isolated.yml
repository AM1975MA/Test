name: Titanium Immutable Production Runner
on:
  pull_request:
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Fetch and SHA-verify immutable production-aligned source
        run: |
          curl -fsSL https://raw.githubusercontent.com/AM1975MA/Test/28430c0c3487eb7973dc5c6f0d0a569a90d8224c/regeneration/production_aligned_regen.py -o production_aligned_regen.py
          echo '86ac6b7d01ae81ccb931c605b0f8abb71758ce414344facae16df999e32fc572  production_aligned_regen.py' | sha256sum -c -
          python -m py_compile production_aligned_regen.py
      - name: Get canonical ticker-data package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o a.zip
          mkdir a && unzip -q a.zip -d a
          INNER=$(find a -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' | head -1); test -n "$INNER"
          mkdir canonical && unzip -q "$INNER" -d canonical
          ROOT=$(find canonical -type d -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE' | head -1); test -n "$ROOT"
          for f in OPEN HIGH LOW CLOSE VOLUME; do test -f "$ROOT/data/${f}.parquet"; done
      - name: Execute immutable runner 360-tree 500-basket
        run: |
          ROOT=$(find canonical -type d -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE' | head -1)
          python production_aligned_regen.py \
            --base-module "$ROOT/source/titanium_retrained_current_data_audit.py" \
            --v5-module "$ROOT/source/titanium_reconstruction_v6.py" \
            --data-dir "$ROOT/data" \
            --output METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE_REGENERATED \
            --n-estimators 360 \
            --n-baskets 500
      - name: Frozen parity summary
        if: always()
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          p=Path('METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE_REGENERATED')
          if not (p/'BASKET_RESULTS_500.csv').exists(): print('No scorecard'); raise SystemExit(0)
          r=pd.read_csv(p/'BASKET_RESULTS_500.csv'); g=pd.read_csv(p/'GLOBAL_SCORECARD.csv')
          for s in ['BASE','DIRECT','ROUTER']:
              q=r[r.strategy==s]; print(s,'mean CAGR',q.cagr.mean(),'median',q.cagr.median(),'median MaxDD',q.maxdd.median(),'mean Sharpe',q.sharpe.mean())
          print(g.to_string(index=False))
          base=float(r[r.strategy=='BASE'].cagr.mean()); router=float(r[r.strategy=='ROUTER'].cagr.mean())
          print('DELTA BASE vs 21.654064% =', (base-0.21654064)*100,'pp')
          print('DELTA ROUTER vs 22.742810% =', (router-0.22742810)*100,'pp')
          if (p/'KNOWN_SIGNAL_CHECK.json').exists(): print((p/'KNOWN_SIGNAL_CHECK.json').read_text())
          PY
      - name: Archive exact regeneration
        if: always()
        run: |
          cp production_aligned_regen.py METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE_REGENERATED/IMMUTABLE_RUNNER.py 2>/dev/null || true
          zip -r TITANIUM_IMMUTABLE_REGENERATION.zip METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE_REGENERATED || true
          sha256sum TITANIUM_IMMUTABLE_REGENERATION.zip > TITANIUM_IMMUTABLE_REGENERATION_SHA256.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_IMMUTABLE_REGENERATION
          path: |
            TITANIUM_IMMUTABLE_REGENERATION.zip
            TITANIUM_IMMUTABLE_REGENERATION_SHA256.txt
          retention-days: 7
