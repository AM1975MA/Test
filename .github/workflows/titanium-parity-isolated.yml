name: Titanium Parity Isolated
on:
  pull_request:
  workflow_dispatch:
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Get canonical package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o a.zip
          mkdir a && unzip -q a.zip -d a
          INNER=$(find a -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' | head -1); test -n "$INNER"
          mkdir canonical && unzip -q "$INNER" -d canonical
      - name: Patch production semantics
        run: |
          ROOT=$(find canonical -type d -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE' | head -1); test -n "$ROOT"
          python regeneration/production_feature_parity_patch.py --base "$ROOT/source/titanium_retrained_current_data_audit.py" --v6 "$ROOT/source/titanium_reconstruction_v6.py"
          python -m py_compile "$ROOT/source/titanium_retrained_current_data_audit.py" "$ROOT/source/titanium_reconstruction_v6.py"
      - name: Exact 2026 checkpoint
        run: |
          ROOT=$(find canonical -type d -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE' | head -1)
          python regeneration/checkpoint_2026_production_parity.py --base "$ROOT/source/titanium_retrained_current_data_audit.py" --v6 "$ROOT/source/titanium_reconstruction_v6.py" --data-dir "$ROOT/data" --output OUT
      - name: Archive
        if: always()
        run: zip -r TITANIUM_PARITY_ISOLATED.zip OUT || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_PARITY_ISOLATED
          path: TITANIUM_PARITY_ISOLATED.zip
          retention-days: 7
