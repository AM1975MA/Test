name: V3 definitive 23-family nested meta-tree skill trial
on:
  push:
    branches: [research-v3-meta-tree-ensemble-20261024]
    paths:
      - 'etf-trader-v3 corrected/experiments/l00_rank_reg_fusion/NESTED_FINAL_START.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3'
      - name: Load certified unchanged baseline and original model OOS predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/v3_algo_base runs/v3_algo_incumbent runs/v3_algo_new
          gh run download 40031144599 -R AM1975MA/Test -n v3-meta-tree-results -D runs/v3_algo_base
          gh run download 40032282233 -R AM1975MA/Test -n v3-nested-meta-tree-validation -D runs/v3_algo_incumbent
          for family in DT RF ET HGB XGB LGB CAT XGB_RET LGB_RET; do
            mkdir -p "runs/v3_algo_new/$family"
            gh run download 40037256111 -R AM1975MA/Test -n "v3-meta-tree-algorithm-$family" -D "runs/v3_algo_new/$family"
          done
          for family in DT_PAYOFF DT_LOSS RF_PAYOFF XGB_PAYOFF CAT_PAYOFF LGB_PAYOFF; do
            mkdir -p "runs/v3_algo_new/$family"
            gh run download 40037653615 -R AM1975MA/Test -n "v3-meta-payoff-tree-$family" -D "runs/v3_algo_new/$family"
          done
          for family in DT_EVENT RF_EVENT XGB_EVENT CAT_EVENT; do
            mkdir -p "runs/v3_algo_new/$family"
            gh run download 40037938627 -R AM1975MA/Test -n "v3-meta-event-tree-$family" -D "runs/v3_algo_new/$family"
          done
          for family in DT_CONTEXT RF_CONTEXT XGB_CONTEXT CAT_CONTEXT; do
            mkdir -p "runs/v3_algo_new/$family"
            gh run download 40038182585 -R AM1975MA/Test -n "v3-meta-context-tree-$family" -D "runs/v3_algo_new/$family"
          done
      - name: Verify original reference policy exact parity and 113 challengers
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -u 'etf-trader-v3 corrected/experiments/l00_rank_reg_fusion/nested_full_23family_selector.py' \
            --base runs/v3_algo_base --incumbent runs/v3_algo_incumbent \
            --new runs/v3_algo_new --out runs/v3_algo_definitive_nested
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-meta-definitive-23-family-nested
          path: runs/v3_algo_definitive_nested/
          retention-days: 90
