name: ORIGINAL149_DAILY_R1R2_PILOT_ABLATION_6WAY
on:
  push:
    branches: [research/original149-r1r2-daily-20261020]
    paths:
      - '.github/workflows/tensor149-daily-r1r2-pilot.yml'
      - 'tensor149_tcn5d/relational_features.py'
  workflow_dispatch:
concurrency:
  group: "original149-daily-r1r2-pilot-${{ github.ref }}"
  cancel-in-progress: false
permissions: {contents: read}
env:
  PYTHONPATH: '${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [B_DAILY_BASE, C_DAILY_R1, D_DAILY_R1R2, E_XGB_BASE, E_XGB_R1R2, E_CAT_R1R2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Frozen numerical stack with CatBoost ranker
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'pyarrow==23.0.1' 'xgboost==3.1.3' 'catboost==1.2.8'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Static compilation, canonical source contract and causality test
        run: |
          python -m py_compile tensor149_tcn5d/relational_features.py tensor149_tcn5d/daily_ablation.py tensor149_tcn5d/test_daily_ablation.py
          python -m unittest -v tensor149_tcn5d.test_contract tensor149_tcn5d.test_daily_ablation
      - name: Exactly fixed PILOT daily-train weekly-test 5-session OOS
        run: |
          set -o pipefail
          python -m tensor149_tcn5d.daily_ablation --variant ${{ matrix.variant }} --years 2024,2025 --epochs 5 --out "_results/${{ matrix.variant }}" | tee "_log_${{ matrix.variant }}.txt"
      - name: Retain every annual checkpoint, ranked ETF, selections and daily costed NAV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original149-daily-r1r2-pilot-${{ matrix.variant }}'
          retention-days: 90
          path: |
            _results/
            _log_*.txt
