name: COMPACT21_OOS_ECONOMIC_LAYER
on:
  pull_request:
    branches: [research/compact21-return-aware-20261017]
    paths: [.github/workflows/compact21-economic-layer.yml, 'compact21_econ_layer_v1/**', paper_ltr_v2/replay.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  economic-stacking:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen environment and deterministic causal layer tests
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python -m py_compile compact21_econ_layer_v1/core.py compact21_econ_layer_v1/run.py compact21_econ_layer_v1/summarize.py
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s compact21_econ_layer_v1/tests -v
      - name: Retrieve frozen 125-feature original149 panels and annual out-of-sample BASE predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _base
          for i in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$i -D _ti/r$i
          done
      - name: Train causal economic layer only on mature prior-year BASE OOS and audit predictive quality
        run: |
          python compact21_econ_layer_v1/run.py --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --baseline _base --out _layer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-oos-economic-layer-predictive
          retention-days: 90
          path: _layer/
      - name: Retrieve certified original149 portfolio inputs, immutable base parity and original linkage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-audit -D _audit
          for i in 1 2 3; do
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$i -D _bases/r$i
          done
      - name: Three unchanged complete 149-ETF V2 replays and independent economic audit
        run: |
          mkdir -p _layer_replay
          for i in 1 2 3; do
            python paper_ltr_v2/replay.py --raw _raw/_repeat$i --baseline _bases/r$i --candidate _layer/ECON_LAYER_OOS30 --repeat $i --ti-panel _ti/r$i/TI_COMPACT.parquet --linkage-audit _audit/linkage-r$i/INPUT_LINKAGE.json --out _layer_replay/v2replay-ECON_LAYER_OOS30-r$i
          done
          python compact21_econ_layer_v1/summarize.py --replays _layer_replay --out _layer_replay/ECON_LAYER_ECONOMIC.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-oos-economic-layer-economic
          retention-days: 90
          path: _layer_replay/
