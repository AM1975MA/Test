name: Gap analysis - source identity 43 vs 31 v1

on:
  push:
    branches:
      - research/evidence-v2
    paths:
      - gap_analysis/protocols/SOURCE_IDENTITY_43_VS_31_V1_TRIGGER.txt

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact historical Etf_trader source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/AM1975MA/Etf_trader.git _historical_etf_trader
          cd _historical_etf_trader
          git checkout 53f5939ab858ece6425e46266bd42b99b8bd1cab
          test "$(git rev-parse HEAD)" = "53f5939ab858ece6425e46266bd42b99b8bd1cab"

      - name: Compare productive files byte-for-byte
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          paths = [
              'src/etf_trader/source_only/kernel.py',
              'src/etf_trader/source_only/features.py',
              'src/etf_trader/source_only/models.py',
              'src/etf_trader/source_only/_xgb_worker.py',
              'scripts/build_tit_r_source_only.py',
              'src/etf_trader/ma3/ensemble.py',
              'src/etf_trader/ma3/hybrid_producer.py',
              'src/etf_trader/ma3/producer.py',
              'src/etf_trader/ma3/ddfirst.py',
              'src/etf_trader/ma3/v6.py',
          ]
          expected_blobs = {
              'src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
              'src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
              'src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
              'src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
              'scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
              'src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223',
              'src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
              'src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592',
              'src/etf_trader/ma3/ddfirst.py':'3794564fdfe8501c2c19e618bc7d1550884aeb53',
              'src/etf_trader/ma3/v6.py':'6c5d3fd6f54fb5ef5162f4b26d3ef9af2af34701',
          }
          rows=[]
          for rel in paths:
              a=Path('_historical_etf_trader')/rel
              b=Path('vendor/etf_trader_v2')/rel
              ba=a.read_bytes(); bb=b.read_bytes()
              hist_blob=subprocess.check_output(['git','-C','_historical_etf_trader','hash-object',rel], text=True).strip()
              vend_blob=subprocess.check_output(['git','hash-object',str(b)], text=True).strip()
              row={
                  'path': rel,
                  'byte_identical': ba==bb,
                  'historical_git_blob': hist_blob,
                  'vendored_git_blob': vend_blob,
                  'expected_git_blob': expected_blobs[rel],
                  'historical_sha256': hashlib.sha256(ba).hexdigest(),
                  'vendored_sha256': hashlib.sha256(bb).hexdigest(),
                  'size_historical': len(ba),
                  'size_vendored': len(bb),
              }
              row['pass']=row['byte_identical'] and hist_blob==vend_blob==expected_blobs[rel]
              rows.append(row)

          stage=Path('vendor/p45/v2_stage19_kernel.py')
          stage_blob=subprocess.check_output(['git','hash-object',str(stage)], text=True).strip()
          stage_pass=stage_blob=='364c16f61d1866946827626e0d8f26dab276aca4'
          passed=all(r['pass'] for r in rows) and stage_pass
          result={
              'status':'SOURCE_IDENTITY_V1_COMPLETE',
              'historical_repo':'AM1975MA/Etf_trader',
              'historical_commit':'53f5939ab858ece6425e46266bd42b99b8bd1cab',
              'files':rows,
              'stage19':{
                  'path':'vendor/p45/v2_stage19_kernel.py',
                  'observed_git_blob':stage_blob,
                  'expected_git_blob':'364c16f61d1866946827626e0d8f26dab276aca4',
                  'pass':stage_pass,
              },
              'pass_all':passed,
          }
          out=Path('gap_analysis/results/source_identity_43_vs_31_v1')
          out.mkdir(parents=True, exist_ok=True)
          (out/'RESULT.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result, indent=2))
          if not passed:
              raise SystemExit('SOURCE_IDENTITY_GATE_FAIL')
          print('SOURCE_IDENTITY_GATE_PASS')
          PY

      - name: Persist result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gap_analysis/results/source_identity_43_vs_31_v1/RESULT.json
          git commit -m 'Persist source identity 43 vs 31 audit' || true
          git push
