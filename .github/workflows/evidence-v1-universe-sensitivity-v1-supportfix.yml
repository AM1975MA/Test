name: Evidence V1 universe sensitivity v1 supportfix

on:
  push:
    branches: [ research/evidence-v1 ]
    paths:
      - '.github/workflows/evidence-v1-universe-sensitivity-v1-supportfix.yml'
      - 'evidence_v1/protocols/UNIVERSE_SENSITIVITY_V1_SUPPORTFIX.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  universe-sensitivity-supportfix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Fail-closed scientific and support-fix gate
        run: |
          set -euo pipefail
          test "$(git hash-object evidence_v1/src/universe_sensitivity_v1.py)" = "9e51793b8e87f43fc691cbe42e02d9486f65c61c"
          test "$(git hash-object evidence_v1/src/universe_sensitivity_v1_supportfix.py)" = "dc2b9ec577283485537f05e6e39debb0696a68b3"
          test "$(git hash-object evidence_v1/protocols/UNIVERSE_SENSITIVITY_V1_PREREG.md)" = "45432b2d482f66400267e44b59b32db51bbb8e01"
          test "$(git hash-object evidence_v1/protocols/UNIVERSE_SENSITIVITY_V1_SUPPORTFIX.md)" = "0ffd213314b7b996d78d19ef4fbe1bce81777719"
          test "$(git hash-object evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py)" = "34cc133d4d44bb06cc21363b1444865e2d8ec5c1"
          test "$(git hash-object evidence_v1/source/baseline/etf_trader_v2/src/etf_trader/ma3/producer.py)" = "e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592"
          test "$(git hash-object evidence_v1/protocols/universe_sensitivity_v1/SUBSET_MANIFEST.json)" = "6d7709bc9f80b866fc241ed9cc10766a8b6481da"
          test "$(git hash-object evidence_v1/protocols/universe_sensitivity_v1/U120.csv)" = "7d0d56a3269f6e018b12c485939055f22be950b5"
          test "$(git hash-object evidence_v1/protocols/universe_sensitivity_v1/U100.csv)" = "cfa45dbbd1c754f582bb382cd687d35bf63b1427"
          test "$(git hash-object evidence_v1/protocols/universe_sensitivity_v1/U70.csv)" = "c6b56b97c4ee87cac51a948835d7ab475146d838"
          test "$(git hash-object evidence_v1/checkpoints/retriever_ltr_v1/CHECKPOINT_MANIFEST.json)" = "e51a8651f6696a0081acb09e3ed230e7e35fd79c"
          test "$(git hash-object evidence_v1/checkpoints/retriever_ltr_v1/OOS_PREDICTIONS.csv)" = "1745a6d12b6957bc629998c7ac3417550ac9bceb"
          echo "6b8d84a01ac7d33a23750154af872e68b57348029f667ef4206aea9ce791d0a0  evidence_v1/protocols/universe_sensitivity_v1/U120.csv" | sha256sum -c -
          echo "1e2b85b2b1fc03d3c8de4f43646331b6d930a4d031d1c81442352e55b576063c  evidence_v1/protocols/universe_sensitivity_v1/U100.csv" | sha256sum -c -
          echo "73071f3de06c9faa9f194ccb97e4563a6ceb97abe3ddf25179e8db1aff92b9ca  evidence_v1/protocols/universe_sensitivity_v1/U70.csv" | sha256sum -c -
          echo "3f9e054fdc0716161cec185ad5a32a62671ad3032070b9ca24ceed655011abd6  evidence_v1/checkpoints/retriever_ltr_v1/OOS_PREDICTIONS.csv" | sha256sum -c -
          echo "1efba2bc213ba26b042a9e77630fe26664343654629e658f43d314d068ba9e71  evidence_v1/DATA_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "cc4d315da68ec42275a7a74f05446ac6cbb484c3bd92a7861cd76805c5a94782  evidence_v1/SOURCE_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "01305fe62203c7b7895d95836267c4288f86d2c5a763ce7070c9c3d3d9f807ae  evidence_v1/requirements.lock.txt" | sha256sum -c -
          (cd evidence_v1/data && sha256sum -c ../DATA_MANIFEST_SHA256.txt)
          (cd evidence_v1/source && sha256sum -c ../SOURCE_MANIFEST_SHA256.txt)
          python -m py_compile evidence_v1/src/universe_sensitivity_v1.py evidence_v1/src/universe_sensitivity_v1_supportfix.py

      - name: Install locked numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r evidence_v1/requirements.lock.txt

      - name: Prepare frozen candidate data folders
        run: |
          rm -rf _evidence_v1_universe_sensitivity_fix
          mkdir -p _evidence_v1_universe_sensitivity_fix/data
          python - <<'PY'
          from pathlib import Path
          import shutil
          import pandas as pd
          root=Path('_evidence_v1_universe_sensitivity_fix/data')
          src=Path('evidence_v1/data/original149')
          proto=Path('evidence_v1/protocols/universe_sensitivity_v1')
          for name in ('U120','U100','U70'):
              u=pd.read_csv(proto/f'{name}.csv')
              d=root/name
              d.mkdir(parents=True,exist_ok=True)
              shutil.copy2(proto/f'{name}.csv',d/'universe.csv')
              for t in u.ticker.astype(str):
                  shutil.copy2(src/f'{t}.csv',d/f'{t}.csv')
          PY

      - name: Rebuild full149 and native candidate panels from frozen raw data
        env:
          PYTHONPATH: ${{ github.workspace }}/evidence_v1/source/baseline/etf_trader_v2/src
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          mkdir -p _evidence_v1_universe_sensitivity_fix/panel149
          python evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py \
            --data evidence_v1/data/original149 \
            --cluster-data evidence_v1/data/original149 \
            --output _evidence_v1_universe_sensitivity_fix/panel149
          for U in U120 U100 U70; do
            mkdir -p "_evidence_v1_universe_sensitivity_fix/panel${U}"
            python evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py \
              --data "_evidence_v1_universe_sensitivity_fix/data/${U}" \
              --cluster-data "_evidence_v1_universe_sensitivity_fix/data/${U}" \
              --output "_evidence_v1_universe_sensitivity_fix/panel${U}"
          done

      - name: Run common-support preregistered diagnostic
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          mkdir -p _evidence_v1_universe_sensitivity_fix/result
          python evidence_v1/src/universe_sensitivity_v1_supportfix.py \
            --full-panel _evidence_v1_universe_sensitivity_fix/panel149/RAW_FEATURE_PANEL.pkl \
            --checkpoint evidence_v1/checkpoints/retriever_ltr_v1 \
            --frozen-source evidence_v1/source/baseline/etf_trader_v2 \
            --u120 evidence_v1/protocols/universe_sensitivity_v1/U120.csv \
            --u100 evidence_v1/protocols/universe_sensitivity_v1/U100.csv \
            --u70 evidence_v1/protocols/universe_sensitivity_v1/U70.csv \
            --native120 _evidence_v1_universe_sensitivity_fix/panelU120/RAW_FEATURE_PANEL.pkl \
            --native100 _evidence_v1_universe_sensitivity_fix/panelU100/RAW_FEATURE_PANEL.pkl \
            --native70 _evidence_v1_universe_sensitivity_fix/panelU70/RAW_FEATURE_PANEL.pkl \
            --out _evidence_v1_universe_sensitivity_fix/result

      - name: Build provenance and final result manifest
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          import numpy,pandas,sklearn,xgboost
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          p={
            'line':'Evidence V1','test':'universe_sensitivity_v1_supportfix',
            'git_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'invalidated_technical_run':37053782730,
            'invalidated_run_produced_metrics':False,
            'evaluator_git_blob':subprocess.check_output(['git','hash-object','evidence_v1/src/universe_sensitivity_v1_supportfix.py'],text=True).strip(),
            'original_evaluator_git_blob':'9e51793b8e87f43fc691cbe42e02d9486f65c61c',
            'preregistration_git_blob':'45432b2d482f66400267e44b59b32db51bbb8e01',
            'supportfix_protocol_git_blob':'0ffd213314b7b996d78d19ef4fbe1bce81777719',
            'subset_manifest_sha256':h('evidence_v1/protocols/universe_sensitivity_v1/SUBSET_MANIFEST.json'),
            'retriever_checkpoint_manifest_sha256':h('evidence_v1/checkpoints/retriever_ltr_v1/CHECKPOINT_MANIFEST.json'),
            'retriever_oos_predictions_sha256':h('evidence_v1/checkpoints/retriever_ltr_v1/OOS_PREDICTIONS.csv'),
            'data_manifest_sha256':h('evidence_v1/DATA_MANIFEST_SHA256.txt'),
            'source_manifest_sha256':h('evidence_v1/SOURCE_MANIFEST_SHA256.txt'),
            'requirements_sha256':h('evidence_v1/requirements.lock.txt'),
            'panel_manifests_sha256':{
              'Original149':h('_evidence_v1_universe_sensitivity_fix/panel149/RAW_FEATURE_PANEL_MANIFEST.json'),
              'U120_native':h('_evidence_v1_universe_sensitivity_fix/panelU120/RAW_FEATURE_PANEL_MANIFEST.json'),
              'U100_native':h('_evidence_v1_universe_sensitivity_fix/panelU100/RAW_FEATURE_PANEL_MANIFEST.json'),
              'U70_native':h('_evidence_v1_universe_sensitivity_fix/panelU70/RAW_FEATURE_PANEL_MANIFEST.json')},
            'subset_freeze_run':37053163614,'subset_freeze_artifact':11246978301,
            'holdout70_used':False,
            'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,
            'scikit_learn':sklearn.__version__,'xgboost':xgboost.__version__}
          r=Path('_evidence_v1_universe_sensitivity_fix/result')
          (r/'PROVENANCE.json').write_text(json.dumps(p,indent=2)+'\n')
          files=sorted(x.name for x in r.iterdir() if x.is_file() and x.name!='RESULT_MANIFEST.json')
          (r/'RESULT_MANIFEST.json').write_text(json.dumps({'test':'universe_sensitivity_v1_supportfix','files_sha256':{f:h(r/f) for f in files}},indent=2)+'\n')
          print(json.dumps(p,indent=2))
          PY
          cat _evidence_v1_universe_sensitivity_fix/result/SUMMARY.json

      - name: Persist diagnostic evidence in branch
        run: |
          set -euo pipefail
          test ! -e evidence_v1/results/universe_sensitivity_v1
          mkdir -p evidence_v1/results/universe_sensitivity_v1
          cp _evidence_v1_universe_sensitivity_fix/result/* evidence_v1/results/universe_sensitivity_v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_v1/results/universe_sensitivity_v1
          git diff --cached --stat
          git commit -m "Record Evidence V1 universe sensitivity v1"
          git pull --rebase origin research/evidence-v1
          git push origin HEAD:research/evidence-v1

      - name: Upload universe-sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v1-universe-sensitivity-v1
          retention-days: 90
          if-no-files-found: error
          path: evidence_v1/results/universe_sensitivity_v1/*
