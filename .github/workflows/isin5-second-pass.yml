name: ISIN5_SECOND_PASS_PUBLIC_JUSTETF_EXCHANGE_MNEMONICS_YFINANCE
on:
  push:
    branches:
      - research/justetf-isin5-yfinance-20261019
    paths:
      - '.github/workflows/isin5-second-pass.yml'
      - 'isin_first2026/five_isin_yfinance/second_pass/CATALOG.csv'
      - 'isin_first2026/five_isin_yfinance/second_pass/run.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-milan-paris-stuttgart-mnemonics:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install same yfinance version for exact comparability
        run: |
          python -m pip install 'yfinance==0.2.65' 'numpy==2.3.5' 'pandas==2.2.3'
          python -m py_compile isin_first2026/five_isin_yfinance/second_pass/run.py
      - name: Probe venue actual ticker instead of rejected Reuters RIC aliases
        run: python -m isin_first2026.five_isin_yfinance.second_pass.run --out _ISIN_SECOND
      - name: Verify ISO catalog and archive SHA
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,pandas as pd
          p=pathlib.Path("_ISIN_SECOND")
          m=json.loads((p/"RESULT.json").read_text())
          assert m["attempts"]==4 and m["no_automated_justETF_scraping"]
          a=pd.read_csv(p/"ALIAS2_REAL_QUOTES_AND_ORIGINAL_ISIN_VALIDATION.csv")
          assert len(a)==4
          for line in (p/"SHA256_MANIFEST.txt").read_text().splitlines():
              h,f=line.split("  ",1)
              assert hashlib.sha256((p/f).read_bytes()).hexdigest()==h
          print("ISIN5_SECOND_PASS_STATUS",m["yahoo_results"])
          PY
      - name: Commit all second pass provenance on isolated Test research branch
        run: |
          mkdir -p isin_first2026/five_isin_yfinance/second_pass/results
          cp -a _ISIN_SECOND/. isin_first2026/five_isin_yfinance/second_pass/results/
          git config user.name "ISIN5-CROSSVENUE-RESEARCH"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isin_first2026/five_isin_yfinance/second_pass/results
          git commit -m "Archive Yahoo alternate INS CHIP SC0Y exchange mnemonic histories and same-ISIN reconciliation"
          git pull --rebase origin research/justetf-isin5-yfinance-20261019
          git push origin HEAD:refs/heads/research/justetf-isin5-yfinance-20261019
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PUBLIC_ISIN_FIVE_SECOND_PASS_ACTUAL_EURO_VENUES
          retention-days: 90
          path: _ISIN_SECOND/
