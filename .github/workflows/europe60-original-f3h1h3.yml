name: EUROPE60_RETRAIN_ORIGINAL_F3_H1_H3_AND_EQUAL_BLEND
on:
  push:
    branches:
      - research/eu60-original-F3H1H3-refit-20261019
    paths:
      - '.github/workflows/europe60-original-f3h1h3.yml'
      - 'europe_only75/f3h1_original_transfer/run.py'
      - 'europe_only75/f3h1_original_transfer/test_run.py'
      - 'europe_only75/f3h1_original_transfer/download_fx.py'
      - 'europe_only75/f3h1_original_transfer/PREREGISTERED.md'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  europe-original-f3-h1-h3:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed math and free FX source packages
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'yfinance==0.2.65'
          python -m py_compile europe_only75/f3h1_original_transfer/*.py
      - name: Test full euro-only roster, strict signal timing, original feature formulas
        run: |
          python -m unittest -v europe_only75.tests.test_universe europe_only75.f3h1_original_transfer.test_run
      - name: Recover prior yearly matured Europe60 models and archived R H control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39071370480 -R AM1975MA/Test -n europe-only-eur60-full-refit -D _EU60MODELS
          test -f _EU60MODELS/TRAINING_AUDIT.csv
          test -f _EU60MODELS/HYBRID_REFITTED.parquet
      - name: Recover original US factor quotes as explanatory controls only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _FACT_US
          test -f _FACT_US/etf_trader_raw/AGG.csv
          test -f _FACT_US/etf_trader_raw/SPY.csv
          test -f _FACT_US/etf_trader_raw/USO.csv
      - name: Obtain timestamp-lagged historical USD-EUR conversion quotes from yfinance
        run: |
          python -m europe_only75.f3h1_original_transfer.download_fx --out _EURUSD
      - name: Genuinely retrain original F3,H1,H3 on sixty European ETF labels with maturity embargo
        run: |
          python -m europe_only75.f3h1_original_transfer.run --eu-model _EU60MODELS --raw149 _FACT_US --fx _EURUSD --out _EU60F3H
      - name: Enforce original share replay reference and E.U. training-only exclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("_EU60F3H/RESULT.json").read_text())
          assert r["status"]=="EUROPE60_ORIGINAL_F3_H1_H3_WALKFORWARD_AND_MATCHED_RH_COMPLETE"
          assert r["n_europeonly_EUR_candidate_etfs"]==60
          assert r["no_US_149_ETF_portfolio_positions"]
          assert r["original_19_plus_6_F3_features"] and r["original_10_factor_H1_beta"]
          assert r["training_quarterly_asof_strict"]
          assert r["original_20261019_real_share_RH_parity"]<1e-9
          assert r["legacy_EUR60_RH_50_50_approx_fee_parity"]["absolute_error"]<1e-9
          assert r["n_eval_months"]>=55
          print("EU60_ORIGINAL_F3H1H3_STRICT_GO",r["F3_H1_50_strict_scientific_GO"])
          PY
      - name: Archive Europe-only source FX, EUR60 forecasts, exact time series, monthly trades
        run: |
          mkdir -p europe_only75/f3h1_original_transfer/results
          cp _EURUSD/*.csv _EURUSD/*.json _EU60F3H/*.csv _EU60F3H/*.json europe_only75/f3h1_original_transfer/results/
          (cd europe_only75/f3h1_original_transfer/results && sha256sum *.csv *.json > SHA256_MANIFEST.txt)
          (cd europe_only75/f3h1_original_transfer/results && sha256sum -c SHA256_MANIFEST.txt)
          git config user.name "EUROPE60-Original-F3H1-H3-Refit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add europe_only75/f3h1_original_transfer/results
          git commit -m "Archive genuinely EUR60-trained F3 H1 H3 and combined candidate next-Open risk and signed ranking"
          git push origin HEAD:refs/heads/research/eu60-original-F3H1H3-refit-20261019
      - name: Retain negative and positive source artifacts regardless of scientific GO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EU60-fresh-F3-H1-H3-and-RH-matched-evidence
          retention-days: 90
          path: |
            _EU60F3H/*.csv
            _EU60F3H/*.json
            _EURUSD/*.csv
            _EURUSD/*.json
