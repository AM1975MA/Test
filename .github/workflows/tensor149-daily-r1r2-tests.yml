name: ORIGINAL149_R1R2_CAUSAL_FEAT_QA
on:
  push:
    branches: [research/original149-r1r2-daily-20261020]
    paths:
      - '.github/workflows/tensor149-daily-r1r2-tests.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: '${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install precise isolated QA dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'matplotlib==3.10.8'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen Compact and synthetic future truncation gate
        run: |
          python -m py_compile tensor149_tcn5d/*.py
          python -m unittest -v tensor149_tcn5d.test_contract tensor149_tcn5d.test_daily_ablation
