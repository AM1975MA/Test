name: Titanium gap recovery A-B

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/apply_gap_ablation.py'
      - '.github/workflows/titanium-gap-recovery-ab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ablation:
    strategy:
      fail-fast: false
      matrix:
        mode: [START_ONLY, FORMULA]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 numba pyarrow matplotlib
      - name: Download historical test fixture
        uses: actions/download-artifact@v4
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE
          path: input
          repository: AM1975MA/Test
          run-id: 31464219662
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract fixture
        run: |
          mkdir -p input/package
          unzip -q input/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip -d input/package
          ROOT=input/package/HISTORICAL_F2D_RECOVERY
          test -f $ROOT/code/HISTORICAL_F2D_RUNNER.py
          test -f $ROOT/code/source_feature_engine.py
          test -f $ROOT/code/source_execution_reconstruction.py
          test -f $ROOT/BASKET_MEMBERSHIP_500.csv
      - name: Materialize V1 then apply ablation
        run: |
          ROOT=input/package/HISTORICAL_F2D_RECOVERY
          mkdir -p work
          python titanium_training_native/rebuild_v1.py --runner-input $ROOT/code/HISTORICAL_F2D_RUNNER.py --execution-input $ROOT/code/source_execution_reconstruction.py --runner-output work/titanium_gap.py --execution-output work/exact_execution.py
          python titanium_training_native/validate_contract.py --runner work/titanium_gap.py --execution work/exact_execution.py
          python titanium_training_native/apply_gap_ablation.py --source work/titanium_gap.py --mode ${{ matrix.mode }}
          python -m py_compile work/titanium_gap.py work/exact_execution.py
      - name: Train all annual models from scratch and backtest 500 baskets
        run: |
          ROOT=input/package/HISTORICAL_F2D_RECOVERY
          python work/titanium_gap.py --base-module $ROOT/code/source_feature_engine.py --v5-module work/exact_execution.py --data-dir $ROOT --output results --n-estimators 360 --n-baskets 500
      - name: Compare against frozen reference
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          mode='${{ matrix.mode }}'
          frozen={'D1':0.15022713687299,'D2':0.2264479079604543,'DEV':0.1861726630584223,'HOLD':0.2760542274772661,'FULL':0.2165406437471759}
          sc=pd.read_csv('results/PERIOD_SCORECARD_500.csv')
          b=sc[sc.strategy.eq('BASE')].set_index('period')
          fit=pd.read_csv('results/FIT_AUDIT.csv')
          known=json.loads(Path('results/KNOWN_SIGNAL_CHECK.json').read_text())
          out={'mode':mode,'checkpoint':known,'compact_train_dates_2017':int(fit.loc[fit.year.eq(2017),'compact_train_dates'].iloc[0]),'compact_train_rows_2017':int(fit.loc[fit.year.eq(2017),'compact_train_rows'].iloc[0]),'periods':{}}
          for p,v in frozen.items():
              got=float(b.loc[p,'cagr']); out['periods'][p]={'cagr':got,'frozen':v,'gap_pp':100*(got-v)}
          Path('results/GAP_ABLATION.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Archive
        if: always()
        run: |
          mkdir -p artifact/source
          cp -f work/titanium_gap.py artifact/source/ 2>/dev/null || true
          cp -f work/exact_execution.py artifact/source/ 2>/dev/null || true
          cp -f titanium_training_native/apply_gap_ablation.py artifact/source/
          if [ -d results ]; then cp -a results artifact/; fi
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_GAP_${{ matrix.mode }}
          path: artifact
          retention-days: 30
