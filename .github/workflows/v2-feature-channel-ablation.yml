name: V2 127-leaf feature channel drop-one ablation
on:
  push:
    branches: [research-v2-feature-channel-ablation-20261021]
    paths:
      - 'regeneration/v2_feature_channel_ablation.py'
      - 'regeneration/v2_feature_channel_aggregate.py'
      - '.github/workflows/v2-feature-channel-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  fit:
    name: Train feature ablations ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2022, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical stack
        run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - name: Recover exact pre-existing raw snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw
          gh run download 39482809691 --repo AM1975MA/Test --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          test -f etf_trader_raw/manifest.json
          python regeneration/certify_etf_trader_raw.py
      - name: Run matched feature drop-one fits
        run: |
          python regeneration/v2_feature_channel_ablation.py \
            --years "${{ matrix.year }}" \
            --sets BASE125,NO_DEV,NO_PCT,NO_RAW,NO_MARKET,NO_MOMENTUM,NO_VOLRISK,NO_LIQUIDITY \
            --raw etf_trader_raw \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out runs/v2_feature_channel_shards/${{ matrix.year }}
      - name: Store yearly OOS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-feature-channel-${{ matrix.year }}
          path: runs/v2_feature_channel_shards/
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: fit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-feature-channel-*
          merge-multiple: true
          path: runs/v2_feature_channel_shards/
      - name: Aggregate shared-month paired OOS metrics
        run: |
          python regeneration/v2_feature_channel_aggregate.py \
            --root runs/v2_feature_channel_shards --out runs/v2_feature_channel_complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-feature-channel-complete
          path: runs/v2_feature_channel_complete/
          if-no-files-found: warn
          retention-days: 30
