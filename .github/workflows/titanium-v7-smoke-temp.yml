name: Titanium V7 Parity Smoke TEMP
on:
  push:
    branches: [titanium-exact-v23-membership-20260811]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      NUMBA_DISABLE_CACHING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen-compatible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Reconstruct exact production-aligned Base sources
        run: |
          mkdir -p upstream
          curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-live-package-regeneration-20260804/regeneration/exact_base_overlay.py.gz.b64" -o upstream/exact_base_overlay.py.gz.b64
          base64 -d upstream/exact_base_overlay.py.gz.b64 | gzip -dc > upstream/exact_base_overlay.py
          echo '6efba567b9998cfd43c34d2af148f162ff1ab032d14984948b12b3ee5e161122  upstream/exact_base_overlay.py' | sha256sum -c -
          curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-live-package-regeneration-20260804/regeneration/titanium_base_parity_exact.py.gz.b64" -o upstream/titanium_base_parity_exact.py.gz.b64
          base64 -d upstream/titanium_base_parity_exact.py.gz.b64 | gzip -dc > titanium_base_parity_exact.py
          echo '7f385ffe91b44fe25cf8652a32ce917a9a06a65159ed3cba735c700f78c7c63c  titanium_base_parity_exact.py' | sha256sum -c -
          sed -i 's/@njit(cache=True)/@njit(cache=False)/g; s/@njit(parallel=True,cache=True)/@njit(parallel=True,cache=False)/g' titanium_base_parity_exact.py
          python -m py_compile upstream/exact_base_overlay.py titanium_base_parity_exact.py
      - name: Recover validated 150 ETF matrices from last successful package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9117169381/zip -o previous.zip
          mkdir wrapper package
          unzip -q previous.zip -d wrapper
          unzip -q wrapper/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip -d package
          DATA=package/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/data
          for f in OPEN HIGH LOW CLOSE VOLUME; do test -s "$DATA/${f}.parquet"; done
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          d=Path('package/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/data')
          m={f:pd.read_parquet(d/f'{f}.parquet') for f in ['OPEN','HIGH','LOW','CLOSE','VOLUME']}
          counts=m['CLOSE'].notna().sum()
          bad=counts[counts<252]
          if len(m['CLOSE'].columns)!=150 or not bad.empty:
              raise RuntimeError(f'Invalid cached 150 ETF matrix: columns={len(m["CLOSE"].columns)} bad={bad.to_dict()}')
          print(json.dumps({'tickers':150,'min_close_rows':int(counts.min()),'PIN':int(counts['PIN']),'VUG':int(counts['VUG'])},indent=2))
          PY
      - name: Run exact production Base parity full walk-forward
        run: |
          python titanium_base_parity_exact.py \
            --base-module upstream/exact_base_overlay.py \
            --data-dir package/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/data \
            --output TITANIUM_BASE_PARITY_EXACT | tee BASE_PARITY_RUN_LOG.txt
      - name: Quantitative parity gate
        run: |
          python - <<'PY'
          import pandas as pd, json
          from pathlib import Path
          r=pd.read_csv('TITANIUM_BASE_PARITY_EXACT/BASKET_RESULTS.csv')
          b=r[r.strategy=='BASE']
          g=pd.read_csv('TITANIUM_BASE_PARITY_EXACT/GLOBAL_SCORECARD.csv')
          frozen=.2165406437471759
          mean=float(b.cagr.mean())
          out={'base_mean_cagr':mean,'base_median_cagr':float(b.cagr.median()),'delta_vs_frozen_pp':(mean-frozen)*100,'n_baskets':int(b.basket.nunique()),'global':g.to_dict('records')}
          Path('BASE_PARITY_SUMMARY.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Archive
        if: always()
        run: zip -r TITANIUM_BASE_PARITY_EXACT.zip TITANIUM_BASE_PARITY_EXACT BASE_PARITY_SUMMARY.json BASE_PARITY_RUN_LOG.txt titanium_base_parity_exact.py upstream/exact_base_overlay.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_BASE_PARITY_EXACT
          path: |
            TITANIUM_BASE_PARITY_EXACT.zip
            BASE_PARITY_SUMMARY.json
            BASE_PARITY_RUN_LOG.txt
            TITANIUM_BASE_PARITY_EXACT/BASKET_RESULTS.csv
            TITANIUM_BASE_PARITY_EXACT/GLOBAL_SCORECARD.csv
            TITANIUM_BASE_PARITY_EXACT/FIT_AUDIT.csv
            TITANIUM_BASE_PARITY_EXACT/MACRO_GATE_AUDIT.csv
          retention-days: 14
