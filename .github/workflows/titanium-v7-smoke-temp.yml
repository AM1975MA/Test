name: Titanium V7 Parity Smoke TEMP
on:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      NUMBA_DISABLE_CACHING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Reconstruct verified engines
        run: |
          mkdir -p upstream/gz upstream/v6
          for f in gz_00.b64 gz_01.b64 gz_02.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-source-faithful-20260803/gzpayload/$f" -o "upstream/gz/$f"; done
          cat upstream/gz/gz_*.b64 | base64 -d | gzip -dc > upstream/base.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  upstream/base.py' | sha256sum -c -
          for f in rv5_00.b64 rv5_01.b64 rv5_02.b64 rv5_04.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/v6/$f"; done
          for f in rv5_03a.b64 rv5_03b.b64 rv5_03c.b64 rv5_03d.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/v6/$f"; done
          cat upstream/v6/rv5_00.b64 upstream/v6/rv5_01.b64 upstream/v6/rv5_02.b64 upstream/v6/rv5_03a.b64 upstream/v6/rv5_03b.b64 upstream/v6/rv5_03c.b64 upstream/v6/rv5_03d.b64 upstream/v6/rv5_04.b64 | base64 -d | gzip -dc > upstream/v6.py
          echo 'ba99f9ce08d96e6b56567d44bf18b5caa7a76ccf13a7d44546e6d1416d79d65a  upstream/v6.py' | sha256sum -c -
          sed -i 's/@njit(cache=True)/@njit(cache=False)/g; s/@njit(parallel=True,cache=True)/@njit(parallel=True,cache=False)/g' upstream/v6.py
          curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/28430c0c3487eb7973dc5c6f0d0a569a90d8224c/regeneration/production_aligned_regen.py" -o upstream/prod.py
          python -m py_compile upstream/base.py upstream/v6.py upstream/prod.py regeneration/v7_smoke_temp.py
      - name: Download OHLCV matrices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/8839840705/zip -o prices.zip
          mkdir prices && unzip -q prices.zip -d prices
          for f in OPEN HIGH LOW CLOSE VOLUME; do test -s "prices/titanium_retrained_output/${f}.parquet"; done
      - name: Run V7 smoke
        run: |
          python regeneration/v7_smoke_temp.py --base upstream/base.py --v6 upstream/v6.py --prod upstream/prod.py --data prices/titanium_retrained_output --trees 60 --baskets 20 --output V7_SMOKE | tee V7_SMOKE_LOG.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_V7_PARITY_SMOKE
          path: |
            V7_SMOKE/
            V7_SMOKE_LOG.txt
          retention-days: 7
