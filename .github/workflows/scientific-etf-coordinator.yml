name: SCIENTIFIC_ETF_COORDINATOR_V1
on:
  push:
    branches:
      - research/scientific-coordinator-20261018
    paths:
      - 'scientific_lab/**'
      - '.github/workflows/scientific-etf-coordinator.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONHASHSEED: '0'
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}/europe120/eu120_retrain:${{ github.workspace }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  scientific-eur60:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin frozen source-compatible runtime
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'numba==0.65.1' 'threadpoolctl==3.6.0' 'matplotlib==3.10.8'
          python -m py_compile scientific_lab/models.py scientific_lab/ledger.py scientific_lab/run.py
      - name: Read immutable frozen predictions and benchmark artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39071370480 -R AM1975MA/Test -n europe-only-eur60-full-refit -D _refit
          gh run download 39084898663 -R AM1975MA/Test -n europe-only-eur60-hindsight-oracle -D _oracle
          gh run download 39087987551 -R AM1975MA/Test -n europe60-stochastic-state-space-v1 -D _stoch
          test -f _refit/RESULT.json
          test -f _oracle/MONTHLY_ORACLE_113.csv
          test -f _stoch/MONTHLY_SCORES.csv
      - name: Execute eight-role scientific coordinator and seven precommitted arms
        run: |
          python scientific_lab/run.py --stoch _stoch --oracle _oracle --refit _refit --out _scientific
      - name: Retain complete ledger and scientific receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-etf-coordinator-eur60-v1
          retention-days: 90
          path: |
            _scientific/RESULT.json
            _scientific/MONTHLY_LEDGER.csv
            _scientific/RISK_FORECAST_AUDIT.csv
            _scientific/MONTHLY_STATES.json
