name: OASIS149_G4B_FIVE_CBOE_IMPLIED_VOL_FACTORS
on:
  push:
    branches:
      - research/oasis149-cboe-impliedvol-g4b-20261018
    paths:
      - 'oasis149/cboe_g4b/**'
      - '.github/workflows/oasis149-cboe-g4b.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONHASHSEED: '0'
  PYTHONPATH: ${{ github.workspace }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  market-options-informational-skill:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numeric and discriminative probability dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'requests==2.32.5'
          python -m py_compile oasis149/cboe_g4b/experiment.py oasis149/cboe_g4b/test_asof.py
      - name: Reject option-index inputs not available before signal
        run: |
          python -m unittest -v oasis149.cboe_g4b.test_asof oasis_v2.g1.test_pairwise
      - name: Acquire FULL official CBOE histories and verify raw/filtered source
        run: |
          python -m oasis149.cboe_g4b.experiment --download --out _cboe
      - name: Freeze as-of options market data and evaluate original149 paired net advantage
        run: |
          python -m oasis149.cboe_g4b.experiment --source _cboe --out _g4b
      - name: Validate chronological and source-hash outcome without performance cherry-picking
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("_g4b/RESULT.json").read_text())
          assert d["status"]=="ORIGINAL149_CBOE_G4B_EXPLORATORY_COMPLETE"
          assert d["original_149_exact"] and d["paired_rows"]==5120
          assert d["frozen_21session_anchor_count"]==64
          assert d["CBOE_HISTORICAL_VINTAGE_VALIDATED"] is False
          assert d["no_training_on_unmatured_forward_labels"]
          print("G4B_CBOE_PROPER_SCORE_GATE",d["G4b_score_gate"])
          PY
      - name: Permanently preserve exact source data, 5120 forecasts and research result
        run: |
          mkdir -p oasis149/cboe_g4b/results
          cp -r _cboe oasis149/cboe_g4b/results/source
          cp _g4b/*.json _g4b/*.csv oasis149/cboe_g4b/results/
          (cd oasis149/cboe_g4b/results && sha256sum *.csv *.json source/*.csv source/*.json > SHA256_MANIFEST.txt)
          (cd oasis149/cboe_g4b/results && sha256sum -c SHA256_MANIFEST.txt)
          git config user.name "OASIS149-CBOE-Information-Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oasis149/cboe_g4b/results
          git commit -m "Archive all five official CBOE implied-vol price histories, full paired probabilities, and strict null-vs-price G4b evidence"
          git push origin HEAD:refs/heads/research/oasis149-cboe-impliedvol-g4b-20261018
      - name: Retain raw and scientific evaluation as Action artifact even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis149-g4b-five-implied-vol-and-matched-scores
          retention-days: 90
          path: |
            _cboe/*.csv
            _cboe/*.json
            _g4b/*.csv
            _g4b/*.json
