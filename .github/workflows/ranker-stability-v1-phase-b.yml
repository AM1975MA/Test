name: ETF trader ranker stability V1 phase B all years

on:
  push:
    branches:
      - research/ranker-stability-v1
    paths:
      - .github/workflows/ranker-stability-v1-phase-b.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        model:
          - XGB_CANONICAL
          - LGBM_XENDCG
          - LGBM_LAMBDARANK
          - RIDGE_POINTWISE
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      ETF_TRADER_XGB_THREADS_PER_WORKER: "1"
      ETF_TRADER_XGB_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen benchmark environment
        run: |
          python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0" "xgboost==3.1.3" "lightgbm==4.7.0" "catboost==1.2.8" pyarrow scipy
      - name: Restore frozen Compact panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _ti/repeat1 _ti/repeat2 _ti/repeat3
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-1 -D _ti/repeat1
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-2 -D _ti/repeat2
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-3 -D _ti/repeat3
      - name: Run all-year benchmark
        run: |
          mkdir -p _result
          python ranker_stability_v1/run_ranker_benchmark_full.py --model "${{ matrix.model }}" --r1 _ti/repeat1 --r2 _ti/repeat2 --r3 _ti/repeat3 --years "2017,2018,2019,2020,2021,2022,2023,2024,2025,2026" --out "_result/${{ matrix.model }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ranker-v1-phaseb-${{ matrix.model }}
          retention-days: 90
          path: _result/*.json

  summarize:
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ranker-v1-phaseb-*
          path: _all
      - name: Aggregate all-year benchmark
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          rows={}
          for p in Path("_all").rglob("*.json"):
              q=json.loads(p.read_text()); rows[q["model"]]=q
          b=rows["XGB_CANONICAL"]["aggregate_mean"]
          table=[]
          for name,q in rows.items():
              a=q["aggregate_mean"]
              improve=(b["rank_mean_abs"]-a["rank_mean_abs"])/b["rank_mean_abs"]
              nd=a["ndcg5"]/b["ndcg5"] if b["ndcg5"] else 0
              eligible=bool(name!="XGB_CANONICAL" and improve>=.25 and a["top1_disagreement_fraction"]<=b["top1_disagreement_fraction"] and a["mean_daily_spearman_stability"]>=b["mean_daily_spearman_stability"] and nd>=.95 and q["ALL_MATURITY_PASS"])
              table.append({"model":name,**a,"rank_improvement_pct":100*improve,"ndcg5_ratio_vs_xgb":nd,"PROMOTE_FULL_PIPELINE":eligible})
          table.sort(key=lambda x:(not x["PROMOTE_FULL_PIPELINE"],x["rank_mean_abs"],-x["ndcg5"]))
          out={"status":"RANKER_STABILITY_V1_PHASE_B_COMPLETE","years":"2017-2026","ranking":table,"models":rows}
          Path("ranker_stability_v1/results").mkdir(parents=True,exist_ok=True)
          Path("ranker_stability_v1/results/PHASE_B.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(table,indent=2))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranker_stability_v1/results/PHASE_B.json
          git commit -m "Persist ranker stability V1 Phase B"
          git pull --rebase --autostash origin research/ranker-stability-v1
          git push origin HEAD:research/ranker-stability-v1
      - uses: actions/upload-artifact@v4
        with:
          name: ranker-stability-v1-phase-b-summary
          retention-days: 90
          path: ranker_stability_v1/results/PHASE_B.json
