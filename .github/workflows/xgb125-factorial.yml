name: COMPACT21_XGB125_FACTORIAL_2X2
on:
  pull_request:
    branches: [research/compact21-pls-xgbranker-20261017]
    paths: [.github/workflows/xgb125-factorial.yml, 'xgb125_factorial_v1/**', paper_ltr_v2/replay.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  factorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen numerical contract and experiments tests
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python -m py_compile xgb125_factorial_v1/core.py xgb125_factorial_v1/run.py xgb125_factorial_v1/summarize.py
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s xgb125_factorial_v1/tests -v
      - name: Download unchanged baseline controls, three panels and prior matched run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38580178650 -R AM1975MA/Test -n listnet-linear-relative-repair -D _annual
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _baseline
          gh run download 38974661195 -R AM1975MA/Test -n pls-xgb-predictive -D _previous
          for i in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$i -D _ti/r$i
          done
      - name: Train 180 XGB seed fits in 2 missing factorial cells and compare all 4
        run: |
          python xgb125_factorial_v1/run.py --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --annual _annual/_candidate --baseline _baseline --previous _previous --out _factorial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xgb125-factorial-predictive
          retention-days: 90
          path: _factorial/
      - name: Download unchanged certified portfolio inputs and matched economic replays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38974661195 -R AM1975MA/Test -n pls-xgb-economic -D _previous_economic
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-audit -D _audit
          for i in 1 2 3; do
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$i -D _bases/r$i
          done
      - name: Six new full V2 replays and independently verify four-cell economic paths
        run: |
          mkdir -p _factorial_replays
          for variant in XGB_FULL_PREP XGB_REDUCED_NATIVE; do
            for i in 1 2 3; do
              python paper_ltr_v2/replay.py --raw _raw/_repeat$i --baseline _bases/r$i --candidate _factorial/$variant --repeat $i --ti-panel _ti/r$i/TI_COMPACT.parquet --linkage-audit _audit/linkage-r$i/INPUT_LINKAGE.json --out _factorial_replays/v2replay-$variant-r$i
            done
          done
          python xgb125_factorial_v1/summarize.py --fresh _factorial_replays --previous _previous_economic --out _factorial_replays/FACTORIAL_ECONOMIC.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xgb125-factorial-economic
          retention-days: 90
          path: _factorial_replays/
