name: ORIGINAL149_FROZEN_DEPTHS_TWO_STAGE_TOP5_476W
on:
  push:
    branches: [research/original149-two-stage-top5-20261020]
    paths:
      - '.github/workflows/tensor149-two-stage-top5.yml'
      - 'tensor149_tcn5d/two_stage_top5.py'
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  PYTHONPATH: '${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  two_stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen Original149 numerical stack
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'matplotlib==3.10.8' 'pyarrow==23.0.1'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Fixed as-of shortlist tests and original frozen contract
        run: |
          python -m py_compile tensor149_tcn5d/two_stage_top5.py tensor149_tcn5d/test_two_stage_top5.py
          python -m unittest -v tensor149_tcn5d.test_two_stage_top5 tensor149_tcn5d.test_contract
      - name: Download OOS depth2-7 identical market dates and prices, never re-fit
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -eux
          for d in 2 3 4 5 6 7; do
            gh run download 39492170319 -R AM1975MA/Test -n "original149-xgb125-depth-$d" -D "_frozen/depth$d"
          done
          for d in 2 3 4 5 6 7; do
            find "_frozen/depth$d" -name RESULT.json -print
          done
      - name: Compare 6 frozen solo experts to fixed 4 two-stage and 2 blends, same 476 dates
        run: |
          set -o pipefail
          python -m tensor149_tcn5d.two_stage_top5 --scores _frozen --raw evidence_v1/data/original149 --out _results | tee _run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original149-frozen-xgb125-two-stage-476week-full
          retention-days: 90
          path: |
            _results/
            _run.log
