name: V2 canonical 149 parity probe

on:
  push:
    branches: [ research/v2-same-source-149-vs-70-20261002 ]
    paths:
      - '.github/workflows/v2-canonical149-probe.yml'
      - 'holdout70/v2_canonical149_probe.py'
      - 'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py'
      - 'vendor/etf_trader_v2/src/etf_trader/source_only/models.py'
      - 'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical V2 requirements
        run: python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib 'pandas==2.2.3'
      - name: Retrieve frozen original149
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36551650325 -R ${{ github.repository }} -n etf-trader-raw-149 -D _raw149
      - name: Verify exact canonical source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          exp={
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
            'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
            'vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
            'vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
            'vendor/p45/v2_stage19_kernel.py':'364c16f61d1866946827626e0d8f26dab276aca4',
          }
          # Three vendored files were copied through a text API that omitted only
          # their terminal LF. Restore it only when doing so produces the exact
          # historical Git blob. No other source normalization is permitted.
          terminal_lf_candidates={
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py',
          }
          for p,want in exp.items():
            path=Path(p)
            got=subprocess.check_output(['git','hash-object',p],text=True).strip()
            if got!=want and p in terminal_lf_candidates:
              raw=path.read_bytes()
              if raw.endswith(b'\n'):
                raise AssertionError((p,'unexpected mismatch despite terminal LF',got,want))
              path.write_bytes(raw+b'\n')
              got=subprocess.check_output(['git','hash-object',p],text=True).strip()
            print(p, got)
            assert got==want,(p,got,want)
          print('CANONICAL_SOURCE_HASH_GATE_PASS')
          PY
      - name: Run canonical 149 source-only probe
        env:
          FROZEN_149_ROOT: ${{ github.workspace }}/_raw149
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: python holdout70/v2_canonical149_probe.py
      - name: Show parity
        if: always()
        run: test -f holdout70/canonical149_probe/PARITY.json && cat holdout70/canonical149_probe/PARITY.json || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-canonical149-probe
          retention-days: 30
          if-no-files-found: warn
          path: |
            holdout70/canonical149_probe/PARITY.json
            holdout70/canonical149_probe/ENSEMBLE_TAIL_OOS.csv
            holdout70/canonical149_probe/ENSEMBLE_FIT_AUDIT.csv
            holdout70/canonical149_probe/FULL_UNIVERSE_PATH.npz
            holdout70/canonical149_probe/titanium/TIT_R_SOURCE_ONLY.csv
            holdout70/canonical149_probe/titanium/TIT_R_SOURCE_ONLY_MANIFEST.json
