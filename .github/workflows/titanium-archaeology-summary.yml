name: Titanium Archaeology Summary
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download all prior archaeology artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p arch_download
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/AM1975MA/Test/actions/runs/31360990762/artifacts?per_page=100' -o artifacts.json
          python - <<'PY'
          import json, os, subprocess
          arts=json.load(open('artifacts.json'))['artifacts']
          for a in arts:
              if not a['name'].startswith('ARCH_'): continue
              out=f"arch_download/{a['name']}.zip"
              subprocess.run(['curl','-fsSL','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','Accept: application/vnd.github+json',a['archive_download_url'],'-o',out],check=True)
          print('downloaded',len(list(__import__('pathlib').Path('arch_download').glob('*.zip'))))
          PY
      - name: Aggregate archaeology results
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          import pandas as pd
          rows=[]
          for z in sorted(Path('arch_download').glob('ARCH_*.zip')):
              with zipfile.ZipFile(z) as q:
                  names=q.namelist()
                  cand=[n for n in names if n.endswith('RESULT.json')]
                  if not cand: continue
                  r=json.loads(q.read(cand[0]))
                  rows.append(r)
          df=pd.DataFrame(rows)
          df['D1_err']=df.D1-0.15023
          df['D2_err']=df.D2-0.22645
          df['DEV_err']=df.DEV-0.18617
          df['HOLD_err']=df.HOLD-0.27605
          df['FULL_err']=df.FULL-0.21654064
          df['dev_abs_mean']=(df.D1_err.abs()+df.D2_err.abs()+df.DEV_err.abs())/3
          df=df.sort_values(['dev_abs_mean','FULL_err'],key=lambda s:s.abs() if s.name=='FULL_err' else s)
          df.to_csv('ARCHAEOLOGY_SUMMARY.csv',index=False)
          print('\n=== SORTED BY DEVELOPMENT RECONSTRUCTION ERROR ===')
          cols=['tag','trees','depth','lr','mcw','lam','alpha','subsample','colsample','D1','D2','DEV','HOLD','FULL','dev_abs_mean','HOLD_err','FULL_err']
          print(df[cols].to_string(index=False))
          print('\nBEST FULL CAGR')
          print(df.sort_values('FULL',ascending=False)[cols].head(10).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_ARCHAEOLOGY_SUMMARY
          path: ARCHAEOLOGY_SUMMARY.csv
          retention-days: 7
