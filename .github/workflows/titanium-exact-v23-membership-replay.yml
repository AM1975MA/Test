name: Titanium exact V23 membership replay

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - '.github/workflows/titanium-exact-v23-membership-replay.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 numba pyarrow matplotlib
      - name: Download best corrected scores
        uses: actions/download-artifact@v4
        with:
          name: TITANIUM_PLATINUM_COMPACT_EXACT_TAIL_CVAR
          path: best
          repository: AM1975MA/Test
          run-id: 31647358105
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact V23 canonical membership
        uses: actions/download-artifact@v4
        with:
          name: TITANIUM_EXACT_V23_CANONICAL_MEMBERSHIP
          path: v23
          repository: AM1975MA/Test
          run-id: 31535364822
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract exact membership
        run: |
          mkdir -p v23pkg
          INNER=$(find v23 -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' | head -1)
          test -n "$INNER"
          unzip -q "$INNER" -d v23pkg
          MEM=$(find v23pkg -name V23_BASKET_MEMBERSHIP.csv | head -1)
          test -n "$MEM"
          sha256sum "$MEM"
          echo "MEM=$MEM" >> "$GITHUB_ENV"
      - name: Replay frozen macro gate plus exact V23 membership
        run: |
          ROOT=$(dirname "$(find best -name OOS_TICKER_SCORES.parquet | head -1)")
          EXEC=$(find best -path '*/source/exact_execution.py' | head -1)
          python titanium_training_native/replay_macro_gate_from_artifact.py --root "$ROOT" --execution-source "$EXEC" --membership "$MEM" --output results
      - name: Selection fingerprint on exact membership
        run: |
          ROOT=$(dirname "$(find best -name COMPACT_LABELED.parquet | head -1)")
          python titanium_training_native/audit_titanium_selection_fingerprint.py --scores results/OOS_TICKER_SCORES.parquet --labels "$ROOT/COMPACT_LABELED.parquet" --membership "$MEM" --output results/fingerprint
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_EXACT_V23_MEMBERSHIP_REPLAY
          path: results
          retention-days: 30
