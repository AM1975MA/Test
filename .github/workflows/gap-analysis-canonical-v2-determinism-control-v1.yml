name: Gap analysis - canonical V2 determinism control v1

on:
  push:
    branches: [ research/evidence-v2 ]
    paths:
      - '.github/workflows/gap-analysis-canonical-v2-determinism-control-v1.yml'
      - 'gap_analysis/protocols/CANONICAL_V2_DETERMINISM_CONTROL_V1.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  RAW_RUN_ID: '37121749852'
  RAW_ARTIFACT: 'yfinance-repeatability-v1-raw'
  RAW_DIR: '_raw/_repeat2'
  CANONICAL_RUNNER_SHA: 'ebd578e0d92e986adb5c2fbf265a346f87b7218e'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
  ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
  ETF_TRADER_XGB_WORKERS: '3'

jobs:
  cross_runner:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact replay environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib \
            'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' \
            'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'
          python - <<'PY'
          import numpy,pandas,sklearn,xgboost,numba,yfinance
          assert numpy.__version__=='2.3.5'
          assert pandas.__version__=='2.2.3'
          assert sklearn.__version__=='1.8.0'
          assert xgboost.__version__=='3.1.3'
          assert numba.__version__=='0.65.1'
          assert yfinance.__version__=='0.2.66'
          print('ENV_GATE_PASS')
          PY

      - name: Gate canonical source blobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exp={
            'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
            'vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223',
            'vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
            'vendor/etf_trader_v2/src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ddfirst.py':'3794564fdfe8501c2c19e618bc7d1550884aeb53',
            'vendor/etf_trader_v2/src/etf_trader/ma3/v6.py':'6c5d3fd6f54fb5ef5162f4b26d3ef9af2af34701',
            'vendor/p45/v2_stage19_kernel.py':'364c16f61d1866946827626e0d8f26dab276aca4',
          }
          lf_fix={
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py',
          }
          for p,want in exp.items():
              got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              if got!=want and p in lf_fix:
                  path=Path(p); raw=path.read_bytes()
                  if not raw.endswith(b'\n'):
                      path.write_bytes(raw+b'\n')
                      got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              assert got==want,(p,got,want)
          print('CANONICAL_V2_SOURCE_GATE_PASS')
          PY

      - name: Restore byte-identical repeat2 raw and canonical runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$RAW_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$RAW_ARTIFACT" -D _raw
          test -f "$RAW_DIR/universe.csv"
          test -f "$RAW_DIR/manifest.json"
          mkdir -p holdout70
          curl -fsSL 'https://raw.githubusercontent.com/AM1975MA/Test/research/v2-same-source-149-vs-70-20261002/holdout70/v2_canonical_same_source_compare.py' -o holdout70/v2_canonical_same_source_compare.py
          test "$(git hash-object holdout70/v2_canonical_same_source_compare.py)" = "$CANONICAL_RUNNER_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('_raw/_repeat2')
          h=hashlib.sha256()
          for p in sorted(x for x in root.iterdir() if x.is_file()):
              h.update(p.name.encode()+b'\0'+p.read_bytes()+b'\0')
          Path('RAW_DIR_SHA256.txt').write_text(h.hexdigest()+'\n')
          print('RAW_DIR_SHA256',h.hexdigest())
          PY

      - name: Full canonical replay on identical raw
        run: |
          python gap_analysis/src/replay_repeat_snapshot.py \
            --raw "$RAW_DIR" \
            --compare-script holdout70/v2_canonical_same_source_compare.py \
            --out _result
          cp RAW_DIR_SHA256.txt _result/original149/RAW_DIR_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: determinism-cross-${{ matrix.trial }}
          retention-days: 90
          if-no-files-found: error
          path: |
            _result/original149/RESULT.json
            _result/original149/DAILY_LEADERS.csv
            _result/original149/ENSEMBLE_FIT_AUDIT.csv
            _result/original149/RAW_DIR_SHA256.txt

  same_runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact replay environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib \
            'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' \
            'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'
          python - <<'PY'
          import numpy,pandas,sklearn,xgboost,numba,yfinance
          assert numpy.__version__=='2.3.5'
          assert pandas.__version__=='2.2.3'
          assert sklearn.__version__=='1.8.0'
          assert xgboost.__version__=='3.1.3'
          assert numba.__version__=='0.65.1'
          assert yfinance.__version__=='0.2.66'
          print('ENV_GATE_PASS')
          PY

      - name: Gate canonical source blobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exp={
            'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
            'vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223',
            'vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
            'vendor/etf_trader_v2/src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ddfirst.py':'3794564fdfe8501c2c19e618bc7d1550884aeb53',
            'vendor/etf_trader_v2/src/etf_trader/ma3/v6.py':'6c5d3fd6f54fb5ef5162f4b26d3ef9af2af34701',
            'vendor/p45/v2_stage19_kernel.py':'364c16f61d1866946827626e0d8f26dab276aca4',
          }
          lf_fix={
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py',
          }
          for p,want in exp.items():
              got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              if got!=want and p in lf_fix:
                  path=Path(p); raw=path.read_bytes()
                  if not raw.endswith(b'\n'):
                      path.write_bytes(raw+b'\n')
                      got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              assert got==want,(p,got,want)
          print('CANONICAL_V2_SOURCE_GATE_PASS')
          PY

      - name: Restore byte-identical repeat2 raw and canonical runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$RAW_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$RAW_ARTIFACT" -D _raw
          test -f "$RAW_DIR/universe.csv"
          test -f "$RAW_DIR/manifest.json"
          mkdir -p holdout70
          curl -fsSL 'https://raw.githubusercontent.com/AM1975MA/Test/research/v2-same-source-149-vs-70-20261002/holdout70/v2_canonical_same_source_compare.py' -o holdout70/v2_canonical_same_source_compare.py
          test "$(git hash-object holdout70/v2_canonical_same_source_compare.py)" = "$CANONICAL_RUNNER_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('_raw/_repeat2')
          h=hashlib.sha256()
          for p in sorted(x for x in root.iterdir() if x.is_file()):
              h.update(p.name.encode()+b'\0'+p.read_bytes()+b'\0')
          Path('RAW_DIR_SHA256.txt').write_text(h.hexdigest()+'\n')
          print('RAW_DIR_SHA256',h.hexdigest())
          PY

      - name: Three sequential full replays on same runner and same raw bytes
        run: |
          for i in 1 2 3; do
            echo "=== SAME RUNNER TRIAL $i ==="
            python gap_analysis/src/replay_repeat_snapshot.py \
              --raw "$RAW_DIR" \
              --compare-script holdout70/v2_canonical_same_source_compare.py \
              --out "_same_$i"
            cp RAW_DIR_SHA256.txt "_same_$i/original149/RAW_DIR_SHA256.txt"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: determinism-same-runner
          retention-days: 90
          if-no-files-found: error
          path: |
            _same_1/original149/RESULT.json
            _same_1/original149/DAILY_LEADERS.csv
            _same_1/original149/ENSEMBLE_FIT_AUDIT.csv
            _same_1/original149/RAW_DIR_SHA256.txt
            _same_2/original149/RESULT.json
            _same_2/original149/DAILY_LEADERS.csv
            _same_2/original149/ENSEMBLE_FIT_AUDIT.csv
            _same_2/original149/RAW_DIR_SHA256.txt
            _same_3/original149/RESULT.json
            _same_3/original149/DAILY_LEADERS.csv
            _same_3/original149/ENSEMBLE_FIT_AUDIT.csv
            _same_3/original149/RAW_DIR_SHA256.txt

  summarize:
    needs: [cross_runner, same_runner]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          path: _collected

      - name: Build determinism report
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json

          def fh(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def one(root, label):
              p=next(Path(root).rglob('RESULT.json'))
              r=json.loads(p.read_text())
              base=p.parent
              m=r['v2_full_universe']; s=r['source_only']
              return {
                'trial':label,
                'cagr':m['cagr'],'maxdd':m['maxdd'],'sharpe':m['sharpe'],
                'terminal_equity':m['terminal_equity'],'annualized_turnover':m['annualized_turnover'],
                'titanium_sha256':s['titanium_full_sha256'],
                'predictions_sha256':s['predictions_sha256'],
                'ma3_panel_sha256':s['ma3_panel_sha256'],
                'daily_leaders_sha256':fh(base/'DAILY_LEADERS.csv'),
                'raw_dir_sha256':(base/'RAW_DIR_SHA256.txt').read_text().strip(),
              }
          cross=[]
          for i in (1,2,3):
              cross.append(one(Path('_collected')/f'determinism-cross-{i}',i))
          seqroot=Path('_collected')/'determinism-same-runner'
          seq=[]
          for i in (1,2,3):
              root=seqroot/f'_same_{i}'/'original149'
              r=json.loads((root/'RESULT.json').read_text())
              m=r['v2_full_universe']; s=r['source_only']
              seq.append({
                'trial':i,'cagr':m['cagr'],'maxdd':m['maxdd'],'sharpe':m['sharpe'],
                'terminal_equity':m['terminal_equity'],'annualized_turnover':m['annualized_turnover'],
                'titanium_sha256':s['titanium_full_sha256'],
                'predictions_sha256':s['predictions_sha256'],
                'ma3_panel_sha256':s['ma3_panel_sha256'],
                'daily_leaders_sha256':fh(root/'DAILY_LEADERS.csv'),
                'raw_dir_sha256':(root/'RAW_DIR_SHA256.txt').read_text().strip(),
              })
          def summarize(rows):
              c=[x['cagr'] for x in rows]
              return {
                'rows':rows,
                'cagr_min':min(c),'cagr_max':max(c),
                'cagr_span_pp':100*(max(c)-min(c)),
                'unique_raw_hashes':len(set(x['raw_dir_sha256'] for x in rows)),
                'unique_titanium_hashes':len(set(x['titanium_sha256'] for x in rows)),
                'unique_ma3_panel_hashes':len(set(x['ma3_panel_sha256'] for x in rows)),
                'unique_prediction_hashes':len(set(x['predictions_sha256'] for x in rows)),
                'unique_daily_leaders_hashes':len(set(x['daily_leaders_sha256'] for x in rows)),
              }
          cr=summarize(cross); sr=summarize(seq)
          raw_ok=cr['unique_raw_hashes']==1 and sr['unique_raw_hashes']==1 and cross[0]['raw_dir_sha256']==seq[0]['raw_dir_sha256']
          out={
            'status':'CANONICAL_V2_DETERMINISM_CONTROL_V1_COMPLETE',
            'raw_byte_identity_across_all_six_replays':raw_ok,
            'cross_runner':cr,
            'same_runner_sequential':sr,
            'interpretation':{
              'cross_runner_material_instability':cr['cagr_span_pp']>=2.0,
              'same_runner_material_instability':sr['cagr_span_pp']>=2.0,
              'same_runner_economically_stable':sr['cagr_span_pp']<=0.25,
              'strict_determinism_pass_same_runner':(
                 sr['cagr_span_pp']<1e-8 and sr['unique_titanium_hashes']==1 and
                 sr['unique_ma3_panel_hashes']==1 and sr['unique_prediction_hashes']==1 and
                 sr['unique_daily_leaders_hashes']==1),
            },
            'source_contract':'canonical V2 Git blobs gate passed in all jobs',
            'raw_contract':'all six replays use byte-identical _repeat2 from run 37121749852',
          }
          dest=Path('gap_analysis/results/canonical_v2_determinism_control_v1')
          dest.mkdir(parents=True,exist_ok=True)
          (dest/'RESULT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Persist report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin research/evidence-v2
          git add gap_analysis/results/canonical_v2_determinism_control_v1/RESULT.json
          git commit -m 'Persist canonical V2 determinism control result' || true
          git push origin HEAD:research/evidence-v2

      - uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-determinism-control-v1-summary
          retention-days: 90
          path: gap_analysis/results/canonical_v2_determinism_control_v1/RESULT.json
