name: OLC100 diagnose source coverage exceptions
on:
  push:
    branches:
      - research/olc100-forward-freeze-20261112
    paths:
      - '.github/workflows/olc100-diagnose-yahoo.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.2.6' 'pandas==2.2.3' 'yfinance==0.2.66'
      - run: python research/olc100/diagnose_yahoo.py --asof 2026-11-12 --out diagnostic_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olc100-yahoo-source-diagnostics
          path: diagnostic_out/
          retention-days: 60
