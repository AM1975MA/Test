name: Regenerate Titanium Live Package
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  full-package:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Reconstruct and verify source files
        run: |
          mkdir -p upstream/gzpayload upstream/reconstruction
          for f in gz_00.b64 gz_01.b64 gz_02.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-source-faithful-20260803/gzpayload/$f" -o "upstream/gzpayload/$f"; done
          cat upstream/gzpayload/gz_*.b64 | base64 -d | gzip -dc > upstream/titanium_retrained_current_data_audit.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  upstream/titanium_retrained_current_data_audit.py' | sha256sum -c -
          for f in rv5_00.b64 rv5_01.b64 rv5_02.b64 rv5_04.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/reconstruction/$f"; done
          for f in rv5_03a.b64 rv5_03b.b64 rv5_03c.b64 rv5_03d.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/reconstruction/$f"; done
          cat upstream/reconstruction/rv5_00.b64 upstream/reconstruction/rv5_01.b64 upstream/reconstruction/rv5_02.b64 upstream/reconstruction/rv5_03a.b64 upstream/reconstruction/rv5_03b.b64 upstream/reconstruction/rv5_03c.b64 upstream/reconstruction/rv5_03d.b64 upstream/reconstruction/rv5_04.b64 | base64 -d | gzip -dc > upstream/titanium_reconstruction_v5.py
          echo 'ba99f9ce08d96e6b56567d44bf18b5caa7a76ccf13a7d44546e6d1416d79d65a  upstream/titanium_reconstruction_v5.py' | sha256sum -c -
          sed -i 's/@njit(cache=True)/@njit(cache=False)/g; s/@njit(parallel=True,cache=True)/@njit(parallel=True,cache=False)/g' upstream/titanium_reconstruction_v5.py
          python -m py_compile upstream/*.py regeneration/regenerate_live_package.py regeneration/postprocess_validation.py
      - name: Download ticker OHLCV matrices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/8839840705/zip -o prior.zip
          mkdir prior && unzip -q prior.zip -d prior
          for f in OPEN HIGH LOW CLOSE VOLUME; do test -s "prior/titanium_retrained_output/${f}.parquet"; done
          sha256sum prior/titanium_retrained_output/{OPEN,HIGH,LOW,CLOSE,VOLUME}.parquet > INPUT_PARQUET_SHA256.txt
      - name: Full 360-tree walk-forward and package generation
        env:
          NUMBA_CACHE_DIR: /tmp/numba-cache
        run: |
          rm -rf __pycache__ upstream/__pycache__ regeneration/__pycache__ /tmp/numba-cache outputs
          mkdir -p outputs
          python regeneration/regenerate_live_package.py \
            --base-module upstream/titanium_retrained_current_data_audit.py \
            --v5-module upstream/titanium_reconstruction_v5.py \
            --data-dir prior/titanium_retrained_output \
            --output-parent outputs \
            --downvol-mode downside_rms \
            --n-estimators 360 \
            --n-baskets 500
      - name: Validate and archive package
        run: |
          python regeneration/postprocess_validation.py \
            --package-dir outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE \
            --mode downside_rms \
            --zip-parent outputs
          cp INPUT_PARQUET_SHA256.txt outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/manifest/
          test -f outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip
          test -f outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/manifest/MANIFEST.json
          test -f outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/backtest/BASKET_RESULTS.csv
          test -f outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/backtest/GLOBAL_SCORECARD.csv
          test -f outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/panels/OOS_TICKER_SCORES.parquet
          test -f outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/panels/OPPORTUNITY_OOS_PANEL.parquet
          test -f outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/models/MODEL_MANIFEST.json
          sha256sum outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip > outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.sha256
          cat outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE
          path: |
            outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip
            outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.sha256
            outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/backtest/
            outputs/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE/manifest/
          retention-days: 14
