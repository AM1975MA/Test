name: Titanium Base Exact Parity
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  base-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      NUMBA_DISABLE_CACHING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen-compatible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Reconstruct verified legacy constants and exact production parity sources
        run: |
          mkdir -p upstream/gzpayload
          for f in gz_00.b64 gz_01.b64 gz_02.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-source-faithful-20260803/gzpayload/$f" -o "upstream/gzpayload/$f"; done
          cat upstream/gzpayload/gz_*.b64 | base64 -d | gzip -dc > upstream/titanium_retrained_current_data_audit.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  upstream/titanium_retrained_current_data_audit.py' | sha256sum -c -
          base64 -d regeneration/exact_base_overlay.py.gz.b64 | gzip -dc > upstream/exact_base_overlay.py
          echo '6efba567b9998cfd43c34d2af148f162ff1ab032d14984948b12b3ee5e161122  upstream/exact_base_overlay.py' | sha256sum -c -
          base64 -d regeneration/titanium_base_parity_exact.py.gz.b64 | gzip -dc > titanium_base_parity_exact.py
          echo '7f385ffe91b44fe25cf8652a32ce917a9a06a65159ed3cba735c700f78c7c63c  titanium_base_parity_exact.py' | sha256sum -c -
          sed -i 's/@njit(cache=True)/@njit(cache=False)/g; s/@njit(parallel=True,cache=True)/@njit(parallel=True,cache=False)/g' titanium_base_parity_exact.py
          python -m py_compile upstream/*.py titanium_base_parity_exact.py
      - name: Download existing ticker OHLCV matrices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/8839840705/zip -o prior.zip
          mkdir prior && unzip -q prior.zip -d prior
          for f in OPEN HIGH LOW CLOSE VOLUME; do test -s "prior/titanium_retrained_output/${f}.parquet"; done
      - name: Run exact Base parity full walk-forward
        run: |
          python titanium_base_parity_exact.py \
            --base-module upstream/exact_base_overlay.py \
            --data-dir prior/titanium_retrained_output \
            --output TITANIUM_BASE_PARITY_EXACT
      - name: Quantitative parity summary
        run: |
          python - <<'PY'
          import pandas as pd, json
          r=pd.read_csv('TITANIUM_BASE_PARITY_EXACT/BASKET_RESULTS.csv')
          b=r[r.strategy=='BASE']
          g=pd.read_csv('TITANIUM_BASE_PARITY_EXACT/GLOBAL_SCORECARD.csv')
          frozen=.2165406437471759
          out={'base_mean_cagr':float(b.cagr.mean()),'base_median_cagr':float(b.cagr.median()),'delta_vs_frozen_pp':float((b.cagr.mean()-frozen)*100),'n_baskets':int(b.basket.nunique()),'global':g.to_dict('records')}
          open('BASE_PARITY_SUMMARY.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Archive
        if: always()
        run: zip -r TITANIUM_BASE_PARITY_EXACT.zip TITANIUM_BASE_PARITY_EXACT BASE_PARITY_SUMMARY.json titanium_base_parity_exact.py upstream/exact_base_overlay.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_BASE_PARITY_EXACT
          path: |
            TITANIUM_BASE_PARITY_EXACT.zip
            TITANIUM_BASE_PARITY_EXACT/REPORT.md
            TITANIUM_BASE_PARITY_EXACT/BASKET_RESULTS.csv
            TITANIUM_BASE_PARITY_EXACT/GLOBAL_SCORECARD.csv
            TITANIUM_BASE_PARITY_EXACT/OOS_TICKER_SCORES.parquet
            TITANIUM_BASE_PARITY_EXACT/FIT_AUDIT.csv
            TITANIUM_BASE_PARITY_EXACT/MACRO_GATE_AUDIT.csv
            BASE_PARITY_SUMMARY.json
          retention-days: 14
