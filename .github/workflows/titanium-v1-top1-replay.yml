name: Titanium V1 pure top1 replay

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/replay_v1_top1_from_artifact.py'
      - '.github/workflows/titanium-v1-top1-replay.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 numba pyarrow matplotlib
      - uses: actions/download-artifact@v4
        with:
          name: TITANIUM_PLATINUM_COMPACT_EXACT_TAIL_CVAR
          path: best
          repository: AM1975MA/Test
          run-id: 31647358105
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay frozen V1
        run: |
          ROOT=$(dirname "$(find best -name OOS_TICKER_SCORES.parquet | head -1)")
          EXEC=$(find best -path '*/source/exact_execution.py' | head -1)
          python titanium_training_native/replay_v1_top1_from_artifact.py --root "$ROOT" --execution-source "$EXEC" --output results
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_V1_SOURCE_FAITHFUL_TOP1_REPLAY
          path: results
          retention-days: 30
