name: Evidence V4 freeze Dev60

on:
  push:
    branches: [ research/evidence-v4 ]
    paths:
      - 'evidence_v4/protocols/DEV60_FREEZE_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-dev60:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence-v4
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Fail-closed source and preregistration gate
        run: |
          set -euo pipefail
          test "$(git hash-object evidence_v4/src/freeze_dev60.py)" = "502cb0f0686309a16dfcfce7919419bd9b0a2815"
          test "$(git hash-object evidence_v4/protocols/DEV60_FREEZE_PREREG.md)" = "20a97ec222cbd72254f23c920b3f1b6da78ed40a"
          test "$(git hash-object evidence_v3/src/freeze_dev72.py)" = "0fc474e657975e11faf56629c3e98114dc09c796"
          echo "412e577eab42cf9978fe57d6e42c62f9959aa0e46667ee5070aa3a788b9b5778  evidence_v3/data/dev72/universe.csv" | sha256sum -c -
          python -m py_compile evidence_v4/src/freeze_dev60.py
          test ! -e evidence_v4/data/dev60

      - name: Install pinned freeze environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 yfinance==0.2.66

      - name: Freeze Dev60 without performance use
        run: |
          rm -rf _evidence_v4_dev60
          python evidence_v4/src/freeze_dev60.py \
            --v3-freezer evidence_v3/src/freeze_dev72.py \
            --original149 evidence_v1/data/original149/universe.csv \
            --holdout70 evidence_v1/data/holdout70/universe.csv \
            --eu110 evidence_v3/reference/EU110_TESTED.csv \
            --dev72 evidence_v3/data/dev72/universe.csv \
            --out _evidence_v4_dev60

      - name: Build provenance
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          import numpy,pandas,yfinance
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          out=Path('_evidence_v4_dev60')
          m=json.loads((out/'manifest.json').read_text())
          if m['selected_count'] != 60 or m['intersection_with_burned_union'] != [] or m['performance_used_for_selection'] is not False:
              raise SystemExit('Dev60 manifest gate failed')
          p={
            'line':'Evidence V4','dataset':'Dev60','status':'FROZEN_NO_PERFORMANCE_TEST',
            'git_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'freezer_git_blob':subprocess.check_output(['git','hash-object','evidence_v4/src/freeze_dev60.py'],text=True).strip(),
            'preregistration_git_blob':subprocess.check_output(['git','hash-object','evidence_v4/protocols/DEV60_FREEZE_PREREG.md'],text=True).strip(),
            'v3_candidate_source_git_blob':subprocess.check_output(['git','hash-object','evidence_v3/src/freeze_dev72.py'],text=True).strip(),
            'manifest_sha256':h(out/'manifest.json'),'universe_sha256':h(out/'universe.csv'),
            'coverage_sha256':h(out/'coverage.csv'),'rejected_sha256':h(out/'rejected.csv'),
            'network_used_only_for_data_freeze':True,'performance_test_executed':False,
            'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,'yfinance':yfinance.__version__}
          (out/'PROVENANCE.json').write_text(json.dumps(p,indent=2)+'\n')
          print(json.dumps(p,indent=2))
          PY

      - name: Persist frozen Dev60 in branch
        run: |
          set -euo pipefail
          mkdir -p evidence_v4/data/dev60
          cp -r _evidence_v4_dev60/* evidence_v4/data/dev60/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_v4/data/dev60
          git commit -m "Freeze Evidence V4 Dev60 universe"
          git pull --rebase origin research/evidence-v4
          git push origin HEAD:research/evidence-v4

      - name: Upload frozen Dev60
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v4-dev60-frozen
          retention-days: 90
          if-no-files-found: error
          path: evidence_v4/data/dev60/
