name: V2_PRE2017_HISTORY_RETENTION_GATE
on:
  push:
    branches: [research/v2-history-retention-gate-20261011]
    paths: [.github/workflows/v2-history-retention-gate.yml]
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
      - name: Recover original feature snapshots
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 38094232042 -R ${{ github.repository }} -n compact21-two-alpha-panels-v1 -D _panels
      - name: Map 2017 training feature eligibility without removing historical data
        run: python data_quality_audit_v1/pre2017_training_retention.py
      - uses: actions/upload-artifact@v4
        with: {name: v2-pre2017-history-retention-gate, path: _report/}
