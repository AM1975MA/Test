name: ETF V3 L10.E4 strict chronological calibration of frozen E3
on:
  push:
    branches: [research-v3-l10e4-chronocal-20261022]
    paths:
      - 'etf-trader-v3 corrected/experiments/l10_postrank_trajectory/START_E4.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen evaluation packages
        run: pip install numpy==2.2.6 pandas==2.2.3 scikit-learn==1.7.2
      - name: Certified OHLCV, frozen original ML, and immutable E3 OOT scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/l10_frozen runs/l10_e3_archive
          gh run download 39482809691 --repo AM1975MA/Test --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          gh run download 39700865721 --repo AM1975MA/Test --name v3-l10-topk5-risk-tier-results --dir runs/l10_frozen
          gh run download 39752940429 --repo AM1975MA/Test --name v3-l10e3-pair-review --dir runs/l10_e3_archive
          python regeneration/certify_etf_trader_raw.py
          test -s runs/l10_frozen/OOS_SCORES.csv
          test -s runs/l10_e3_archive/PAIR_MODEL_PREDICTION_AUDIT.csv
      - name: Test fixed annual past-mature-only calibration; unchanged E3 probabilities
        run: |
          OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 OMP_NUM_THREADS=1 python \
            'etf-trader-v3 corrected/experiments/l10_postrank_trajectory/evaluate_e4.py' \
            --raw etf_trader_raw \
            --scores runs/l10_frozen/OOS_SCORES.csv \
            --e3-pairs runs/l10_e3_archive/PAIR_MODEL_PREDICTION_AUDIT.csv \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out runs/l10_postrank_e4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l10e4-chronological-calibration
          path: runs/l10_postrank_e4/
          retention-days: 90
