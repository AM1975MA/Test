name: COMPACT21_RBF_RIDGE_INDEPENDENT_VERIFY
on:
  push:
    branches: [research/compact21-rbf-ridge-verify-v1]
    paths: [.github/workflows/compact21-rbf-ridge-verify-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: 'Haswell'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Original frozen dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Recover all original ZIPs and frozen data; no fitting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/rbf-results work/rbf_trial outputs
          ln -s "$GITHUB_WORKSPACE" work/repo
          cp research_helpers/rbf_export_final.py work/rbf_trial/export_final.py
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37516077717/artifacts?per_page=100" > work/rbf-results/MANIFEST.json
          python - <<'PY'
          import json, subprocess, hashlib, zipfile, os, re
          from pathlib import Path, PurePosixPath
          root = Path('work/rbf-results')
          for a in json.loads((root/'MANIFEST.json').read_text())['artifacts']:
              assert re.fullmatch(r'rbf-ridge-(20(1[7-9]|2[0-6])|validation|summary)', a['name'])
              p = root/(a['name']+'.zip')
              with p.open('wb') as out:
                  subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{a['id']}/zip"],stdout=out,check=True)
              assert 'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest() == a['digest']
              with zipfile.ZipFile(p) as z:
                  for name in z.namelist():
                      q = PurePosixPath(name)
                      assert not q.is_absolute() and '..' not in q.parts and ':' not in name and chr(92) not in name
                  z.extractall(root/a['name'])
          PY
          gh run download 37150436612 -R "$GITHUB_REPOSITORY" -n titanium-internal-fixed-repeat-1 -D work/ti/r1
          gh run download 37150436612 -R "$GITHUB_REPOSITORY" -n titanium-internal-fixed-repeat-2 -D work/ti/r2
          gh run download 37150436612 -R "$GITHUB_REPOSITORY" -n titanium-internal-fixed-repeat-3 -D work/ti/r3
          gh run download 37229180477 -R "$GITHUB_REPOSITORY" -n predictive-BASE -D work/predictive-v2/predictive-BASE
          gh run download 37229180477 -R "$GITHUB_REPOSITORY" -n predictive-RIDGE -D work/predictive-v2/predictive-RIDGE
          gh run download 37512359380 -R "$GITHUB_REPOSITORY" -n blockbag-summary -D outputs/_blockbag_prerequisite
          cp outputs/_blockbag_prerequisite/SUMMARY.json outputs/BLOCKBAG_V1_SUMMARY.json
      - name: Original exact projection, state, vector and gate verification; no fitting
        run: |
          set -o pipefail
          python work/rbf_trial/export_final.py --run 37516077717 | tee outputs/RBF_RIDGE_INDEPENDENT_VERIFICATION.txt
          cp work/rbf-results/MANIFEST.json outputs/RBF_RIDGE_ORIGINAL_ARTIFACT_MANIFEST.json
          python - <<'PY'
          import json, sys, os, hashlib
          from pathlib import Path
          import numpy as np
          p = Path('outputs/RBF_RIDGE_LINUX_VERIFICATION.json')
          r = dict(status='EXACT_LINUX_VERIFICATION_PASS', original_run=37516077717,
                   original_commit='f6cd13a6e868abadc1c77970200672ab052c2a57', verification_commit=os.environ['GITHUB_SHA'],
                   verification_run=os.environ['GITHUB_RUN_ID'], python=sys.version, numpy=np.__version__, financial_fits_performed=0,
                   original_frozen_validator_unchanged=True, original_projection_byte_gate_unchanged=True,
                   helper_sha256=hashlib.sha256(Path('research_helpers/rbf_export_final.py').read_bytes()).hexdigest())
          p.write_text(json.dumps(r,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbf-ridge-independent-verification
          retention-days: 90
          path: outputs/RBF_RIDGE*
