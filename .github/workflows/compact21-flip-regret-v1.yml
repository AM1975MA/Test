name: COMPACT21_FLIP_REGRET_V1
on:
  push:
    branches: [research/compact21-flip-regret-v1]
    paths: [.github/workflows/compact21-flip-regret-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: 'Haswell'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  descriptive_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Frozen numerical/read profile
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Tests for score margin and outcome maturity
        run: python -m unittest discover -s compact21_flip_regret_v1/tests -v
      - name: Retrieve original attribution, independent summary and Repeat2 outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37916159772 -R ${{ github.repository }} -p 'attribution-20*' -D _years
          gh run download 37931212920 -R ${{ github.repository }} -n attribution-summary-recovery -D _reference
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-2 -D _ti/r2
          for year in {2017..2026}; do
            test -f "_years/attribution-${year}/RESULT.json"
            test -f "_years/attribution-${year}/PREDICTIONS.parquet"
          done
      - name: Read-only pairwise Top1 score margins and mature forward-return differences
        run: python -m compact21_flip_regret_v1.analyze --annuals _years --repeat2 _ti/r2 --reference _reference --out _output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-flip-regret-diagnostic
          retention-days: 90
          path: _output/
