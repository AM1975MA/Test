name: ETF Trader V3 Corrected - L00 feature gate
on:
  push:
    branches: [main]
    paths:
      - 'etf-trader-v3 corrected/src/**'
      - 'etf-trader-v3 corrected/tests/**'
      - 'etf-trader-v3 corrected/experiments/l00_features/evaluate.py'
      - 'etf-trader-v3 corrected/experiments/l00_features/aggregate.py'
      - 'etf-trader-v3 corrected/experiments/l00_features/replay.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  contract:
    name: Validate corrected math and causal feature contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - run: python 'etf-trader-v3 corrected/tests/test_corrected_203_contract.py'

  fitting:
    needs: contract
    name: Predeclared layer 00 yearly folds ${{ matrix.fold }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - {fold: years_2018_2020, years: '2018,2019,2020'}
          - {fold: years_2021_2023, years: '2021,2022,2023'}
          - {fold: years_2024_2026, years: '2024,2025,2026'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - name: Certified frozen ETF original OHLCV and numerical ranking controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/v2_corrected_oracle
          gh run download 39482809691 --repo AM1975MA/Test --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          gh run download 39515716383 --repo AM1975MA/Test --name v2-formula-retrain-complete --dir runs/v2_corrected_oracle
          python regeneration/certify_etf_trader_raw.py
          test -s runs/v2_corrected_oracle/OOS_SCORES.csv
      - name: Refit corrected L00 regimes with identical original dates and labels
        run: |
          python 'etf-trader-v3 corrected/experiments/l00_features/evaluate.py' \
            --raw etf_trader_raw \
            --prior runs/v2_corrected_oracle \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --years '${{ matrix.years }}' \
            --arms V3_GATE128,V3_CONDSTD128 \
            --out 'runs/v3_l00_shards/${{ matrix.fold }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l00-${{ matrix.fold }}
          path: runs/v3_l00_shards/
          if-no-files-found: warn
          retention-days: 90

  finish:
    needs: fitting
    name: Paired rankings, basket trading, gate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: v3-l00-years_*
          merge-multiple: true
          path: runs/v3_l00_shards/
      - name: Match all 101 matured months, audit feature and bootstrap
        run: |
          python 'etf-trader-v3 corrected/experiments/l00_features/aggregate.py' \
            --root runs/v3_l00_shards \
            --out runs/v3_l00_complete
      - name: Reload original raw OHLCV for execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw
          gh run download 39482809691 --repo AM1975MA/Test --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          python regeneration/certify_etf_trader_raw.py
      - name: Identical next-open 10bp-cost economic replay
        run: |
          python 'etf-trader-v3 corrected/experiments/l00_features/replay.py' \
            --raw etf_trader_raw \
            --scores runs/v3_l00_complete/OOS_SCORES.csv \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out runs/v3_l00_economics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l00-complete-paired-rank-and-economics
          path: |
            runs/v3_l00_complete/
            runs/v3_l00_economics/
            certification/
          if-no-files-found: warn
          retention-days: 90
