name: LISTNET_MONTHLY_CHARTS_ONLY_NOFIT
on:
  push:
    branches: [research/listnet-monthly-20261014]
    paths: [.github/workflows/listnet-monthly-chart-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'matplotlib==3.10.8'
      - name: Reuse completed economic paths only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38611937261 -R AM1975MA/Test -n listnet-monthly-comparison -D _monthly
          gh run download 38580178650 -R AM1975MA/Test -n listnet-linear-relative-repair -D _annual
          mkdir -p _replays
          cp -r _monthly/_replays/* _replays/
          cp -r _annual/_replays/* _replays/
      - name: Verify chart arithmetic, export and JSON provenance
        run: |
          python -m unittest discover -s paper_ltr_monthly_v1/tests -v
          python paper_ltr_monthly_v1/plot_years.py --replays _replays --out _charts_fixed
          python -c "import json; from pathlib import Path; r=json.loads(Path('_charts_fixed/CHART_PROVENANCE.json').read_text()); assert r['rows']==90 and r['all_calendars_identical'] and r['annual_decomposition_reconciles']; print('ALL_90_YEARLY_RETURNS_AND_CHART_EXPORTS_VERIFIED')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listnet-monthly-charts-verified
          retention-days: 90
          path: _charts_fixed/
