name: V3 payoff-sensitive decision forest and boosted tree comparison
on:
  push:
    branches: [research-v3-meta-tree-ensemble-20261024]
    paths:
      - 'etf-trader-v3 corrected/experiments/l00_rank_reg_fusion/PAYOFF_START.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        family: [DT_PAYOFF, DT_LOSS, RF_PAYOFF, XGB_PAYOFF, CAT_PAYOFF, LGB_PAYOFF]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin relevant ML stack
        run: |
          pip install 'numpy==2.2.6' 'pandas==2.2.3' 'scikit-learn==1.9.1' 'xgboost==3.0.5'
          if [ "${{ matrix.family }}" = "LGB_PAYOFF" ]; then pip install 'lightgbm==4.6.0'; fi
          if [ "${{ matrix.family }}" = "CAT_PAYOFF" ]; then pip install 'catboost==1.2.8'; fi
      - name: Rehydrate frozen per-ETF OOS predictions and canonical baskets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/v3_rrf
          for shard in s1 s2 s3; do
            gh run download 40016809498 -R AM1975MA/Test -n rrf-regression-$shard -D runs/v3_rrf
          done
      - name: Test pairwise payoff-aware but time-causal trees
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -u 'etf-trader-v3 corrected/experiments/l00_rank_reg_fusion/payoff_weighted_tree_bakeoff.py' \
            --family '${{ matrix.family }}' --shards runs/v3_rrf \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out 'runs/v3_payoff_tree_${{ matrix.family }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-meta-payoff-tree-${{ matrix.family }}
          path: runs/v3_payoff_tree_${{ matrix.family }}/
          retention-days: 90
