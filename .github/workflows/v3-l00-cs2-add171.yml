name: "V3 L00 cross-sectional daily-asof add original125 plus 46 daily crosssectional features annual ranker refit"
on:
  push:
    branches: [research-v3-l00-relative-additive171-20261023]
    paths:
      - 'etf-trader-v3 corrected/experiments/l00_cs_add171/START_EVALUATION.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: s1, years: '2018,2019,2020'}
          - {shard: s2, years: '2021,2022,2023'}
          - {shard: s3, years: '2024,2025,2026'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Freeze exact previously working XGBoost numerical environment
        run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'xgboost==3.0.5' scipy scikit-learn matplotlib tabulate
      - name: Exact original 149 OHLCV and canonical 500 baskets; immutable corrected ranker control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/v2_corrected_oracle
          gh run download 39482809691 --repo AM1975MA/Test --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          gh run download 39515716383 --repo AM1975MA/Test --name v2-formula-retrain-complete --dir runs/v2_corrected_oracle
          python regeneration/certify_etf_trader_raw.py
          test -s runs/v2_corrected_oracle/OOS_SCORES.csv
      - name: Test no-lookahead cross-section contract and refit original 125 plus 46 relative Pairwise127
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          python 'etf-trader-v3 corrected/experiments/l00_cs_add171/normalize.py'
          python -u 'etf-trader-v3 corrected/experiments/l00_cs_add171/evaluate.py' \
            --years '${{ matrix.years }}' \
            --raw etf_trader_raw \
            --prior runs/v2_corrected_oracle \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out runs/v3_l00_cs2_shards/${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l00-cs-${{ matrix.shard }}
          path: runs/v3_l00_cs2_shards/
          retention-days: 90
  aggregate:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: l00-cs2-s*
          merge-multiple: true
          path: runs/v3_l00_cs2_shards/
      - name: Verify 101 matched OOS months and rank skill 500 baskets
        run: |
          python -u 'etf-trader-v3 corrected/experiments/l00_cs_add171/aggregate.py' \
            --root runs/v3_l00_cs2_shards --out runs/v3_l00_cs2_complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l00-cs2-original125-plus46-results
          path: runs/v3_l00_cs2_complete/
          retention-days: 90
