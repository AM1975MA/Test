name: Hybrid24 top-tail diagnostic 149 vs 70

on:
  push:
    branches: [ research/v2-same-source-149-vs-70-20261002 ]
    paths:
      - '.github/workflows/v2-hybrid24-top-tail-diagnostic.yml'
      - 'holdout70/hybrid24_top_tail_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install locked producer environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/etf_trader_v2/requirements.txt \
            'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' \
            'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'

      - name: Gate exact productive Hybrid24 source blobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exp = {
            'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
            'vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
            'vendor/etf_trader_v2/scripts/build_ma3_panel_source_only.py':'34cc133d4d44bb06cc21363b1444865e2d8ec5c1',
            'vendor/etf_trader_v2/src/etf_trader/source_only/raw_io.py':'0acbfd997be88519d2364ea4611cf20657c7cadd',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223',
            'vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
            'vendor/etf_trader_v2/src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592',
          }
          lf_fix = {
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py',
          }
          for p, want in exp.items():
              got = subprocess.check_output(['git','hash-object',p], text=True).strip()
              if got != want and p in lf_fix:
                  path = Path(p); raw = path.read_bytes()
                  if not raw.endswith(b'\n'):
                      path.write_bytes(raw + b'\n')
                      got = subprocess.check_output(['git','hash-object',p], text=True).strip()
              assert got == want, (p, got, want)
          print('HYBRID24_SOURCE_GATE_PASS')
          PY

      - name: Restore exact frozen raw and Holdout70 producer checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37017429560 -R ${{ github.repository }} \
            -n v2-controlled-fresh-raw-149-70 -D .
          gh run download 37019935712 -R ${{ github.repository }} \
            -n v2-controlled-frozen-fresh-149-vs-70-resume -D _checkpoint70
          test -f _fresh149/etf_trader_raw/manifest.json
          test -f _fresh70/raw_ticker_csv/manifest.json
          test -f _checkpoint70/holdout70/ENSEMBLE_TAIL_OOS.csv
          test -f _checkpoint70/holdout70/ma3_panel/RAW_FEATURE_PANEL.pkl

      - name: Materialize only missing Original149 producer checkpoint
        env:
          FROZEN_149_ROOT: ${{ github.workspace }}/_fresh149
          FROZEN_HOLDOUT70_ROOT: ${{ github.workspace }}/_fresh70
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          python - <<'PY'
          from pathlib import Path
          import holdout70.v2_canonical_same_source_compare as v
          v.OUT.mkdir(parents=True, exist_ok=True)
          s = v.build_source_only_state('original149', v.FROZEN149)
          print('ORIGINAL149_PRODUCER_CHECKPOINT_READY', s['pred_path'], s['ma3_panel_path'])
          PY

      - name: Run top-tail and causal top1-vs-top2 diagnostics
        run: |
          python holdout70/hybrid24_top_tail_diagnostic.py \
            --pred149 holdout70/canonical_same_source_results/original149/ENSEMBLE_TAIL_OOS.csv \
            --panel149 holdout70/canonical_same_source_results/original149/ma3_panel/RAW_FEATURE_PANEL.pkl \
            --pred70 _checkpoint70/holdout70/ENSEMBLE_TAIL_OOS.csv \
            --panel70 _checkpoint70/holdout70/ma3_panel/RAW_FEATURE_PANEL.pkl \
            --out holdout70/hybrid24_top_tail_results

      - name: Show summary
        if: always()
        run: |
          test -f holdout70/hybrid24_top_tail_results/SUMMARY.json && cat holdout70/hybrid24_top_tail_results/SUMMARY.json || true

      - name: Upload diagnostic evidence and reusable 149 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid24-top-tail-diagnostic-149-70
          retention-days: 90
          if-no-files-found: warn
          path: |
            holdout70/hybrid24_top_tail_results/*
            holdout70/canonical_same_source_results/original149/TIT_R_CANDIDATES_ONLY.csv
            holdout70/canonical_same_source_results/original149/ENSEMBLE_TAIL_OOS.csv
            holdout70/canonical_same_source_results/original149/ENSEMBLE_FIT_AUDIT.csv
            holdout70/canonical_same_source_results/original149/ma3_panel/RAW_FEATURE_PANEL.pkl
