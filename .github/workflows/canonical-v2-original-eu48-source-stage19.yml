name: CANONICAL_FULL_ORIGINAL_ETFTRADER_V2_48EU_STAGE19_US_SPY_HYG_IEF_BIL_SHV
on:
  push:
    branches: [research/canonical-v2-source-us149-eu48-20261020]
    paths:
      - '.github/workflows/canonical-v2-original-eu48-source-stage19.yml'
      - 'isin_first2026/canonical_v2_same_period/europe48.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONPATH: .:vendor/etf_trader_v2/src
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  european48-original-full-stage19-not-simplified-MA3:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reinstall frozen original US full stage19 source and true source-only European trained forecast
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'numba==0.63.1'
          python -m py_compile isin_first2026/canonical_v2_same_period/europe48.py
      - name: Restore exact original USD SPY HYG IEF BIL SHV, never as Top1 or Top2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _US149_SOURCE
          for t in SPY HYG IEF BIL SHV; do test -f "_US149_SOURCE/etf_trader_raw/$t.csv"; done
      - name: Restore exact same 48 Europe ISIN archived exchange OHLC without any future quote vendor changes
        run: |
          python -m isin_first2026.v2_unrestricted48.prepare --out _EU48_PREP
          python - <<'PY'
          import json
          x=json.load(open("_EU48_PREP/RESULT.json"))
          assert x["n_unique_isin"]==48 and x["shared_EU48_original_quote_sessions"]==2746
          PY
      - name: Replay TRUE original frozen Stage19 final simulator and original confidence policy on 48 EU eligible ETF sources
        run: |
          python -u -m isin_first2026.canonical_v2_same_period.europe48 --data _EU48_PREP --us _US149_SOURCE --fx europe_only75/f3h1_original_transfer/results/EURUSD_PRIOR_US_CLOSE.csv --out _ORIGINAL_V2_EU48
      - name: Verify exact original 149 Stage19 structural contracts, all 48 ISIN and individual costed daily NAV
        run: |
          python - <<'PY'
          import json,pandas as pd,hashlib
          from pathlib import Path
          p=Path("_ORIGINAL_V2_EU48")
          d=json.loads((p/"RESULT.json").read_text())
          assert d["status"]=="EU48_REAL_ORIGINAL_FULL_V2_STAGE19_SOURCE_STACK_MATCHED_65_MONTHS"
          assert d["original_V2_full_stage19_not_LATER_V6_SIMPLIFIED"]
          assert d["portfolio_one_unrestricted_europe48"]
          assert d["n_european_isins"]==48 and d["n_tradeable_predictive_US_tickers"]==0
          assert d["n_europe_sessions"]==1374 and d["n_months"]==65
          assert len(d["all_cases"])==2
          h=pd.read_csv(p/"ORIGINAL_V2_STAGE19_EU48_MONTHLY_LEADERS.csv")
          assert h.groupby("case").size().eq(65).all() and h["leader_isin"].notna().all()
          nav=pd.read_csv(p/"ORIGINAL_V2_STAGE19_EU48_DAILY_NAV_COSTED.csv")
          assert len(nav)==1374 and nav.notna().all(axis=None)
          for l in (p/"SHA256_MANIFEST.txt").read_text().splitlines():
              digest,path=l.split("  ",1)
              assert hashlib.sha256((p/path).read_bytes()).hexdigest()==digest
          print("SOURCE_STAGE19_EU48_ORIGINAL_V2_SUCCESS",json.dumps(d),flush=True)
          PY
      - name: Save full-source original Stage19 European48 scientific experiment only in TEST
        run: |
          mkdir -p isin_first2026/canonical_v2_same_period/results
          cp _ORIGINAL_V2_EU48/RESULT.json isin_first2026/canonical_v2_same_period/results/EUROPE_48_ORIGINAL_FULL_V2_STAGE19.json
          cp _ORIGINAL_V2_EU48/ORIGINAL_V2_STAGE19_EU48_DAILY_NAV_COSTED.csv isin_first2026/canonical_v2_same_period/results/
          cp _ORIGINAL_V2_EU48/ORIGINAL_V2_STAGE19_EU48_MONTHLY_LEADERS.csv isin_first2026/canonical_v2_same_period/results/
          cp _ORIGINAL_V2_EU48/SHA256_MANIFEST.txt isin_first2026/canonical_v2_same_period/results/EU48_SHA256_MANIFEST.txt
          cp _ORIGINAL_V2_EU48/US_REFERENCE_AUDIT/SOURCE_REFERENCE_AUDIT.json isin_first2026/canonical_v2_same_period/results/
          git config user.name "CANONICAL_V2_US149_EU48_SOURCE_STAGE19"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isin_first2026/canonical_v2_same_period/results
          git commit -m "Execute authentic Stage19 full ETF Trader V2 source on 48 unique Europe ISIN using original US macro, FX defence and true compact fits"
          git pull --rebase origin research/canonical-v2-source-us149-eu48-20261020
          git push origin HEAD:refs/heads/research/canonical-v2-source-us149-eu48-20261020
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FULL_CANONICAL_STAGE19_EU48_V2_COSTED
          retention-days: 90
          path: _ORIGINAL_V2_EU48/
