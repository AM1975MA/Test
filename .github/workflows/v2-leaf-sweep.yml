name: ETF Trader V2 leaf caps 4-8-15-31
on:
  workflow_dispatch:
  push:
    branches:
      - research-v2-leafcaps-20261020
    paths:
      - 'regeneration/v2_leaf_sweep.py'
      - '.github/workflows/v2-leaf-sweep.yml'
jobs:
  v2-leaf-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install original-model and data dependencies
        run: pip install numpy pandas scipy scikit-learn xgboost yfinance
      - name: Download original 149 ETF OHLCV through frozen cutoff
        run: python regeneration/etf_trader_raw.py
      - name: Certify the original basket, 149 ETF prices and source-only inputs
        run: python regeneration/certify_etf_trader_raw.py
      - name: Run unchanged-objective 4/8/15/31-leaf walk-forward against canonical depth-4 model
        run: python regeneration/v2_leaf_sweep.py --raw etf_trader_raw --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv --out runs/v2_leaf_sweep
      - name: Upload audited experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-leaf-caps-results
          path: |
            runs/v2_leaf_sweep/
            certification/
          if-no-files-found: warn
          retention-days: 30
