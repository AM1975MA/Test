name: ORIGINAL149_5D_VOLATILITY_ONLY_NEGATIVE_CONTROLS
on:
  push:
    branches: [research/original149-tcn-listwise-20261020]
    paths: ['.github/workflows/tensor149-risk-only.yml']
permissions: {contents: read}
env:
  PYTHONPATH: '${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  exact-matched-negative-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Frozen numerical stack
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'pyarrow==23.0.1' 'matplotlib==3.10.8' 'xgboost==3.1.3'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Causal feature checks and risk-only exact portfolio comparator
        run: |
          python -m unittest -v tensor149_tcn5d.test_contract
          python -m tensor149_tcn5d.risk_only --out _risk_only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original149-weekly-risk-only-null-controls
          retention-days: 90
          path: _risk_only/
