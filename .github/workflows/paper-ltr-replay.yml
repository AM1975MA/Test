name: PAPER_LTR_REPLAY_V1
on:
  push:
    branches: [research/paper-ltr-feasibility-20261012]
    paths: [.github/workflows/paper-ltr-replay.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        repeat: [1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ambiente congelato e test
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s paper_ltr_v1/tests -v
      - name: Recupero artefatti immutati, nessun nuovo fit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 38179662587 -R AM1975MA/Test --exit-status --interval 30
          gh run download 38179662587 -R AM1975MA/Test -n paper-ltr-feasibility -D _fit
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r${{ matrix.repeat }} -D _base
      - name: Controllo identità BASE e replay della variante ListNet
        run: python paper_ltr_v1/replay.py --raw _raw/_repeat${{ matrix.repeat }} --baseline _base --candidate _fit/_candidate --repeat ${{ matrix.repeat }} --out _replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-ltr-replay-r${{ matrix.repeat }}
          retention-days: 90
          path: _replay/
  summary:
    needs: replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: paper-ltr-replay-r*
          path: _replays
      - name: Confronto indipendente dei tre percorsi
        run: python paper_ltr_v1/summarize_replay.py --inputs _replays --out _results/ECONOMIC_COMPARISON.json
      - name: Verificatore predittivo corretto, senza nuovi fit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38179662587 -R AM1975MA/Test -n paper-ltr-feasibility -D _fit
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _baseline
          python paper_ltr_v1/summarize.py --candidate _fit/_candidate --baseline _baseline --out _results/PREDICTIVE_COMPARISON.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper-ltr-final-comparison
          retention-days: 90
          path: _results/
