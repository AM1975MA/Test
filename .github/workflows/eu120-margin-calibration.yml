name: EU120_FROZEN_MARGIN_FORWARD_CALIBRATION
on:
  pull_request:
    branches: [research/eu120-margin-agreement-weight-factorial-20261017]
    paths: [.github/workflows/eu120-margin-calibration.yml, 'eu120_margin_calibration_v1/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}:${{ github.workspace }}/europe120/eu120_retrain
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen EU120 dependencies and margin unit tests
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'numba==0.65.1' 'threadpoolctl==3.6.0' 'matplotlib==3.10.8'
          python -m py_compile eu120_margin_calibration_v1/run.py
          python -m unittest discover -s eu120_margin_calibration_v1/tests -v
      - name: Fetch certified EU120 score sources, unchanged original pair allocations and external benchmark series
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39064123941 -R AM1975MA/Test -n eu120-compact-return-tail-refit-full -D _pred
          gh run download 39066645910 -R AM1975MA/Test -n eu120-margin-agreement-weight-factorial -D _factorial
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _refs
          for file in RESULT.json COMPACT_REFITTED.parquet HYBRID_REFITTED.parquet TRAINING_AUDIT.csv; do test -s _pred/$file; done
          for file in RESULT.json H_D_M1_A1.npz R_D_M1_A1.npz; do test -s _factorial/$file; done
      - name: Verify frozen 112 as-of margin gaps and observable next-month top1-vs-top2 returns
        run: |
          python eu120_margin_calibration_v1/run.py --source _pred --prior-factorial _factorial --raw149 _refs --out _calibration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eu120-frozen-margin-calibration
          retention-days: 90
          path: |
            _calibration/RESULT.json
            _calibration/MONTHLY_MARGIN_CALIBRATION.csv
            _calibration/YEARLY_MARGIN_CALIBRATION.csv
