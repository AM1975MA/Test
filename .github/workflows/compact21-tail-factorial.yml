name: COMPACT21_TAIL_8ARM_FACTORIAL
on:
  pull_request:
    branches: [research/compact21-return-rank-attribution-20261017]
    paths: [.github/workflows/compact21-tail-factorial.yml, 'compact21_tail_factorial_v1/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  factorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen runtime and unit regression tests
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python -m py_compile compact21_tail_factorial_v1/*.py
          python -m unittest discover -s compact21_tail_factorial_v1/tests -v
          python compact21_stability_v1/source_gate.py
      - name: Retrieve original score sources and certifying full V2 paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _base
          gh run download 39031200131 -R AM1975MA/Test -n compact21-return-predictive -D _rank
          gh run download 39031200131 -R AM1975MA/Test -n compact21-return-economic -D _archive
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          for i in 1 2 3; do
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$i -D _cache/r$i
          done
      - name: Run 24 full V2 economic replays (8 arms x 3 Yahoo snapshots)
        run: |
          python compact21_tail_factorial_v1/run.py --raw _raw --cache _cache --archive _archive --base _base --rank _rank --out _factorial
      - name: Independently verify all original ON/ON parities and factorial contrasts
        run: |
          python compact21_tail_factorial_v1/summarize.py --root _factorial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-tail-factorial-full
          retention-days: 90
          path: _factorial/
