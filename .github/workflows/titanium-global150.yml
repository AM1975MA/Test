name: titanium-global150-live-test
on:
  pull_request:
    branches: [main]
    paths:
      - titanium_global150_live_test.py
      - .github/workflows/titanium-global150.yml
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q yfinance==1.5.1 pandas==2.2.3 numpy==2.2.6 pyarrow==18.1.0 tabulate matplotlib
      - name: Run live-data test
        run: python titanium_global150_live_test.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanium-global150-live-output
          path: |
            titanium_global150_live_output/
            titanium_global150_live_output.zip
          if-no-files-found: warn
# retrigger after base workflow authorization
