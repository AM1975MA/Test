name: Titanium composition gap factorial
on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/postscore_composition_ablation.py'
      - '.github/workflows/titanium-composition-ablation.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 numba pyarrow matplotlib
      - uses: actions/download-artifact@v4
        with:
          name: TITANIUM_TRAINING_NATIVE_V1_CANONICAL
          path: v1
          repository: AM1975MA/Test
          run-id: 31616228523
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python titanium_training_native/postscore_composition_ablation.py --root v1 --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_COMPOSITION_FACTORIAL
          path: results
          retention-days: 30
