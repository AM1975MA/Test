name: COMPACT21_ORTHOGONAL_FEATURE_ABLATION_V1
on:
  push:
    branches: [research/compact21-orthogonal-feature-ablation-v1]
    paths:
      - .github/workflows/compact21-orthogonal-feature-ablation-v1.yml
      - feature_ablation_v1/run_feature_ablation.py
      - feature_ablation_v1/PREREGISTRATION.md
      - feature_ablation_v1/test_feature_ablation.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: compact21-orthogonal-feature-ablation-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  feature_ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Frozen analysis environment
        run: >-
          python -m pip install
          'numpy==2.3.5'
          'pandas==2.2.3'
          'scikit-learn==1.8.0'
          'scipy==1.17.0'
          'pyarrow==23.0.1'
          'xgboost==3.1.3'

      - name: Canonical source and selector unit gates
        run: |
          python compact21_stability_v1/source_gate.py
          python -m unittest feature_ablation_v1/test_feature_ablation.py -v

      - name: Recover frozen three-snapshot Compact21 panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _ti/r1 _ti/r2 _ti/r3 feature_ablation_v1/results
          gh run download 37150436612 -R "${{ github.repository }}" -n titanium-internal-fixed-repeat-1 -D _ti/r1
          gh run download 37150436612 -R "${{ github.repository }}" -n titanium-internal-fixed-repeat-2 -D _ti/r2
          gh run download 37150436612 -R "${{ github.repository }}" -n titanium-internal-fixed-repeat-3 -D _ti/r3
          test -s _ti/r1/TI_COMPACT.parquet
          test -s _ti/r2/TI_COMPACT.parquet
          test -s _ti/r3/TI_COMPACT.parquet

      - name: Feature-only orthogonal information discovery
        run: |
          python feature_ablation_v1/run_feature_ablation.py \
            --r1 _ti/r1 \
            --r2 _ti/r2 \
            --r3 _ti/r3 \
            --out feature_ablation_v1/results/FEATURE_SELECTION.json \
            --summary-md feature_ablation_v1/results/SUMMARY.md

      - name: Fail closed on experiment contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('feature_ablation_v1/results/FEATURE_SELECTION.json')
          r=json.loads(p.read_text())
          assert r['status']=='FEATURE_SELECTION_COMPLETE_NO_FINAL_RANKER_FIT'
          c=r['frozen_constraints']
          assert c['features']==125
          assert c['semantic_families']==46
          assert c['post2017_targets_read'] is False
          assert c['strategy_metrics_read'] is False
          assert c['production_ranker_fit'] is False
          assert set(r['ladders'])=={'K8','K12','K16','K24','K32','K40','FAMILY46'}
          for name,fs in r['ladders'].items():
              assert len(fs)==(46 if name=='FAMILY46' else int(name[1:]))
              assert len(fs)==len(set(fs))
          print('FEATURE_ABLATION_CONTRACT_PASS')
          PY

      - name: Persist frozen feature-selection result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature_ablation_v1/results/FEATURE_SELECTION.json feature_ablation_v1/results/SUMMARY.md
          git commit -m 'Persist preregistered orthogonal Compact21 feature ablation'
          git pull --rebase origin research/compact21-orthogonal-feature-ablation-v1
          git push origin HEAD:research/compact21-orthogonal-feature-ablation-v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-orthogonal-feature-ablation-v1
          retention-days: 90
          path: |
            feature_ablation_v1/PREREGISTRATION.md
            feature_ablation_v1/results/FEATURE_SELECTION.json
            feature_ablation_v1/results/SUMMARY.md
