name: V3 European capacity diagnostic exact EUR costed Top1 portfolio
on:
  push:
    branches:
      - research/v3-europe48-rootcause-leaves-20261024
    paths:
      - 'etf-trader-v3 corrected/experiments/europe48_transfer/CAPACITY_ECON_START.txt'
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:vendor/etf_trader_v2/src
  OPENBLAS_NUM_THREADS: '1'
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact reference original EUR portfolio replay environment
        run: pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'numba==0.65.1' 'pyarrow==23.0.1' 'matplotlib==3.10.8'
      - name: Recover unchanged 48 ETF European snapshot and six leaf diagnostic years
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m isin_first2026.v2_unrestricted48.prepare --out _EU48_PREP
          for year in 2021 2022 2023 2024 2025 2026; do
            mkdir -p "_EU48_CAPACITY/$year"
            gh run download 40112204947 -R AM1975MA/Test \
              -n "v3-europe48-capacity-diagnostic-$year" -D "_EU48_CAPACITY/$year"
            test -s "_EU48_CAPACITY/$year/EUR48_CAPACITY_MONTHLY.csv"
          done
      - name: Reproduce V2 + V3 127 + V3 tree exact real trading and calculate fixed smaller leaf variants
        run: |
          python -u 'etf-trader-v3 corrected/experiments/europe48_transfer/leaf_capacity_real_portfolio.py' \
            --diagnostics _EU48_CAPACITY --prep _EU48_PREP \
            --out _EU48_CAPACITY_PORTFOLIO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-europe48-capacity-exact-portfolio
          path: _EU48_CAPACITY_PORTFOLIO/
          retention-days: 90
