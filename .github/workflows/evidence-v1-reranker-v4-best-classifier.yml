name: Evidence V1 reranker v4 best classifier

on:
  push:
    branches: [ research/evidence-v1 ]
    paths:
      - '.github/workflows/evidence-v1-reranker-v4-best-classifier.yml'
      - 'evidence_v1/protocols/RERANKER_V4_BEST_CLASSIFIER_PREREG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reranker-v4-best-classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Fail-closed preregistration and frozen-state gate
        run: |
          set -euo pipefail
          test "$(git hash-object evidence_v1/src/reranker_v4_best_classifier.py)" = "e98ec05f459b27cb33d5e390998432abc456027b"
          test "$(git hash-object evidence_v1/protocols/RERANKER_V4_BEST_CLASSIFIER_PREREG.md)" = "bd0f6e0e2df20e54555733a1ce7e6902a6d6aeca"
          test "$(git hash-object evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py)" = "34cc133d4d44bb06cc21363b1444865e2d8ec5c1"
          test "$(git hash-object evidence_v1/source/baseline/etf_trader_v2/src/etf_trader/ma3/producer.py)" = "e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592"
          test "$(git hash-object evidence_v1/checkpoints/retriever_ltr_v1/CHECKPOINT_MANIFEST.json)" = "e51a8651f6696a0081acb09e3ed230e7e35fd79c"
          test "$(git hash-object evidence_v1/checkpoints/retriever_ltr_v1/TOP10.csv)" = "cd2ae12a5223feda0ec1306d824d426dbbbb7550"
          test "$(git hash-object evidence_v1/checkpoints/retriever_ltr_v1/OOS_PREDICTIONS.csv)" = "1745a6d12b6957bc629998c7ac3417550ac9bceb"
          echo "3f9e054fdc0716161cec185ad5a32a62671ad3032070b9ca24ceed655011abd6  evidence_v1/checkpoints/retriever_ltr_v1/OOS_PREDICTIONS.csv" | sha256sum -c -
          echo "1efba2bc213ba26b042a9e77630fe26664343654629e658f43d314d068ba9e71  evidence_v1/DATA_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "cc4d315da68ec42275a7a74f05446ac6cbb484c3bd92a7861cd76805c5a94782  evidence_v1/SOURCE_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "01305fe62203c7b7895d95836267c4288f86d2c5a763ce7070c9c3d3d9f807ae  evidence_v1/requirements.lock.txt" | sha256sum -c -
          (cd evidence_v1/data && sha256sum -c ../DATA_MANIFEST_SHA256.txt)
          (cd evidence_v1/source && sha256sum -c ../SOURCE_MANIFEST_SHA256.txt)
          python -m py_compile evidence_v1/src/reranker_v4_best_classifier.py

      - name: Install locked numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r evidence_v1/requirements.lock.txt

      - name: Rebuild frozen Original149 reference panel
        env:
          PYTHONPATH: ${{ github.workspace }}/evidence_v1/source/baseline/etf_trader_v2/src
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          rm -rf _evidence_v1_rr4
          mkdir -p _evidence_v1_rr4/panel149 _evidence_v1_rr4/result
          python evidence_v1/source/baseline/etf_trader_v2/scripts/build_ma3_panel_source_only.py \
            --data evidence_v1/data/original149 \
            --cluster-data evidence_v1/data/original149 \
            --output _evidence_v1_rr4/panel149

      - name: Run preregistered best-in-shortlist classifier v4
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: |
          python evidence_v1/src/reranker_v4_best_classifier.py \
            --panel _evidence_v1_rr4/panel149/RAW_FEATURE_PANEL.pkl \
            --checkpoint evidence_v1/checkpoints/retriever_ltr_v1 \
            --frozen-source evidence_v1/source/baseline/etf_trader_v2 \
            --out _evidence_v1_rr4/result

      - name: Build provenance and final manifest
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          import numpy,pandas,sklearn,xgboost
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          r=Path('_evidence_v1_rr4/result')
          p={
            'line':'Evidence V1','test':'reranker_v4_best_classifier',
            'git_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'evaluator_git_blob':subprocess.check_output(['git','hash-object','evidence_v1/src/reranker_v4_best_classifier.py'],text=True).strip(),
            'preregistration_git_blob':subprocess.check_output(['git','hash-object','evidence_v1/protocols/RERANKER_V4_BEST_CLASSIFIER_PREREG.md'],text=True).strip(),
            'data_manifest_sha256':h('evidence_v1/DATA_MANIFEST_SHA256.txt'),
            'source_manifest_sha256':h('evidence_v1/SOURCE_MANIFEST_SHA256.txt'),
            'requirements_sha256':h('evidence_v1/requirements.lock.txt'),
            'retriever_checkpoint_manifest_sha256':h('evidence_v1/checkpoints/retriever_ltr_v1/CHECKPOINT_MANIFEST.json'),
            'retriever_top10_sha256':h('evidence_v1/checkpoints/retriever_ltr_v1/TOP10.csv'),
            'retriever_oos_predictions_sha256':h('evidence_v1/checkpoints/retriever_ltr_v1/OOS_PREDICTIONS.csv'),
            'panel_manifest_sha256':h('_evidence_v1_rr4/panel149/RAW_FEATURE_PANEL_MANIFEST.json'),
            'holdout70_used':False,
            'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,
            'scikit_learn':sklearn.__version__,'xgboost':xgboost.__version__}
          (r/'PROVENANCE.json').write_text(json.dumps(p,indent=2)+'\n')
          files=sorted(x.name for x in r.iterdir() if x.is_file() and x.name!='RESULT_MANIFEST.json')
          (r/'RESULT_MANIFEST.json').write_text(json.dumps({'test':'reranker_v4_best_classifier','files_sha256':{f:h(r/f) for f in files}},indent=2)+'\n')
          print(json.dumps(p,indent=2))
          PY
          cat _evidence_v1_rr4/result/SUMMARY.json

      - name: Persist v4 evidence in branch
        run: |
          set -euo pipefail
          test ! -e evidence_v1/results/reranker_v4_best_classifier
          mkdir -p evidence_v1/results/reranker_v4_best_classifier
          cp _evidence_v1_rr4/result/* evidence_v1/results/reranker_v4_best_classifier/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_v1/results/reranker_v4_best_classifier
          git diff --cached --stat
          git commit -m "Record Evidence V1 reranker v4 classifier"
          git pull --rebase origin research/evidence-v1
          git push origin HEAD:research/evidence-v1

      - name: Upload v4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v1-reranker-v4-best-classifier
          retention-days: 90
          if-no-files-found: error
          path: evidence_v1/results/reranker_v4_best_classifier/*
