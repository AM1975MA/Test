name: V3 L04 prequential supervised expert meta-ranker
on:
  push:
    branches: [research-v3-l00-quality-l01-ranker-20261021]
    paths:
      - '.github/workflows/v3-l04-meta.yml'
      - 'etf-trader-v3 corrected/experiments/l04_fusion_meta/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - name: Fetch original raw 149 ETF snapshot and fixed expert fusion oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/v3_l04_static
          gh run download 39482809691 --repo AM1975MA/Test \
            --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          gh run download 39659903643 --repo AM1975MA/Test \
            --name v3-l04-frozen-expert-blend-results --dir runs/v3_l04_static
          python regeneration/certify_etf_trader_raw.py
          test -s runs/v3_l04_static/OOS_SCORES_ALL_FIXED_BLENDS.csv
      - name: Chronological second-stage logistic fit on matured first-stage OOS
        run: |
          python 'etf-trader-v3 corrected/experiments/l04_fusion_meta/evaluate.py' \
            --raw etf_trader_raw --prior runs/v3_l04_static \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out runs/v3_l04_meta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l04-meta-ranker-prequential-results
          path: runs/v3_l04_meta/
          if-no-files-found: warn
          retention-days: 90
