name: V3 Europe48 root cause economic compare leaf15 31 63 127
on:
  push:
    branches: [research/eu48-ranker-rootcause-20261024]
    paths:
      - 'etf-trader-v3 corrected/experiments/europe48_transfer/LEAF_ECON_START.txt'
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:vendor/etf_trader_v2/src
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'numba==0.65.1' 'pyarrow==23.0.1'
      - name: Retrieve six original matched Euro48 annual OOS leaf refits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _LEAF _EU48_PREP
          for year in 2021 2022 2023 2024 2025 2026; do
            mkdir -p "_LEAF/$year"
            gh run download 40093395123 -R AM1975MA/Test \
              -n "v3-eu48-diagnostic-leaf-$year" -D "_LEAF/$year"
          done
          python -m isin_first2026.v2_unrestricted48.prepare --out _EU48_REGEN
      - name: V2 exact CAGR reference plus 4 V3 model capacity next-open EUR 10bps
        run: |
          python -u 'etf-trader-v3 corrected/experiments/europe48_transfer/europe48_leaf_economics.py' \
            --shards _LEAF --prep _EU48_REGEN --out _EU48_LEAF_ECON_RESULTS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-eu48-leaf-capacity-econ-and-skill
          path: _EU48_LEAF_ECON_RESULTS/
          retention-days: 90
