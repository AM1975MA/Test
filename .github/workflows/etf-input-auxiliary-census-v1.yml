name: ETF_INPUT_AUXILIARY_CENSUS_V1
on:
  push:
    branches: [research/etf-input-quality-gate-v1]
    paths: [.github/workflows/etf-input-auxiliary-census-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  aux_inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
      - name: Frozen original historical source panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in 1 2 3; do
            gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-${r} -D "_ti/r${r}"
          done
      - name: Auxiliary input schema, missingness and value drift
        run: python data_quality_audit_v1/auxiliary_census.py --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --out _output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-input-auxiliary-census-v1
          retention-days: 90
          path: _output/
