name: V3 no-tuning next-open economic diagnosis of utility models
on:
  push:
    branches: [research-v3-utility-regret-20261024]
    paths:
      - 'etf-trader-v3 corrected/experiments/l00_rank_reg_fusion/HURDLE_ECON_START.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  economic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: DT14, penalty: 1.5, id: DT14_L15}
          - {family: HGB_REGIME, penalty: 1.5, id: HGB_REGIME_L15}
          - {family: RF_REGIME, penalty: 1.0, id: RF_REGIME_L10}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact source-only execution dependencies
        run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'scikit-learn==1.9.1' 'xgboost==3.0.5' scipy matplotlib tabulate
      - name: Immutable canonical prices, OOS first-stage and actual utility decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/v3_rrf runs/v3_utility runs/v3_prior_econ
          gh run download 39482809691 -R AM1975MA/Test -n v2-deep-leaf-frozen-raw -D etf_trader_raw
          python regeneration/certify_etf_trader_raw.py
          for shard in s1 s2 s3; do
            gh run download 40016809498 -R AM1975MA/Test -n rrf-regression-$shard -D runs/v3_rrf
          done
          gh run download 40079852872 -R AM1975MA/Test \
            -n "v3-meta-hurdle-${{ matrix.family }}" -D runs/v3_utility
          gh run download 40032693599 -R AM1975MA/Test \
            -n v3-nested-meta-tree-nextopen-economics -D runs/v3_prior_econ
      - name: Exact 101-month choice parity and matched net 10bp market-next-open economic replay
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -u 'etf-trader-v3 corrected/experiments/l00_rank_reg_fusion/hurdle_economic_replay.py' \
            --shards runs/v3_rrf --raw etf_trader_raw \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --utility runs/v3_utility --family '${{ matrix.family }}' \
            --penalty '${{ matrix.penalty }}' \
            --prior-economic runs/v3_prior_econ \
            --out 'runs/v3_utility_economic_${{ matrix.id }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-meta-utility-econ-${{ matrix.id }}
          path: runs/v3_utility_economic_${{ matrix.id }}/
          retention-days: 90
