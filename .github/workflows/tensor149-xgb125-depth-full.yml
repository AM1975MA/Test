name: ORIGINAL149_XGB125_LEAVES_DEPTH_2_TO_7
on:
  push:
    branches: [research/original149-xgb125-depth-sweep-20261020]
    paths: ['.github/workflows/tensor149-xgb125-depth-full.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  PYTHONPATH: '${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        depth: [2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Original pinned XGB125 analysis stack, no RMT feature packages
        run: |
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'matplotlib==3.10.8' 'pyarrow==23.0.1'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Original source contract and depth-only runner syntax
        run: |
          python -m py_compile tensor149_tcn5d/xgb125_depth_run.py
          python -m unittest -v tensor149_tcn5d.test_contract
      - name: One immutable all-ten-years expanding WF for given max_depth only
        run: |
          set -o pipefail
          python -m tensor149_tcn5d.xgb125_depth_run --raw evidence_v1/data/original149 --depth ${{ matrix.depth }} --years 2017,2018,2019,2020,2021,2022,2023,2024,2025,2026 --out _results | tee _run.log
      - name: Preserve every annual fitted ranker, actual leaves and all ETF OOS
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original149-xgb125-depth-${{ matrix.depth }}
          retention-days: 90
          path: |
            _results/
            _run.log
