name: Titanium Compact identification stage1

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/identify_compact_hparams.py'
      - '.github/workflows/titanium-compact-identification-stage1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 pyarrow==25.0.1
      - name: Download best corrected panel
        uses: actions/download-artifact@v4
        with:
          name: TITANIUM_PLATINUM_COMPACT_EXACT_TAIL_CVAR
          path: best
          repository: AM1975MA/Test
          run-id: 31647358105
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download reconstruction constants
        uses: actions/download-artifact@v4
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE
          path: fixture
          repository: AM1975MA/Test
          run-id: 31464219662
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize inputs
        run: |
          mkdir -p fixture_pkg results
          unzip -q fixture/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip -d fixture_pkg
          find best -name COMPACT_LABELED.parquet -print
      - name: Screen shard ${{ matrix.shard }}
        run: |
          PANEL=$(find best -name COMPACT_LABELED.parquet | head -1)
          BASE=fixture_pkg/HISTORICAL_F2D_RECOVERY/code/source_feature_engine.py
          python titanium_training_native/identify_compact_hparams.py \
            --panel "$PANEL" --base-module "$BASE" --output results \
            --shard ${{ matrix.shard }} --n-shards 4
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_COMPACT_IDENT_STAGE1_SHARD_${{ matrix.shard }}
          path: results
          retention-days: 30
