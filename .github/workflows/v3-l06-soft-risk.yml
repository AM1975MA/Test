name: V3 L06.2 isolated risk soft-weighting within frozen Top3
on:
  push:
    branches: [research-v3-l06-soft-risk-20261021]
    paths:
      - '.github/workflows/v3-l06-soft-risk.yml'
      - 'etf-trader-v3 corrected/experiments/l06_soft_risk/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    name: Same-three-ETF risk-weight modifier vs frozen oracle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - name: Fetch original risk+Tail OOS scores; no retraining
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/v3_l06_ref
          gh run download 39662062361 --repo AM1975MA/Test \
            --name v3-l06-risk-standalone-results --dir runs/v3_l06_ref
          test -s runs/v3_l06_ref/RISK_SCORES_OOS.csv
          test -s runs/v3_l06_ref/PAIRED_MONTHLY.csv
      - name: Validate exact same 500-basket Top3 and small weight-only risk adjustment
        run: |
          python 'etf-trader-v3 corrected/experiments/l06_soft_risk/evaluate.py' \
            --reference runs/v3_l06_ref \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --out runs/v3_l06_soft
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l06-soft-risk-keep-top3-results
          path: runs/v3_l06_soft/
          if-no-files-found: warn
          retention-days: 90
