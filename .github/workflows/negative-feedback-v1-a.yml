name: ETF_trader negative feedback V1 A

on:
  push:
    branches: [ research/etf-trader-negative-feedback-v1 ]
    paths:
      - '.github/workflows/negative-feedback-v1-a.yml'
      - 'negative_feedback_v1/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
      ETF_TRADER_XGB_WORKERS: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact canonical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib \
            'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' \
            'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'
          python - <<'PY'
          import numpy,pandas,sklearn,xgboost,numba,yfinance
          assert numpy.__version__=='2.3.5'
          assert pandas.__version__=='2.2.3'
          assert sklearn.__version__=='1.8.0'
          assert xgboost.__version__=='3.1.3'
          assert numba.__version__=='0.65.1'
          assert yfinance.__version__=='0.2.66'
          print('ENV_GATE_PASS')
          PY

      - name: Gate exact canonical V2 productive source blobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exp={
            'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
            'vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223',
            'vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
            'vendor/etf_trader_v2/src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ddfirst.py':'3794564fdfe8501c2c19e618bc7d1550884aeb53',
            'vendor/etf_trader_v2/src/etf_trader/ma3/v6.py':'6c5d3fd6f54fb5ef5162f4b26d3ef9af2af34701',
            'vendor/p45/v2_stage19_kernel.py':'364c16f61d1866946827626e0d8f26dab276aca4',
          }
          lf_fix={
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py',
          }
          for p,want in exp.items():
              got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              if got!=want and p in lf_fix:
                  path=Path(p); raw=path.read_bytes()
                  if not raw.endswith(b'\n'):
                      path.write_bytes(raw+b'\n')
                      got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              assert got==want,(p,got,want)
          print('CANONICAL_V2_SOURCE_GATE_PASS')
          PY

      - name: Restore frozen Yahoo perturbation snapshot and canonical runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R ${{ github.repository }} -n yfinance-repeatability-v1-raw -D _raw
          test -f _raw/_repeat${{ matrix.repeat }}/universe.csv
          mkdir -p holdout70
          curl -fsSL \
            'https://raw.githubusercontent.com/AM1975MA/Test/research/v2-same-source-149-vs-70-20261002/holdout70/v2_canonical_same_source_compare.py' \
            -o holdout70/v2_canonical_same_source_compare.py
          test "$(git hash-object holdout70/v2_canonical_same_source_compare.py)" = 'ebd578e0d92e986adb5c2fbf265a346f87b7218e'
          echo INPUT_AND_RUNNER_GATE_PASS

      - name: Run causal negative feedback V1 A
        run: |
          python negative_feedback_v1/run_nf_v1_a.py \
            --raw _raw/_repeat${{ matrix.repeat }} \
            --compare-script holdout70/v2_canonical_same_source_compare.py \
            --out _nf_result

      - name: Gate repeat2 canonical parity
        if: matrix.repeat == 2
        run: |
          python - <<'PY'
          import json
          r=json.load(open('_nf_result/original149/NF_V1_A_RESULT.json'))
          got=r['baseline']['cagr']
          want=0.30843704925646037
          assert abs(got-want)<1e-12,(got,want)
          print('REPEAT2_BASELINE_PARITY_PASS',got)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nf-v1-a-repeat-${{ matrix.repeat }}
          retention-days: 90
          if-no-files-found: error
          path: |
            _nf_result/original149/NF_V1_A_RESULT.json
            _nf_result/original149/BASELINE_DAILY_LEADERS.csv
            _nf_result/original149/FEEDBACK_DAILY_LEADERS.csv
            _nf_result/original149/FEEDBACK_STATE_AUDIT.csv
            _nf_result/original149/BASELINE_RESULT.json
            _nf_result/original149/FEEDBACK_RESULT.json

  summarize:
    needs: replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nf-v1-a-repeat-*
          path: _collected

      - name: Build cross-snapshot convergence report
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,itertools
          import pandas as pd
          roots={int(p.name.rsplit('-',1)[-1]):p for p in Path('_collected').glob('nf-v1-a-repeat-*')}
          if set(roots)!={1,2,3}: raise RuntimeError(roots)
          rows=[]; leaders={}
          for rep,root in sorted(roots.items()):
              r=json.load(open(next(root.rglob('NF_V1_A_RESULT.json'))))
              rows.append({'repeat':rep,**r})
              leaders[rep]={
                  'base':pd.read_csv(next(root.rglob('BASELINE_DAILY_LEADERS.csv'))),
                  'feedback':pd.read_csv(next(root.rglob('FEEDBACK_DAILY_LEADERS.csv'))),
              }
          def pair_agree(kind,col):
              vals=[]
              for a,b in itertools.combinations([1,2,3],2):
                  x=leaders[a][kind][['date',col]].merge(leaders[b][kind][['date',col]],on='date',suffixes=('_a','_b'))
                  vals.append(float((x[f'{col}_a']==x[f'{col}_b']).mean()))
              return sum(vals)/len(vals)
          base_top1=pair_agree('base','top1'); fb_top1=pair_agree('feedback','top1')
          base_pair=[]; fb_pair=[]
          for kind,dest in [('base',base_pair),('feedback',fb_pair)]:
              for a,b in itertools.combinations([1,2,3],2):
                  x=leaders[a][kind].merge(leaders[b][kind],on='date',suffixes=('_a','_b'))
                  dest.append(float(((x.top1_a==x.top1_b)&(x.top2_a==x.top2_b)).mean()))
          base_pair=sum(base_pair)/3; fb_pair=sum(fb_pair)/3
          bc=[x['baseline']['cagr'] for x in rows]; fc=[x['feedback']['cagr'] for x in rows]
          mae_b=[x['direct_error_metrics']['mae_base'] for x in rows]; mae_f=[x['direct_error_metrics']['mae_feedback'] for x in rows]
          ic_b=[x['direct_error_metrics']['mean_rank_ic_base'] for x in rows]; ic_f=[x['direct_error_metrics']['mean_rank_ic_feedback'] for x in rows]
          out={
            'status':'NF_V1_A_SUMMARY_COMPLETE',
            'controller':{'alpha':0.20,'lambda':0.50,'cap':0.20,'min_obs':3},
            'repeats':[{k:v for k,v in x.items() if k!='controller'} for x in rows],
            'direct_error_mean':{
              'mae_base':sum(mae_b)/3,'mae_feedback':sum(mae_f)/3,'mae_delta':sum(mae_f)/3-sum(mae_b)/3,
              'rank_ic_base':sum(ic_b)/3,'rank_ic_feedback':sum(ic_f)/3,'rank_ic_delta':sum(ic_f)/3-sum(ic_b)/3,
            },
            'cross_snapshot_stability':{
              'mean_pairwise_top1_agreement_base':base_top1,
              'mean_pairwise_top1_agreement_feedback':fb_top1,
              'top1_agreement_delta':fb_top1-base_top1,
              'mean_pairwise_top1_top2_exact_base':base_pair,
              'mean_pairwise_top1_top2_exact_feedback':fb_pair,
              'top1_top2_exact_delta':fb_pair-base_pair,
              'cagr_span_base_pp':100*(max(bc)-min(bc)),
              'cagr_span_feedback_pp':100*(max(fc)-min(fc)),
            },
          }
          out['promising_gate']={
            'mae_improved':out['direct_error_mean']['mae_delta']<0,
            'rank_ic_not_worse':out['direct_error_mean']['rank_ic_delta']>=-0.005,
            'top1_stability_improved':out['cross_snapshot_stability']['top1_agreement_delta']>0,
            'cagr_span_reduced_secondary':out['cross_snapshot_stability']['cagr_span_feedback_pp']<out['cross_snapshot_stability']['cagr_span_base_pp'],
          }
          dest=Path('negative_feedback_v1/results/nf_v1_a')
          dest.mkdir(parents=True,exist_ok=True)
          (dest/'RESULT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Persist frozen result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin research/etf-trader-negative-feedback-v1
          git add negative_feedback_v1/results/nf_v1_a/RESULT.json
          git commit -m 'Persist negative feedback V1 A result' || true
          git push origin HEAD:research/etf-trader-negative-feedback-v1

      - uses: actions/upload-artifact@v4
        with:
          name: nf-v1-a-summary
          retention-days: 90
          path: negative_feedback_v1/results/nf_v1_a/RESULT.json
