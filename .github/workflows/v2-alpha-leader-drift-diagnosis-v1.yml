name: V2_ALPHA_LEADER_DRIFT_DIAGNOSIS_V1
on:
  push:
    branches: [research/v2-alpha-leader-drift-diagnosis-v1]
    paths: [.github/workflows/v2-alpha-leader-drift-diagnosis-v1.yml, data_quality_audit_v1/v2_leader_drift.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
      - name: Download six finished V2 alpha replay decision artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in 0.05 1.0; do
            for r in 1 2 3; do
              gh run download 38094477390 -R ${{ github.repository }} -n "v2-alpha-${a}-repeat-${r}" -D "_frozen/v2-alpha-${a}-repeat-${r}"
              test "$(find "_frozen/v2-alpha-${a}-repeat-${r}" -name DAILY_LEADERS.csv | wc -l)" -eq 1
            done
          done
      - name: Diagnose cross-vintage disagreements at exact investment decisions
        run: python data_quality_audit_v1/v2_leader_drift.py --root _frozen --out _result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-alpha-leader-drift-diagnosis-v1
          retention-days: 90
          path: _result/
