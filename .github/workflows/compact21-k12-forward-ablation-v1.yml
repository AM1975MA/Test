name: COMPACT21_K12_FORWARD_ABLATION_V1
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        variant: [K12,K13_A,K13_E,K13_S,K13_M,K14_AE,K14_AS,K14_AM,K14_ES,K14_EM,K14_SM,K15_AES,K15_AEM,K15_ASM,K15_ESM,K16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen numerical environment
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Recover frozen three-snapshot Compact21 panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _ti/r1 _ti/r2 _ti/r3 _out
          gh run download 37150436612 -R "${{ github.repository }}" -n titanium-internal-fixed-repeat-1 -D _ti/r1
          gh run download 37150436612 -R "${{ github.repository }}" -n titanium-internal-fixed-repeat-2 -D _ti/r2
          gh run download 37150436612 -R "${{ github.repository }}" -n titanium-internal-fixed-repeat-3 -D _ti/r3
      - name: Canonical XGB K12 forward ablation
        run: |
          python feature_ablation_v1/k12_forward_v1/run_benchmark.py \
            --variant ${{ matrix.variant }} \
            --variants feature_ablation_v1/k12_forward_v1/variants.json \
            --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 \
            --out _out/${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-k12-forward-${{ matrix.variant }}
          retention-days: 90
          path: _out/${{ matrix.variant }}.json
  summary:
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: compact21-k12-forward-*
          path: _results
      - name: Frozen gate summary
        run: |
          mkdir -p _summary
          python feature_ablation_v1/k12_forward_v1/summarize.py \
            --inputs _results \
            --variants feature_ablation_v1/k12_forward_v1/variants.json \
            --out _summary/K12_FORWARD_SUMMARY.json \
            --md _summary/K12_FORWARD_SUMMARY.md
      - uses: actions/upload-artifact@v4
        with:
          name: compact21-k12-forward-summary
          retention-days: 90
          path: _summary/*
