name: EU120 v2 EUR equity freeze
on:
  workflow_dispatch:
  push:
    paths:
      - 'europe120/build_eu120_v2.py'
      - '.github/workflows/europe120-v2-freeze.yml'

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow yfinance
      - name: Apply frozen EU120-v2 candidate and semantic gates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('europe120/build_eu120_v2.py')
          s=p.read_text()

          old_c01="'CSEMUS.MI','SXRJ.DE','CEMS.DE','IEVL.MI','IEQU.MI','CEMQ.DE','MVEU.MI','EUN0.DE','ZPRX.DE']"
          new_c01="'CSEMUS.MI','SXRJ.DE','CEMS.DE','IEVL.MI','IEQU.MI','CEMQ.DE','MVEU.MI','EUN0.DE','ZPRX.DE','XMEU.DE','D5BL.DE','SDJ600.DE','LYY5.DE','CEMR.DE','EXSE.DE','EXSD.DE','EXSI.DE']"
          if old_c01 not in s:
              raise SystemExit('C01 insertion anchor not found')
          s=s.replace(old_c01,new_c01)

          old_c02="'C02_EUROPE_COUNTRY':['CSMIB.MI','EXS1.DE','C40.PA','BBVAI.MC','IAEX.AS','CSSMI.SW','SXRY.DE','EXH1.DE','EXH2.DE','EXH3.DE']"
          new_c02="'C02_EUROPE_COUNTRY':['CSMIB.MI','EXS1.DE','C40.PA','BBVAI.MC','IAEX.AS','EXI1.DE','IBCJ.DE','LYMH.DE','CN1.PA','IS3U.DE','DBXI.DE','DBXD.DE','EL4A.DE','CAC.PA','DX2G.DE','LYXIB.MC','TDT.AS']"
          if old_c02 not in s:
              raise SystemExit('C02 replacement anchor not found')
          s=s.replace(old_c02,new_c02)

          anchor="selected=[]; rejected=[]; data={}; used_tickers=set(); used_names=set()"
          semantic="""SEMANTIC={
 'C02_EUROPE_COUNTRY':['mib','dax','cac 40','ibex','aex','swiss','switzerland','poland','greece','france','germany','italy','spain','netherlands','belgium','austria','portugal','nordic','sweden','denmark','finland','norway'],
 'C03_US_EQUITY_EUR':['s&p 500','s&p500','nasdaq','dow jones','russell','msci usa','usa','united states'],
 'C04_WORLD_DEVELOPED':['world','developed','japan','topix','pacific','australia','canada'],
 'C05_EMERGING_ASIA':['emerging','china','india','taiwan','korea','brazil','mexico','south africa','asia ex japan','eastern europe'],
 'C06_GLOBAL_SECTOR':['technology','financial','health','industrial','consumer','energy','material','utilit','communication','semiconductor','robot','cyber','clean energy','infrastructure','real estate','property']
}
def semantic_ok(cat,name):
    toks=SEMANTIC.get(cat)
    if not toks:return True
    x=(name or '').lower()
    return any(t in x for t in toks)

"""+anchor
          if anchor not in s:
              raise SystemExit('semantic insertion anchor not found')
          s=s.replace(anchor,semantic)

          gate="currency,name,qt,exchange=meta(s); fp=norm_name(name)"
          gate2="currency,name,qt,exchange=meta(s); fp=norm_name(name)\n        if not semantic_ok(cat,name): rejected.append({'ticker':s,'cluster':cat,'reason':'semantic_mismatch','name':name});continue"
          if gate not in s:
              raise SystemExit('semantic gate anchor not found')
          s=s.replace(gate,gate2)
          p.write_text(s)
          PY
      - name: Build and freeze EU120 v2
        run: python europe120/build_eu120_v2.py
      - name: Upload EU120 v2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu120-v2-frozen-20260701
          path: europe120/v2_output/
          retention-days: 30
