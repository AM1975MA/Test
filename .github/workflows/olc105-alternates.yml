name: OLC105 same-fund alternate EUR quotes
on:
  push:
    branches: [research/olc105-traderepublic-holdout-20261114]
    paths: [.github/workflows/olc105-alternates.yml, research/olc105/capture_alternates.py]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/olc105-traderepublic-holdout-20261114
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install yfinance==0.2.66 pandas==2.2.3 numpy==2.3.5
      - run: python research/olc105/capture_alternates.py
      - name: Preserve alternate sources
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/olc105/source_alternates
          if ! git diff --cached --quiet; then
            git commit -m 'research(olc105): archive alternate EUR quote histories and integrity flags'
            git push origin HEAD:research/olc105-traderepublic-holdout-20261114
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olc105-alternates-${{ github.run_id }}
          path: research/olc105/
          retention-days: 90
