name: Titanium TailMix validity diagnostic

on:
  push:
    branches: [titanium-gap-recovery-20260812]
    paths:
      - 'titanium_training_native/refit_tailmix_validity_diagnostic.py'
      - '.github/workflows/titanium-tail-validity-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 numba pyarrow matplotlib
      - name: Download V1 canonical outputs
        uses: actions/download-artifact@v4
        with:
          name: TITANIUM_TRAINING_NATIVE_V1_CANONICAL
          path: v1
          repository: AM1975MA/Test
          run-id: 31616228523
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download historical fixture/code bundle
        uses: actions/download-artifact@v4
        with:
          name: METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE
          path: fixture
          repository: AM1975MA/Test
          run-id: 31464219662
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract fixture
        run: |
          mkdir -p fixture_pkg
          unzip -q fixture/METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip -d fixture_pkg
          test -f fixture_pkg/HISTORICAL_F2D_RECOVERY/code/source_feature_engine.py
      - name: Refit only TailMix with historical validity filter and rerun 500 baskets
        run: |
          python titanium_training_native/refit_tailmix_validity_diagnostic.py \
            --v1-root v1 \
            --fixture-root fixture_pkg/HISTORICAL_F2D_RECOVERY \
            --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_TAIL_VALIDITY_DIAGNOSTIC
          path: results
          retention-days: 30
