name: LISTNET_SOLVER_FIRST_FOLD_DIAGNOSTIC
on:
  push:
    branches: [research/paper-ltr-feasibility-20261012]
    paths: [.github/workflows/listnet-solver-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
      - name: Frozen inputs only, no controls refit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-1 -D _ti
          gh run download 38179662587 -R AM1975MA/Test -n paper-ltr-feasibility -D _original
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-LINEAR -D _failed
      - name: Trace original failed solver without OOS evaluation
        run: python paper_ltr_v2/diagnostics_solver/real_first_fold.py --panel _ti/TI_COMPACT.parquet --original _original/_candidate/RESULT.json --failed _failed/_candidate/RESULT.json --out _diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listnet-solver-first-fold-diagnostic
          retention-days: 90
          path: _diagnostic/
