name: EU economy 120 ETF download
on:
  workflow_dispatch:
  push:
    paths:
      - 'europe120/download_europe120.py'
      - '.github/workflows/europe120-download.yml'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow yfinance
      - name: Discover and download 120 EU-economy ETFs
        run: python europe120/download_europe120.py
      - name: Upload EU120 snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-economy-120-20260731
          path: europe120/output/
          retention-days: 30
