name: OLC105 official ISIN mapping
on:
  push:
    branches: [research/olc105-traderepublic-holdout-20261114]
    paths: [.github/workflows/olc105-identity.yml, research/olc105/resolve_exchange.py]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/olc105-traderepublic-holdout-20261114
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.4 pandas==2.2.3
      - run: python research/olc105/resolve_exchange.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/olc105/exchange_metadata
          git commit -m 'research(olc105): preserve official instrument listing metadata'
          git push origin HEAD:research/olc105-traderepublic-holdout-20261114
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olc105-identity-${{ github.run_id }}
          path: research/olc105/exchange_metadata/
          retention-days: 90
