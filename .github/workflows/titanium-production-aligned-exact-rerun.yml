name: Titanium Production Aligned Exact Rerun
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      NUMBA_DISABLE_CACHING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 pyarrow matplotlib numba
      - name: Reconstruct immutable engines
        run: |
          mkdir -p upstream/gzpayload upstream/reconstruction
          for f in gz_00.b64 gz_01.b64 gz_02.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-source-faithful-20260803/gzpayload/$f" -o "upstream/gzpayload/$f"; done
          cat upstream/gzpayload/gz_*.b64 | base64 -d | gzip -dc > upstream/titanium_retrained_current_data_audit.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  upstream/titanium_retrained_current_data_audit.py' | sha256sum -c -
          for f in rv5_00.b64 rv5_01.b64 rv5_02.b64 rv5_04.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/reconstruction/$f"; done
          for f in rv5_03a.b64 rv5_03b.b64 rv5_03c.b64 rv5_03d.b64; do curl -fsSL "https://raw.githubusercontent.com/AM1975MA/Test/titanium-reconstruction-v5-20260803/reconstruction/$f" -o "upstream/reconstruction/$f"; done
          cat upstream/reconstruction/rv5_00.b64 upstream/reconstruction/rv5_01.b64 upstream/reconstruction/rv5_02.b64 upstream/reconstruction/rv5_03a.b64 upstream/reconstruction/rv5_03b.b64 upstream/reconstruction/rv5_03c.b64 upstream/reconstruction/rv5_03d.b64 upstream/reconstruction/rv5_04.b64 | base64 -d | gzip -dc > upstream/titanium_reconstruction_v5.py
          sed -i 's/@njit(cache=True)/@njit(cache=False)/g; s/@njit(parallel=True,cache=True)/@njit(parallel=True,cache=False)/g' upstream/titanium_reconstruction_v5.py
          curl -fsSL https://raw.githubusercontent.com/AM1975MA/Test/28430c0c3487eb7973dc5c6f0d0a569a90d8224c/regeneration/production_aligned_regen.py -o production_aligned_regen.py
          python -m py_compile upstream/*.py production_aligned_regen.py
      - name: Download canonical 150 OHLCV matrices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AM1975MA/Test/actions/artifacts/9007704034/zip -o canonical.zip
          mkdir outer && unzip -q canonical.zip -d outer
          inner=$(find outer -name 'METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE.zip' -print -quit)
          mkdir package && unzip -q "$inner" -d package
          pkg=$(find package -type d -name METEOR_TITANIUM_V2_OPPORTUNITY_V3_LIVE_PACKAGE -print -quit)
          mkdir data
          cp "$pkg"/data/*.parquet data/
          for f in OPEN HIGH LOW CLOSE VOLUME; do test -s data/${f}.parquet; done
      - name: Run immutable production-aligned 500 basket audit
        run: |
          python production_aligned_regen.py --base-module upstream/titanium_retrained_current_data_audit.py --v5-module upstream/titanium_reconstruction_v5.py --data-dir data --output PRODUCTION_ALIGNED_RERUN --n-estimators 360 --n-baskets 500 | tee RUN_LOG.txt
      - name: Archive core audit
        if: always()
        run: |
          zip -r TITANIUM_PRODUCTION_ALIGNED_EXACT_RERUN.zip PRODUCTION_ALIGNED_RERUN RUN_LOG.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_PRODUCTION_ALIGNED_EXACT_RERUN
          path: TITANIUM_PRODUCTION_ALIGNED_EXACT_RERUN.zip
          retention-days: 7
