name: ETF trader single-thread lookahead closure

on:
  push:
    branches:
      - research/etf-trader-perturbation-forensics-v1
    paths:
      - .github/workflows/perturbation-forensics-v1-lookahead-singlethread.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scikit-learn==1.8.0" "xgboost==3.1.3" pyarrow
      - name: Download byte-preserved 2023 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _a
          gh run download 37151445684 -R ${{ github.repository }} -n lookahead-bp-2023-12-29-base -D _a/base
          gh run download 37151445684 -R ${{ github.repository }} -n lookahead-bp-2023-12-29-mutate -D _a/mutate
          gh run download 37151445684 -R ${{ github.repository }} -n lookahead-bp-2023-12-29-truncate -D _a/truncate
      - name: Refit canonical producer single-thread and compare
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,numpy as np,pandas as pd
          from etf_trader.ma3.hybrid_producer import fit_hybrid_producer
          modes=["base","mutate","truncate"];R={}
          cutoff=pd.Timestamp("2023-12-29")
          for mode in modes:
              panel=pd.read_parquet(Path("_a")/mode/"PANEL.parquet")
              tit=pd.read_parquet(Path("_a")/mode/"TIT.parquet")
              panel["signal_date"]=pd.to_datetime(panel.signal_date);panel["exit_date_63"]=pd.to_datetime(panel.exit_date_63)
              for c in ["signal_date","entry_date","exit_date"]: tit[c]=pd.to_datetime(tit[c])
              tickers=list(dict.fromkeys(tit.ticker.astype(str).tolist()))
              fit=fit_hybrid_producer(panel,tit,tickers,start_year=2017,end_year=2023,et_n_jobs=1,xgb_n_jobs=1)
              p=fit.predictions.copy();p["signal_date"]=pd.to_datetime(p.signal_date);p=p[p.signal_date<=cutoff].sort_values(["signal_date","ticker"])
              R[mode]=p
          out={"status":"LOOKAHEAD_SINGLETHREAD_CLOSURE_COMPLETE","comparisons":{}}
          for mode in ["mutate","truncate"]:
              x=R["base"].merge(R[mode],on=["signal_date","ticker"],suffixes=("_base","_"+mode),how="inner")
              q={}
              for c in ["ET_TAIL","XGB_TAIL","TAIL_HYBRID"]:
                  d=np.abs(x[c+"_base"].to_numpy(float)-x[c+"_"+mode].to_numpy(float))
                  q[c]={"n":len(d),"changed_gt1e12":int(np.sum(d>1e-12)),"max_abs":float(d.max()) if len(d) else None,"PASS":bool(not np.any(d>1e-12))}
              q["PASS"]=bool(all(v["PASS"] for v in q.values()))
              out["comparisons"][mode]=q
          out["PASS"]=bool(all(v["PASS"] for v in out["comparisons"].values()))
          Path("forensics_v1/results/LOOKAHEAD_SINGLETHREAD_CLOSURE.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensics_v1/results/LOOKAHEAD_SINGLETHREAD_CLOSURE.json
          git commit -m "Persist single-thread lookahead closure"
          git pull --rebase --autostash origin research/etf-trader-perturbation-forensics-v1
          git push origin HEAD:research/etf-trader-perturbation-forensics-v1
