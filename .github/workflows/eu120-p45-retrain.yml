name: EU120 P45 walk-forward retrain

on:
  push:
    branches: [ research/eu120-p45-retrain-20261002 ]
    paths: [ '.github/workflows/eu120-p45-retrain.yml', 'europe120/eu120_retrain/**' ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source requirements
        run: python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib 'pandas==2.2.3'
      - name: Retrieve frozen 149 reference prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36551650325 -R ${{ github.repository }} -n etf-trader-raw-149 -D _raw149
      - name: Validate source-only inputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          d=Path("data/eu120");r=Path("_raw149/etf_trader_raw")
          u=list(csv.DictReader((d/"raw_ticker_csv/universe.csv").open()))
          v=list(csv.DictReader((r/"universe.csv").open()))
          m=json.loads((d/"manifest.json").read_text())
          assert len(u)==120 and len(v)==149 and m["original149_overlap"]==0
          assert not ({x["ticker"] for x in u}&{x["ticker"] for x in v})
          assert all((d/"raw_ticker_csv"/(x["ticker"]+".csv")).is_file() for x in u)
          print("INPUT_GATE_PASS")
          PY
      - name: Fit and replay EU120
        env:
          ETF_TRADER_ROOT: ${{ github.workspace }}/vendor/etf_trader_v2
          FROZEN_EU120_ROOT: ${{ github.workspace }}/data/eu120
          FROZEN_149_ROOT: ${{ github.workspace }}/_raw149
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          NUMEXPR_NUM_THREADS: '2'
        run: python europe120/eu120_retrain/run_eu120_retrain.py
      - name: Upload performance and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu120-p45-retrain-results
          if-no-files-found: warn
          retention-days: 30
          path: |
            europe120/eu120_retrain/results/RESULT.json
            europe120/eu120_retrain/results/ANNUAL_COMPARISON.csv
            europe120/eu120_retrain/results/ROUTER_TRACE.csv
            europe120/eu120_retrain/results/SHADOW_SKILL.csv
            europe120/eu120_retrain/results/MODEL_BUNDLE_MANIFEST.json
