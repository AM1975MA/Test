name: EUROPE_EUR60_EXPOST_HINDSIGHT_ORACLE
on:
  pull_request:
    branches: [research/eu120-margin-predictive-validation-20261017]
    paths:
      - '.github/workflows/europe-eur60-oracle.yml'
      - 'europe_only75/expost_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}:${{ github.workspace }}/europe120/eu120_retrain
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  hindsight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce original frozen EUR60 numerical libraries
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'numba==0.65.1' 'threadpoolctl==3.6.0' 'matplotlib==3.10.8'
          python -m py_compile europe_only75/expost_oracle.py
          python -m unittest discover -s europe_only75/tests -v
      - name: Retrieve EUR60 refitted model predictions and frozen benchmark OHLCV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39071370480 -R AM1975MA/Test -n europe-only-eur60-full-refit -D _refit
          gh run download 36551650325 -R AM1975MA/Test -n etf-trader-raw-149 -D _refs
          test -s _refit/RESULT.json
          test -s _refit/COMPACT_REFITTED.parquet
          test -s _refit/HYBRID_REFITTED.parquet
      - name: Compute same-calendar ex-post top-one top-two top-decile and best fixed ETF returns
        run: |
          python europe_only75/expost_oracle.py --refit _refit --raw149 _refs --out _oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-only-eur60-hindsight-oracle
          retention-days: 90
          path: |
            _oracle/RESULT.json
            _oracle/ORACLE_COMPARISON.csv
            _oracle/MONTHLY_ORACLE_113.csv
