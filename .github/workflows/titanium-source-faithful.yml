name: Titanium Forensic Source Export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact executed runner
        run: |
          cat gzpayload/gz_*.b64 | base64 -d | gzip -dc > titanium_retrained_current_data_audit.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  titanium_retrained_current_data_audit.py' | sha256sum -c -
          python -m py_compile titanium_retrained_current_data_audit.py
      - name: Export forensic source
        run: |
          mkdir forensic_source
          cp titanium_retrained_current_data_audit.py forensic_source/
          cp .github/workflows/titanium-source-faithful.yml forensic_source/
          sha256sum forensic_source/* > forensic_source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TITANIUM_FORENSIC_EXECUTED_SOURCE
          path: forensic_source/
          retention-days: 7
