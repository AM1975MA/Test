name: Titanium Source-Faithful Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn xgboost joblib yfinance pyarrow matplotlib
      - name: Reconstruct and verify runner
        run: |
          cat gzpayload/gz_*.b64 | base64 -d | gzip -dc > titanium_retrained_current_data_audit.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  titanium_retrained_current_data_audit.py' | sha256sum -c -
          python -m py_compile titanium_retrained_current_data_audit.py
      - name: Run smoke audit
        run: python titanium_retrained_current_data_audit.py --output titanium_retrained_smoke --fast
      - name: Archive smoke output
        if: always()
        run: zip -r TITANIUM_SOURCE_FAITHFUL_SMOKE.zip titanium_retrained_smoke || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_SOURCE_FAITHFUL_SMOKE
          path: |
            TITANIUM_SOURCE_FAITHFUL_SMOKE.zip
            titanium_retrained_smoke/
          retention-days: 7
