name: Titanium Reconstruction V5 Payload Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit payload fragments
        run: |
          wc -c reconstruction/rv5_*.b64
          sha256sum reconstruction/rv5_*.b64
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          ps=sorted(Path('reconstruction').glob('rv5_*.b64'))
          s=''.join(p.read_text().strip() for p in ps)
          print('files', [p.name for p in ps], 'b64len', len(s), 'prefix', s[:12])
          raw=base64.b64decode(s, validate=True)
          print('rawlen',len(raw),'rawprefix',raw[:8].hex())
          dec=gzip.decompress(raw)
          print('declen',len(dec),'sha256',hashlib.sha256(dec).hexdigest())
          Path('titanium_reconstruction_v5.py').write_bytes(dec)
          PY
          python -m py_compile titanium_reconstruction_v5.py
