name: Titanium Source-Faithful Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  corrected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install path-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 pyarrow matplotlib
      - name: Download executed OOS model output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/AM1975MA/Test/actions/artifacts/8839840705/zip -o prior_artifact.zip
          mkdir prior
          unzip -q prior_artifact.zip -d prior
          test -f prior/titanium_retrained_output/OOS_TICKER_SCORES.parquet
      - name: Reconstruct and verify corrected simulator
        run: |
          cat gzpayload/recompute_corrected.b64 | base64 -d | gzip -dc > recompute_titanium_paths_corrected.py
          echo '2ec4385cbd75bd283eebabd7d37dd6da41e5fdbb9b6d338a32ba8a158068804b  recompute_titanium_paths_corrected.py' | sha256sum -c -
          python -m py_compile recompute_titanium_paths_corrected.py
      - name: Recompute all 500 basket and Global150 paths
        run: python recompute_titanium_paths_corrected.py
      - name: Archive corrected output
        if: always()
        run: zip -r TITANIUM_CORRECTED_PATHS.zip titanium_corrected_paths || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_CORRECTED_PATHS
          path: |
            TITANIUM_CORRECTED_PATHS.zip
            titanium_corrected_paths/
          retention-days: 7
