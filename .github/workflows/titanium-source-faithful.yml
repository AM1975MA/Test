name: Titanium Source-Faithful Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen-compatible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 joblib==1.5.3 'yfinance>=0.2.65' 'pyarrow>=18.0.0' matplotlib
      - name: Reconstruct and verify runner
        run: |
          cat gzpayload/gz_*.b64 | base64 -d | gzip -dc > titanium_retrained_current_data_audit.py
          echo '76b5da95c865a069d967189d61b1c8df3338eacc5a0e8941e8ee7025c42caf60  titanium_retrained_current_data_audit.py' | sha256sum -c -
          python -m py_compile titanium_retrained_current_data_audit.py
      - name: Run full 500-basket audit
        run: python titanium_retrained_current_data_audit.py --output titanium_retrained_output
      - name: Archive full output
        if: always()
        run: zip -r TITANIUM_SOURCE_FAITHFUL_FULL.zip titanium_retrained_output || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITANIUM_SOURCE_FAITHFUL_FULL
          path: |
            TITANIUM_SOURCE_FAITHFUL_FULL.zip
            titanium_retrained_output/
          retention-days: 7
