name: COMPACT21_RETURN_AWARE_WALK_FORWARD
on:
  pull_request:
    branches: [research/xgb125-factorial-20261017]
    paths: [.github/workflows/compact21-return-aware.yml, 'compact21_return_v1/**', paper_ltr_v2/replay.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  compact-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen numerical environment and test objectives
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python -m py_compile compact21_return_v1/core.py compact21_return_v1/worker.py compact21_return_v1/run.py compact21_return_v1/summarize.py
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s compact21_return_v1/tests -v
      - name: Retrieve frozen Compact21 original149 panels and original BASE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _base
          for i in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$i -D _ti/r$i
          done
      - name: Fit 180 return-aware XGB models and audit predictive regret vs BASE
        run: |
          python compact21_return_v1/run.py --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --baseline _base --out _returns
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-return-predictive
          retention-days: 90
          path: _returns/
      - name: Fetch immutable canonical full V2 replay data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-audit -D _audit
          for i in 1 2 3; do
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$i -D _bases/r$i
          done
      - name: Six unchanged full V2 replays plus independent equity and leader audit
        run: |
          mkdir -p _return_replay
          for variant in RETURN_RANK_NDCG RETURN_REG_PSEUDOHUBER; do
            for i in 1 2 3; do
              python paper_ltr_v2/replay.py --raw _raw/_repeat$i --baseline _bases/r$i --candidate _returns/$variant --repeat $i --ti-panel _ti/r$i/TI_COMPACT.parquet --linkage-audit _audit/linkage-r$i/INPUT_LINKAGE.json --out _return_replay/v2replay-$variant-r$i
            done
          done
          python compact21_return_v1/summarize.py --inputs _return_replay --out _return_replay/ECONOMIC_COMPARISON.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-return-economic
          retention-days: 90
          path: _return_replay/
