name: COMPACT21_MAD_FALLBACK_DIAGNOSTIC_V1
on:
  push:
    branches: [research/compact21-mad-fallback-eval-v1]
    paths: [.github/workflows/compact21-mad-fallback-diagnostic-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1'
      - name: Frozen three source panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in 1 2 3; do
            gh run download 37936573578 -R ${{ github.repository }} -n cleaned-original149-repeat-${r} -D "_panel/r${r}"
          done
      - run: python data_quality_audit_v1/mad_fallback_eval.py --r1 _panel/r1 --r2 _panel/r2 --r3 _panel/r3 --out _result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-mad-fallback-diagnostic-v1
          path: _result/
          retention-days: 90
