name: COMPACT21_CLEAN_DOWNVOL_THREE_SOURCE_PREP
on:
  push:
    branches: [research/compact21-clean-downvol-training-v1]
    paths: [.github/workflows/compact21-clean-downvol-three-source-prep.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: compact21-clean-source-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: 'Haswell'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  source_prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        repeat: [1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Frozen dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Canonical source gate
        run: python compact21_stability_v1/source_gate.py
      - name: Downvol source and invariance regression tests
        run: python -m unittest discover -s compact21_downvol_cleanup_v1/tests -v
      - name: Original source raw and its own original feature panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R ${{ github.repository }} -n yfinance-repeatability-v1-raw -D _raw
          gh run download 37150436612 -R ${{ github.repository }} -n titanium-internal-fixed-repeat-${{ matrix.repeat }} -D _original
      - name: Independently reconstruct and validate one cleaned source
        run: python -m compact21_downvol_cleanup_v1.prepare --raw _raw/_repeat${{ matrix.repeat }} --original _original --repeat ${{ matrix.repeat }} --out _cleaned
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleaned-original149-repeat-${{ matrix.repeat }}
          retention-days: 90
          path: _cleaned/
