name: ETF Trader V2 holdout100 build features
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/holdout100-build-features.yml'
      - 'holdout100/download_holdout100.py'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn xgboost numba pyarrow yfinance
      - name: Clone frozen V2 source carrier
        run: git clone --depth 1 https://github.com/AM1975MA/Trader_selector.git trader_selector
      - name: Redownload deterministic holdout100
        run: python holdout100/download_holdout100.py
      - name: Build causal MA3 holdout feature panel
        env:
          PYTHONPATH: ${{ github.workspace }}/trader_selector/vendor/etf_trader_v2/src
        run: >-
          python trader_selector/vendor/etf_trader_v2/versions/ETF_TRAINER_V2/source/source_only_rebuild/build_ma3_panel_source_only.py
          --data holdout100/output/raw_ticker_csv
          --output holdout100/ma3_panel
      - name: Upload holdout source and feature panel
        uses: actions/upload-artifact@v4
        with:
          name: etf-trader-v2-holdout100-ma3-20260731
          path: |
            holdout100/output/
            holdout100/ma3_panel/
          retention-days: 30
