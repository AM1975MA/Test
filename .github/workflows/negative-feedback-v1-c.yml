name: ETF_trader negative feedback V1 C

on:
  push:
    branches: [ research/etf-trader-negative-feedback-v1 ]
    paths:
      - '.github/workflows/negative-feedback-v1-c.yml'
      - 'negative_feedback_v1_c/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
      ETF_TRADER_XGB_WORKERS: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact canonical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib \
            'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' \
            'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'
          python - <<'PY'
          import numpy,pandas,sklearn,xgboost,numba,yfinance
          assert numpy.__version__=='2.3.5'
          assert pandas.__version__=='2.2.3'
          assert sklearn.__version__=='1.8.0'
          assert xgboost.__version__=='3.1.3'
          assert numba.__version__=='0.65.1'
          assert yfinance.__version__=='0.2.66'
          print('ENV_GATE_PASS')
          PY

      - name: Gate exact canonical V2 productive source blobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exp={
            'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5',
            'vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf',
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223',
            'vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e',
            'vendor/etf_trader_v2/src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592',
            'vendor/etf_trader_v2/src/etf_trader/ma3/ddfirst.py':'3794564fdfe8501c2c19e618bc7d1550884aeb53',
            'vendor/etf_trader_v2/src/etf_trader/ma3/v6.py':'6c5d3fd6f54fb5ef5162f4b26d3ef9af2af34701',
            'vendor/p45/v2_stage19_kernel.py':'364c16f61d1866946827626e0d8f26dab276aca4',
          }
          lf_fix={
            'vendor/etf_trader_v2/src/etf_trader/source_only/models.py',
            'vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py',
            'vendor/etf_trader_v2/scripts/build_tit_r_source_only.py',
          }
          for p,want in exp.items():
              got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              if got!=want and p in lf_fix:
                  path=Path(p); raw=path.read_bytes()
                  if not raw.endswith(b'\n'):
                      path.write_bytes(raw+b'\n')
                      got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              assert got==want,(p,got,want)
          print('CANONICAL_V2_SOURCE_GATE_PASS')
          PY

      - name: Restore frozen Yahoo perturbation snapshot and canonical runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37121749852 -R ${{ github.repository }} -n yfinance-repeatability-v1-raw -D _raw
          test -f _raw/_repeat${{ matrix.repeat }}/universe.csv
          mkdir -p holdout70
          curl -fsSL \
            'https://raw.githubusercontent.com/AM1975MA/Test/research/v2-same-source-149-vs-70-20261002/holdout70/v2_canonical_same_source_compare.py' \
            -o holdout70/v2_canonical_same_source_compare.py
          test "$(git hash-object holdout70/v2_canonical_same_source_compare.py)" = 'ebd578e0d92e986adb5c2fbf265a346f87b7218e'
          echo INPUT_AND_RUNNER_GATE_PASS

      - name: Run causal confidence feedback V1 C
        run: |
          python negative_feedback_v1_c/run_nf_v1_c.py \
            --raw _raw/_repeat${{ matrix.repeat }} \
            --compare-script holdout70/v2_canonical_same_source_compare.py \
            --out _nf_result

      - name: Gate repeat2 canonical parity and decision identity
        if: matrix.repeat == 2
        run: |
          python - <<'PY'
          import json
          r=json.load(open('_nf_result/original149/NF_V1_C_RESULT.json'))
          got=r['baseline']['cagr']; want=0.30843704925646037
          assert abs(got-want)<1e-12,(got,want)
          assert r['decision_identity']['PASS'] is True
          assert r['feedback_state']['gain_never_above_one'] is True
          print('REPEAT2_BASELINE_PARITY_PASS',got)
          print('DECISION_IDENTITY_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nf-v1-c-repeat-${{ matrix.repeat }}
          retention-days: 90
          if-no-files-found: error
          path: |
            _nf_result/original149/NF_V1_C_RESULT.json
            _nf_result/original149/CONFIDENCE_FEEDBACK_STATE_AUDIT.csv
            _nf_result/original149/BASELINE_DAILY_LEADERS.csv
            _nf_result/original149/FEEDBACK_DAILY_LEADERS.csv
            _nf_result/original149/BASELINE_RESULT.json
            _nf_result/original149/FEEDBACK_RESULT.json

  summarize:
    needs: replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nf-v1-c-repeat-*
          path: _collected

      - name: Build frozen cross-snapshot report
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,statistics
          roots={int(p.name.rsplit('-',1)[-1]):p for p in Path('_collected').glob('nf-v1-c-repeat-*')}
          if set(roots)!={1,2,3}: raise RuntimeError(roots)
          rows={r:json.load(open(next(p.rglob('NF_V1_C_RESULT.json')))) for r,p in roots.items()}
          bc=[rows[r]['baseline']['cagr'] for r in [1,2,3]]
          fc=[rows[r]['feedback']['cagr'] for r in [1,2,3]]
          bdd=[rows[r]['baseline']['maxdd'] for r in [1,2,3]]
          fdd=[rows[r]['feedback']['maxdd'] for r in [1,2,3]]
          bsh=[rows[r]['baseline']['sharpe'] for r in [1,2,3]]
          fsh=[rows[r]['feedback']['sharpe'] for r in [1,2,3]]
          base_span=100*(max(bc)-min(bc)); fb_span=100*(max(fc)-min(fc))
          mb=sum(bc)/3; mf=sum(fc)/3; mdd_b=sum(bdd)/3; mdd_f=sum(fdd)/3; msh_b=sum(bsh)/3; msh_f=sum(fsh)/3
          gates={
            'decision_identity_all':all(rows[r]['decision_identity']['PASS'] for r in [1,2,3]),
            'repeat2_parity':abs(rows[2]['baseline']['cagr']-0.30843704925646037)<1e-12,
            'feedback_active':any(rows[r]['feedback_state']['active_daily_fraction']>0 for r in [1,2,3]),
            'cagr_span_reduced_25pct':fb_span<=0.75*base_span,
            'mean_cagr_retention_90pct':mf>=0.90*mb,
            'mean_maxdd_not_worse':mdd_f>=mdd_b,
            'mean_sharpe_not_worse_by_0p02':msh_f>=msh_b-0.02,
          }
          gates['PASS']=all(gates.values())
          out={
            'status':'NF_V1_C_SUMMARY_COMPLETE',
            'experiment':'NF_V1_C_CONFIDENCE_FEEDBACK',
            'repeats':[{'repeat':r,**rows[r]} for r in [1,2,3]],
            'aggregate':{
              'baseline_cagr_span_pp':base_span,
              'feedback_cagr_span_pp':fb_span,
              'span_ratio':fb_span/base_span if base_span else None,
              'mean_baseline_cagr':mb,
              'mean_feedback_cagr':mf,
              'mean_cagr_retention_ratio':mf/mb if mb else None,
              'mean_baseline_maxdd':mdd_b,
              'mean_feedback_maxdd':mdd_f,
              'mean_baseline_sharpe':msh_b,
              'mean_feedback_sharpe':msh_f,
              'mean_active_daily_fraction':sum(rows[r]['feedback_state']['active_daily_fraction'] for r in [1,2,3])/3,
              'mean_active_daily_gain':sum(rows[r]['feedback_state']['mean_active_daily_gain'] for r in [1,2,3])/3,
            },
            'promising_gate':gates,
            'decision':'PROMISING_NF_V1_C' if gates['PASS'] else 'REJECT_NF_V1_C_CURRENT_CONTROLLER',
          }
          dest=Path('negative_feedback_v1_c/results/nf_v1_c'); dest.mkdir(parents=True,exist_ok=True)
          (dest/'RESULT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Persist frozen result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add negative_feedback_v1_c/results/nf_v1_c/RESULT.json
          git commit -m 'Persist negative feedback V1 C result'
          git pull --rebase origin research/etf-trader-negative-feedback-v1
          git push origin HEAD:research/etf-trader-negative-feedback-v1

      - uses: actions/upload-artifact@v4
        with:
          name: nf-v1-c-summary
          retention-days: 90
          path: negative_feedback_v1_c/results/nf_v1_c/RESULT.json
