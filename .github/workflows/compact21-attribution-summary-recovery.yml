name: COMPACT21_ATTRIBUTION_SUMMARY_RECOVERY
on:
  push:
    branches: [research/compact21-training-source-attribution-v1]
    paths:
      - .github/workflows/compact21-attribution-summary-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: 'Haswell'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
  ETF_TRADER_XGB_WORKERS: '1'
jobs:
  recovery_summary_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Complete frozen runtime (including plotting transitive imports)
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1'
      - name: Verify canonical source unchanged
        run: python compact21_stability_v1/source_gate.py
      - name: Reuse original 10 successful yearly artifacts (no retraining)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37916159772 -R ${{ github.repository }} -p 'attribution-20*' -D _years
          for year in {2017..2026}; do
            test -f "_years/attribution-${year}/RESULT.json"
            test -f "_years/attribution-${year}/PREDICTIONS.parquet"
          done
      - name: Recover independent 114-month attribution summary
        run: python -m compact21_training_attribution_v1.summarize --inputs _years --out _summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution-summary-recovery
          retention-days: 90
          path: _summary/
