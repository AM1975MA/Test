name: Evidence V2 freeze macro context v1

on:
  push:
    branches: [ research/evidence-v2 ]
    paths:
      - 'evidence_v2/protocols/MACRO_CONTEXT_V1_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-macro-context-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence-v2
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Fail-closed source and protocol gate
        run: |
          set -euo pipefail
          test "$(git hash-object evidence_v2/src/freeze_macro_context_v1.py)" = "50feddf41d7b0b41ee1df212b957a87f07c5e04b"
          test "$(git hash-object evidence_v2/protocols/MACRO_CONTEXT_V1_FREEZE.md)" = "2774bc7bd8fd18839b917cd65d2e648938e7e35a"
          test ! -e evidence_v2/data/macro_context_v1
          python -m py_compile evidence_v2/src/freeze_macro_context_v1.py

      - name: Install fixed data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3

      - name: Freeze FRED macro context
        run: |
          mkdir -p _evidence_v2_macro
          python evidence_v2/src/freeze_macro_context_v1.py --out _evidence_v2_macro

      - name: Build provenance
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          import numpy,pandas
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          root=Path('_evidence_v2_macro')
          p={
            'line':'Evidence V2','dataset':'macro_context_v1',
            'git_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'freezer_git_blob':subprocess.check_output(['git','hash-object','evidence_v2/src/freeze_macro_context_v1.py'],text=True).strip(),
            'protocol_git_blob':subprocess.check_output(['git','hash-object','evidence_v2/protocols/MACRO_CONTEXT_V1_FREEZE.md'],text=True).strip(),
            'network_used_only_for_data_freeze':True,
            'model_test_executed':False,
            'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,
            'manifest_sha256':h(root/'MANIFEST.json'),
            'macro_daily_sha256':h(root/'MACRO_DAILY.csv')}
          (root/'PROVENANCE.json').write_text(json.dumps(p,indent=2)+'\n')
          print(json.dumps(p,indent=2))
          PY

      - name: Persist frozen macro dataset in branch
        run: |
          set -euo pipefail
          mkdir -p evidence_v2/data/macro_context_v1
          cp -a _evidence_v2_macro/. evidence_v2/data/macro_context_v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_v2/data/macro_context_v1
          git diff --cached --stat
          git commit -m "Freeze Evidence V2 macro context v1"
          git pull --rebase origin research/evidence-v2
          git push origin HEAD:research/evidence-v2

      - name: Upload frozen macro dataset
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v2-macro-context-v1
          retention-days: 90
          if-no-files-found: error
          path: evidence_v2/data/macro_context_v1/**
