name: V2_HISTORY_2011_2012_FEASIBILITY
# v3: record inactive Opportunity forward-label predictors; retain panel lookup key.
on:
  push:
    branches: [research/v2-history-2011-2012-20261011]
    paths: [.github/workflows/v2-history-2011-2012.yml]
permissions: {contents: read, actions: read}
env:
  PYTHONPATH: '${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: {repeat: [1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Frozen V2 numerical environment
        run: python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66' 'pyarrow==23.0.1' 'scipy==1.17.0'
      - name: Unchanged canonical sources and history boundary tests
        run: |
          python compact21_stability_v1/source_gate.py
          python -m unittest history_window_v1.test_contract -v
      - name: Restore original three frozen Yahoo acquisitions
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
      - name: Derived 2011 OHLCV, 2012 training, causal prefix and original 2017 fit gate
        run: python -m history_window_v1.audit --raw _raw/_repeat${{ matrix.repeat }} --out _audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-2011-2012-repeat-${{ matrix.repeat }}
          retention-days: 90
          path: |
            _audit/RESULT.json
            _audit/RAW_WINDOW_MANIFEST.csv
            _audit/TRAINING_ELIGIBILITY.csv
            _audit/original_producer_2017/eligibility_audit.json
  summarize:
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
      - uses: actions/download-artifact@v4
        with: {pattern: 'history-2011-2012-repeat-*', path: _audits}
      - name: Recover original BASE results and selections without duplicate fits
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          for i in 1 2 3; do
            gh run download 37195399755 -R AM1975MA/Test -n learner-meta-full-BASE-r$i -D _baseline/learner-meta-full-BASE-r$i
          done
      - run: python -m history_window_v1.summarize --audits _audits --baseline _baseline --out _summary
      - uses: actions/upload-artifact@v4
        with: {name: v2-history-2011-2012-summary, path: _summary/, retention-days: 90}
