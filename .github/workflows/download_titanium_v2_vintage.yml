name: Download Titanium V2 fixed Yahoo vintage

on:
  push:
    branches:
      - titanium-v2-data-20260918
    paths:
      - ".github/workflows/download_titanium_v2_vintage.yml"
      - "scripts/download_titanium_v2_vintage.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-vintage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: titanium-v2-data-20260918
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<3" "yfinance>=0.2.54,<1"

      - name: Download fixed Titanium V2 snapshot
        run: |
          python scripts/download_titanium_v2_vintage.py

      - name: Inspect output
        run: |
          ls -lh data/source_snapshots/titanium_v2_yahoo_20260802/
          cat data/source_snapshots/titanium_v2_yahoo_20260802/MANIFEST.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: titanium-v2-yahoo-20260802
          path: data/source_snapshots/titanium_v2_yahoo_20260802/
          retention-days: 30
          compression-level: 0

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_snapshots/titanium_v2_yahoo_20260802/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Persist Titanium V2 Yahoo OHLCV snapshot [skip ci]"
          git push origin HEAD:titanium-v2-data-20260918
