name: ETF_trader perturbation forensics V1 Titanium internals
on:
  push:
    branches: [ research/etf-trader-perturbation-forensics-v1 ]
    paths: [ '.github/workflows/perturbation-forensics-v1-titanium.yml' ]
  workflow_dispatch:
permissions: { contents: write, actions: read }
jobs:
  dump:
    strategy:
      fail-fast: false
      matrix: { repeat: [1,2,3] }
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      ETF_TRADER_XGB_THREADS_PER_WORKER: '1'
      ETF_TRADER_XGB_WORKERS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -r vendor/etf_trader_v2/requirements.txt matplotlib 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'numba==0.65.1' 'yfinance==0.2.66'
      - name: Gate canonical source
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exp={'vendor/etf_trader_v2/src/etf_trader/source_only/kernel.py':'045e57996b02d481bd23f6e4dfe53738d43008e5','vendor/etf_trader_v2/src/etf_trader/source_only/features.py':'b7f6520b2b5bc54fdc26178dea839bad8a8fecaf','vendor/etf_trader_v2/src/etf_trader/source_only/models.py':'fc642cce171facfcb92440a7708ee2428f120efe','vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py':'2b2ebd4d35ff32e88be62edc61a464656f6f7d4b','vendor/etf_trader_v2/scripts/build_tit_r_source_only.py':'b06ae7d6960a91aa0c0896dca403f2c6b183467c','vendor/etf_trader_v2/src/etf_trader/ma3/ensemble.py':'4b23fd297df6bfcf71557af9a7aaf7ca96c9a223','vendor/etf_trader_v2/src/etf_trader/ma3/hybrid_producer.py':'acf83f2cee6876c89dfd9948cfbf30889af4c08e','vendor/etf_trader_v2/src/etf_trader/ma3/producer.py':'e691376e3a8e0ec1bd38cc5b85a8ebbfa35d0592','vendor/etf_trader_v2/src/etf_trader/ma3/ddfirst.py':'3794564fdfe8501c2c19e618bc7d1550884aeb53','vendor/etf_trader_v2/src/etf_trader/ma3/v6.py':'6c5d3fd6f54fb5ef5162f4b26d3ef9af2af34701','vendor/p45/v2_stage19_kernel.py':'364c16f61d1866946827626e0d8f26dab276aca4'}
          lf={'vendor/etf_trader_v2/src/etf_trader/source_only/models.py','vendor/etf_trader_v2/src/etf_trader/source_only/_xgb_worker.py','vendor/etf_trader_v2/scripts/build_tit_r_source_only.py'}
          for p,w in exp.items():
            g=subprocess.check_output(['git','hash-object',p],text=True).strip()
            if g!=w and p in lf:
              q=Path(p);b=q.read_bytes();
              if not b.endswith(b'\n'):q.write_bytes(b+b'\n');g=subprocess.check_output(['git','hash-object',p],text=True).strip()
            assert g==w,(p,g,w)
          print('SOURCE_GATE_PASS')
          PY
      - name: Restore frozen repeat and runner
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh run download 37121749852 -R ${{ github.repository }} -n yfinance-repeatability-v1-raw -D _raw
          mkdir -p holdout70
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsSL 'https://raw.githubusercontent.com/AM1975MA/Test/research/v2-same-source-149-vs-70-20261002/holdout70/v2_canonical_same_source_compare.py' -o holdout70/v2_canonical_same_source_compare.py
          test "$(git hash-object holdout70/v2_canonical_same_source_compare.py)" = 'ebd578e0d92e986adb5c2fbf265a346f87b7218e'
      - name: Dump Titanium internals
        run: python forensics_v1/run_titanium_internal_dump.py --raw _raw/_repeat${{ matrix.repeat }} --compare-script holdout70/v2_canonical_same_source_compare.py --out _ti
      - uses: actions/upload-artifact@v4
        with: { name: titanium-internal-repeat-${{ matrix.repeat }}, retention-days: 90, compression-level: 6, path: _ti/ }
  summarize:
    needs: dump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install pandas==2.2.3 pyarrow
      - uses: actions/download-artifact@v4
        with: { pattern: 'titanium-internal-repeat-*', path: '_all' }
      - run: |
          mkdir -p _cmp
          for i in 1 2 3; do mkdir -p _cmp/repeat$i; cp -a _all/titanium-internal-repeat-$i/. _cmp/repeat$i/; done
          mkdir -p forensics_v1/results
          python forensics_v1/compare_titanium_internal.py --root _cmp --out forensics_v1/results/TITANIUM_INTERNAL.json
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forensics_v1/results/TITANIUM_INTERNAL.json
          git commit -m 'Persist Titanium internal perturbation forensic'
          git pull --rebase --autostash origin research/etf-trader-perturbation-forensics-v1
          git push origin HEAD:research/etf-trader-perturbation-forensics-v1
      - uses: actions/upload-artifact@v4
        with: { name: titanium-internal-summary, retention-days: 90, path: forensics_v1/results/TITANIUM_INTERNAL.json }
