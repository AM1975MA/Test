name: V3 L08 frozen model versus portfolio policy 4x3 factorial
on:
  push:
    branches: [research-v3-l08-score-policy-factorial-20261022]
    paths:
      - '.github/workflows/v3-l08-score-policy.yml'
      - 'etf-trader-v3 corrected/experiments/l08_score_policy_factorial/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired-analysis:
    name: Compare frozen LEGACY, PAIR127, TAIL45, RRF10 × Top1/Top2/Top3
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Pinned analytical Python stack
        run: pip install 'numpy==2.2.6' 'pandas==2.2.3' scipy scikit-learn xgboost matplotlib tabulate
      - name: Immutable 149 ETF raw prices and fully annual OOS expert predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p etf_trader_raw runs/v2_formula_reference runs/v3_l01_reference runs/v3_l02_reference
          gh run download 39482809691 --repo AM1975MA/Test \
            --name v2-deep-leaf-frozen-raw --dir etf_trader_raw
          gh run download 39515716383 --repo AM1975MA/Test \
            --name v2-formula-retrain-complete --dir runs/v2_formula_reference
          gh run download 39652989033 --repo AM1975MA/Test \
            --name v3-l01-paired-ranking-results --dir runs/v3_l01_reference
          gh run download 39655513813 --repo AM1975MA/Test \
            --name v3-l02-tail-event-results --dir runs/v3_l02_reference
          python regeneration/certify_etf_trader_raw.py
          test -s runs/v2_formula_reference/OOS_SCORES.csv
          test -s runs/v3_l01_reference/OOS_SCORES.csv
          test -s runs/v3_l02_reference/OOS_SCORES.csv
      - name: Evaluate isolated model and policy effects on same portfolios
        run: |
          OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 OMP_NUM_THREADS=1 \
          python 'etf-trader-v3 corrected/experiments/l08_score_policy_factorial/evaluate.py' \
            --raw etf_trader_raw \
            --baskets regeneration/SUPER_GOLD_BASKET_MEMBERSHIP.csv \
            --legacy runs/v2_formula_reference/OOS_SCORES.csv \
            --pair runs/v3_l01_reference/OOS_SCORES.csv \
            --tail runs/v3_l02_reference/OOS_SCORES.csv \
            --out runs/v3_l08_factorial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-l08-frozen-expert-policy-factorial-results
          path: runs/v3_l08_factorial/
          if-no-files-found: warn
          retention-days: 90
