name: COMPACT21_SIGNAL_LOCKIN_PLS12
on:
  pull_request:
    branches: [research/linear-pca95-20261016]
    paths: [.github/workflows/compact21-signal-lockin.yml, 'signal_lockin_v1/**', paper_ltr_v2/replay.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/vendor/etf_trader_v2/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR'
  OPENBLAS_CORETYPE: Haswell
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  causal-pls:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen dependencies and target tests
        run: |
          python -m pip install -r vendor/etf_trader_v2/requirements.txt 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'xgboost==3.1.3' 'lightgbm==4.6.0' 'pyarrow==23.0.1' 'scipy==1.17.0' 'matplotlib==3.10.8' 'numba==0.65.1' 'threadpoolctl==3.6.0'
          python compact21_stability_v1/source_gate.py
          python -m unittest discover -s signal_lockin_v1/tests -v
          python -m unittest discover -s linear_pca_v1/tests -v
      - name: Recover immutable inputs and verified reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38580178650 -R AM1975MA/Test -n listnet-linear-relative-repair -D _annual
          gh run download 37229180477 -R AM1975MA/Test -n predictive-BASE -D _baseline
          for i in 1 2 3; do
            gh run download 37150436612 -R AM1975MA/Test -n titanium-internal-fixed-repeat-$i -D _ti/r$i
          done
      - name: Causal coherence IC census and 60 preregistered supervised PLS fits
        run: |
          python signal_lockin_v1/run.py --r1 _ti/r1 --r2 _ti/r2 --r3 _ti/r3 --annual _annual/_candidate --baseline _baseline --out _signal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-signal-lockin-predictive
          retention-days: 90
          path: |
            _signal/
      - name: Replay only variants that pass frozen predictive plus stability gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          d=json.load(open('_signal/SUMMARY.json'))
          for v,r in d['variants'].items():
              print('GATE',v,'PASS' if r['economic_replay_gate_pass'] else 'FAIL')
          PY
          gh run download 37121749852 -R AM1975MA/Test -n yfinance-repeatability-v1-raw -D _raw
          gh run download 38565352286 -R AM1975MA/Test -n listnet-v2-audit -D _audit
          for i in 1 2 3; do
            gh run download 37195399755 -R AM1975MA/Test -n learner-full-BASE-r$i -D _bases/r$i
          done
          mkdir -p _replays
          for variant in SIGNAL_PLS12 SIGNAL_PLS12_COHERENCE; do
            allowed=$(python -c "import json,sys; s=json.load(open('_signal/SUMMARY.json')); print('yes' if s['variants'][sys.argv[1]]['economic_replay_gate_pass'] else 'no')" "$variant")
            if [ "$allowed" != "yes" ]; then echo "REPLAY_SKIPPED_PREDICTIVE_GATE $variant"; continue; fi
            for i in 1 2 3; do
              python paper_ltr_v2/replay.py --raw _raw/_repeat$i --baseline _bases/r$i --candidate _signal/$variant --repeat $i --ti-panel _ti/r$i/TI_COMPACT.parquet --linkage-audit _audit/linkage-r$i/INPUT_LINKAGE.json --out _replays/v2replay-$variant-r$i
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact21-signal-lockin-economic-if-eligible
          retention-days: 90
          path: _replays/
